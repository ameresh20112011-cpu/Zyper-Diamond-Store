<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>
Wallet - Zyper Diamond Store
</title>

<link
rel="icon"
href="./1.jpg"
>

<!-- WALLET DESIGN -->
<link
rel="stylesheet"
href="./wallet.css?v=3000"
>

<!-- OLD 6 BUTTON NAV -->
<link
rel="stylesheet"
href="./zyper-nav.css?v=10001"
>

</head>


<body>


<!-- =====================================================
     WALLET PAGE
===================================================== -->

<div class="wallet-page">


    <!-- =================================================
         WALLET HEADER
    ================================================== -->

    <header class="wallet-header">


        <div class="brand">


            <div class="logo">
                💎
            </div>


            <div>

                <h1>
                    Zyper Wallet
                </h1>

                <p>
                    Manage your wallet balance
                </p>

            </div>


        </div>


        <a
        href="./home.html"
        class="home-button"
        >
            ← Home
        </a>


    </header>



    <!-- =================================================
         WALLET BALANCE
    ================================================== -->

    <section class="balance-card">


        <div class="balance-top">


            <span>
                💰 Available Balance
            </span>


            <button
            id="refreshWallet"
            type="button"
            aria-label="Refresh wallet"
            >
                ↻
            </button>


        </div>



        <div class="balance">

            <span>
                LKR
            </span>

            <strong
            id="walletBalance"
            >
                --
            </strong>

        </div>



        <div class="wallet-stats">


            <div>

                <small>
                    Total Added
                </small>

                <strong
                id="totalDeposited"
                >
                    --
                </strong>

            </div>


            <div>

                <small>
                    Total Spent
                </small>

                <strong
                id="totalSpent"
                >
                    --
                </strong>

            </div>


        </div>


    </section>



    <!-- =================================================
         RECHARGE WALLET
    ================================================== -->

    <a
    href="./recharge-payment.html"
    class="wallet-recharge-button"
    id="rechargeWalletButton"
    >
        💳 Recharge Wallet
    </a>



    <!-- =================================================
         REDEEM CODE
    ================================================== -->

    <section class="redeem-card">


        <div class="section-title">


            <div class="section-icon">
                🎟️
            </div>


            <div>

                <h2>
                    Redeem Code
                </h2>

                <p>
                    Enter your Zyper redeem code
                </p>

            </div>


        </div>



        <div class="redeem-box">


            <input
            type="text"
            id="redeemCode"
            placeholder="Enter redeem code"
            autocomplete="off"
            >


            <button
            id="redeemButton"
            type="button"
            >
                Redeem
            </button>


        </div>



        <div
        id="redeemMessage"
        class="redeem-message"
        style="display:none;"
        >
        </div>


    </section>



    <!-- =================================================
         WALLET HISTORY
    ================================================== -->

    <section class="transactions-card">


        <div class="transactions-header">


            <div>

                <h2>
                    Wallet History
                </h2>

                <p>
                    Your recent wallet activity
                </p>

            </div>


            <button
            id="refreshTransactions"
            type="button"
            >
                ↻ Refresh
            </button>


        </div>



        <div
        id="transactions"
        class="transactions"
        >

            <div class="empty">
                ⏳ Loading wallet...
            </div>

        </div>


    </section>


</div>



<!-- =====================================================
     OLD 6 BUTTON BOTTOM NAV
===================================================== -->

<div id="zyper-navigation"></div>



<!-- =====================================================
     SHARED TOP BAR

     ZYPER
     DIAMOND STORE

     Guest  = LOGIN
     Login  = Wallet Balance
===================================================== -->

<script
src="./zyper-topbar.js?v=10001"
></script>



<!-- =====================================================
     OLD NAVIGATION
===================================================== -->

<script
src="./zyper-nav.js?v=10001"
></script>



<!-- =====================================================
     WALLET LOGIC
===================================================== -->

<script
type="module"
src="./wallet.js?v=3001"
></script>


</body>

</html>
