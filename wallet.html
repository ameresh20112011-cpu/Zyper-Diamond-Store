<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Zyper Wallet</title>

<link rel="icon" href="./1.jpg">

<!-- WALLET DESIGN -->
<link
    rel="stylesheet"
    href="./wallet.css"
>

<!-- BOTTOM NAVIGATION DESIGN -->
<link
    rel="stylesheet"
    href="./zyper-nav.css"
>

</head>


<body>


<div class="wallet-page">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="wallet-header">


        <div class="brand">


            <div class="logo">
                💎
            </div>


            <div>

                <h1>
                    Zyper Wallet
                </h1>

                <p>
                    Zyper Diamond Store
                </p>

            </div>


        </div>


        <a
            href="./home.html"
            class="home-btn">

            ← Home

        </a>


    </header>



    <!-- =================================================
         WALLET BALANCE
    ================================================== -->

    <section class="balance-card">


        <div class="balance-top">


            <span>
                💰 Available Balance
            </span>


            <button
                id="refreshWallet"
                type="button"
                aria-label="Refresh wallet">

                ↻

            </button>


        </div>



        <div class="balance">


            <span>
                LKR
            </span>


            <strong id="walletBalance">
                0
            </strong>


        </div>



        <div class="wallet-stats">


            <!-- TOTAL ADDED -->

            <div>

                <small>
                    Total Added
                </small>

                <strong id="totalDeposited">
                    LKR 0
                </strong>

            </div>


            <!-- TOTAL SPENT -->

            <div>

                <small>
                    Total Spent
                </small>

                <strong id="totalSpent">
                    LKR 0
                </strong>

            </div>


        </div>


    </section>



    <!-- =================================================
         REDEEM CODE
    ================================================== -->

    <section class="redeem-card">


        <div class="section-title">


            <div class="section-icon">
                🎟️
            </div>


            <div>

                <h2>
                    Redeem Code
                </h2>

                <p>
                    Enter your Zyper wallet code
                </p>

            </div>


        </div>



        <div class="redeem-box">


            <input
                type="text"
                id="redeemCode"
                placeholder="ZYPER-XXXX-XXXX"
                maxlength="15"
                autocomplete="off"
                spellcheck="false"
            >


            <button
                id="redeemButton"
                type="button">

                Redeem

            </button>


        </div>



        <div
            id="redeemMessage"
            class="redeem-message"
            style="display:none;">
        </div>


    </section>



    <!-- =================================================
         WALLET HISTORY
    ================================================== -->

    <section class="transactions-card">


        <div class="transactions-header">


            <div>

                <h2>
                    📜 Wallet History
                </h2>

                <p>
                    Recharge and wallet payment history
                </p>

            </div>


            <button
                id="refreshTransactions"
                type="button">

                ↻ Refresh

            </button>


        </div>



        <div
            id="transactions"
            class="transactions">


            <div class="loading">

                Loading transactions...

            </div>


        </div>


    </section>


</div>



<!-- =====================================================
     BOTTOM NAVIGATION

     zyper-nav.js automatically loads:
     zyper-nav.html

     Wallet becomes ACTIVE on wallet.html
===================================================== -->

<script
    src="./zyper-nav.js?v=1001">
</script>



<!-- =====================================================
     WALLET JAVASCRIPT
===================================================== -->

<script
    type="module"
    src="./wallet.js?v=1001">
</script>


</body>

</html>
