<style>

/* =====================================================
   PROFILE PAGE
===================================================== */

*{
box-sizing:border-box;
}


html{

min-height:100%;

overflow-x:hidden;

}


body{

margin:0;

min-height:100vh;

font-family:
'Segoe UI',
Arial,
sans-serif;

background:
radial-gradient(
circle at top,
#172554,
#020617 55%,
#000 100%
);

color:white;

padding:
15px
12px
140px;

display:block;

overflow-x:hidden;

overflow-y:auto;

-webkit-overflow-scrolling:touch;

}


/* =====================================================
   PROFILE CARD
===================================================== */

.profile-card{

width:100%;

max-width:430px;

margin:
20px auto 40px;

padding:
30px 22px 35px;

border-radius:28px;

background:
rgba(15,23,42,.78);

border:
1px solid rgba(255,255,255,.14);

backdrop-filter:
blur(20px);

-webkit-backdrop-filter:
blur(20px);

box-shadow:

0 20px 60px
rgba(0,0,0,.5),

0 0 35px
rgba(96,165,250,.12);

text-align:center;

position:relative;

overflow:hidden;

}


/* =====================================================
   TOP GLOW
===================================================== */

.profile-card::before{

content:"";

position:absolute;

top:-100px;

left:50%;

transform:translateX(-50%);

width:260px;

height:200px;

background:
radial-gradient(
circle,
rgba(59,130,246,.30),
transparent 70%
);

pointer-events:none;

}


/* =====================================================
   PROFILE IMAGE
===================================================== */

.avatar-container{

position:relative;

width:125px;

height:125px;

margin:
5px auto 18px;

}


.avatar{

width:125px;

height:125px;

border-radius:50%;

object-fit:cover;

display:block;

border:
4px solid #60a5fa;

background:#0f172a;

box-shadow:

0 0 15px
rgba(96,165,250,.8),

0 0 35px
rgba(168,85,247,.35);

}


/* =====================================================
   ONLINE
===================================================== */

.online-dot{

position:absolute;

right:5px;

bottom:8px;

width:20px;

height:20px;

border-radius:50%;

background:#22c55e;

border:
3px solid #0f172a;

box-shadow:
0 0 12px
rgba(34,197,94,.9);

}


/* =====================================================
   CUSTOMER BADGE
===================================================== */

.company-badge{

display:inline-block;

margin-bottom:8px;

padding:6px 12px;

border-radius:20px;

font-size:11px;

font-weight:bold;

letter-spacing:1px;

color:#bfdbfe;

background:
rgba(59,130,246,.12);

border:
1px solid rgba(96,165,250,.25);

}


/* =====================================================
   USERNAME
===================================================== */

#username{

margin:
5px 0 5px;

font-size:26px;

font-weight:800;

background:
linear-gradient(
90deg,
#60a5fa,
#c084fc,
#22d3ee
);

-webkit-background-clip:text;

background-clip:text;

color:transparent;

word-break:break-word;

}


.account-text{

margin:
0 0 22px;

font-size:13px;

color:#94a3b8;

}


/* =====================================================
   INFO GRID
===================================================== */

.info-box{

display:grid;

grid-template-columns:
1fr 1fr;

gap:10px;

margin-bottom:20px;

}


.info-item{

padding:14px 8px;

border-radius:15px;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

min-width:0;

}


.info-icon{

font-size:20px;

margin-bottom:5px;

}


.info-title{

font-size:10px;

color:#94a3b8;

text-transform:uppercase;

letter-spacing:.6px;

}


.info-value{

font-size:12px;

font-weight:600;

color:#e2e8f0;

margin-top:4px;

word-break:break-word;

}


/* =====================================================
   QUICK ACTIONS
===================================================== */

.quick-title{

text-align:left;

margin:
5px 0 10px;

font-size:12px;

font-weight:700;

color:#94a3b8;

text-transform:uppercase;

letter-spacing:.8px;

}


.quick-grid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:8px;

margin-bottom:18px;

}


.quick-action{

min-width:0;

padding:
13px 5px;

border:none;

border-radius:14px;

background:
rgba(255,255,255,.055);

border:
1px solid rgba(255,255,255,.09);

color:white;

cursor:pointer;

transition:.2s;

-webkit-tap-highlight-color:transparent;

}


.quick-action:active{

transform:scale(.95);

}


.quick-action-icon{

display:block;

font-size:21px;

margin-bottom:6px;

}


.quick-action-text{

display:block;

font-size:10px;

font-weight:700;

color:#e2e8f0;

}


.quick-action.recharge{

background:
linear-gradient(
135deg,
rgba(34,197,94,.16),
rgba(16,185,129,.08)
);

border-color:
rgba(34,197,94,.20);

}


.quick-action.history{

background:
linear-gradient(
135deg,
rgba(59,130,246,.16),
rgba(79,70,229,.08)
);

border-color:
rgba(96,165,250,.20);

}


.quick-action.help{

background:
linear-gradient(
135deg,
rgba(37,211,102,.14),
rgba(18,140,126,.07)
);

border-color:
rgba(37,211,102,.20);

}


/* =====================================================
   PROFILE BUTTON
===================================================== */

.profile-button{

width:100%;

padding:14px;

margin-top:10px;

border:none;

border-radius:15px;

font-size:15px;

font-weight:700;

color:white;

cursor:pointer;

transition:
transform .2s,
box-shadow .2s,
opacity .2s;

-webkit-tap-highlight-color:transparent;

}


.profile-button:active{

transform:scale(.96);

}


.edit-button{

background:
linear-gradient(
90deg,
#2563eb,
#7c3aed
);

box-shadow:
0 8px 25px
rgba(37,99,235,.3);

}


.logout-button{

background:
rgba(239,68,68,.12);

border:
1px solid rgba(239,68,68,.3);

color:#fca5a5;

}


.profile-button:hover{

transform:translateY(-2px);

}


/* =====================================================
   SAFE SPACE FOR FIXED NAV
===================================================== */

.nav-safe-space{

width:100%;

height:90px;

}


/* =====================================================
   EDIT PANEL
===================================================== */

.edit-panel{

display:none;

margin-top:20px;

padding:18px;

border-radius:18px;

background:
rgba(2,6,23,.65);

border:
1px solid rgba(255,255,255,.10);

text-align:left;

animation:
editOpen .25s ease;

}


.edit-panel.show{

display:block;

}


@keyframes editOpen{

from{

opacity:0;

transform:
translateY(10px);

}

to{

opacity:1;

transform:
translateY(0);

}

}


/* =====================================================
   LABEL
===================================================== */

.edit-label{

display:block;

margin:
12px 0 7px;

font-size:12px;

font-weight:bold;

color:#cbd5e1;

}


/* =====================================================
   NAME INPUT
===================================================== */

.name-input{

width:100%;

padding:13px;

border-radius:12px;

border:
1px solid rgba(255,255,255,.12);

outline:none;

background:
rgba(255,255,255,.06);

color:white;

font-size:14px;

}


.name-input:focus{

border-color:#60a5fa;

box-shadow:
0 0 12px
rgba(96,165,250,.15);

}


/* =====================================================
   FILE INPUT
===================================================== */

.file-input{

width:100%;

padding:10px;

border-radius:12px;

border:
1px dashed rgba(96,165,250,.4);

background:
rgba(96,165,250,.06);

color:#cbd5e1;

font-size:12px;

}


/* =====================================================
   PREVIEW
===================================================== */

.preview-title{

font-size:11px;

color:#94a3b8;

margin-top:14px;

}


.image-preview{

width:70px;

height:70px;

border-radius:50%;

object-fit:cover;

margin-top:8px;

border:
2px solid #60a5fa;

}


/* =====================================================
   EDIT ACTIONS
===================================================== */

.edit-actions{

display:flex;

gap:10px;

margin-top:15px;

}


.save-button{

flex:1;

padding:12px;

border:none;

border-radius:12px;

background:
linear-gradient(
90deg,
#16a34a,
#059669
);

color:white;

font-weight:bold;

cursor:pointer;

}


.cancel-button{

flex:1;

padding:12px;

border:none;

border-radius:12px;

background:#334155;

color:white;

font-weight:bold;

cursor:pointer;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

10px
12px

<div id="zyper-navigation"></div>


<script type="module">

import {
    auth
}
from "./firebase.js?v=10000";


import {
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


let currentUser = null;

const DEFAULT_IMAGE = "1.jpg";


/* =====================================================
   ELEMENTS
===================================================== */

const username =
    document.getElementById("username");

const profileImage =
    document.getElementById("profileImage");

const userEmail =
    document.getElementById("userEmail");

const memberSince =
    document.getElementById("memberSince");

const accountStatus =
    document.getElementById("accountStatus");

const editPanel =
    document.getElementById("editPanel");

const nameInput =
    document.getElementById("nameInput");

const imageInput =
    document.getElementById("imageInput");

const imagePreview =
    document.getElementById("imagePreview");

const logoutButton =
    document.querySelector(".logout-button");


/* =====================================================
   LOGIN MODAL
===================================================== */

function createLoginModal(){

    if(
        document.getElementById(
            "zyperProfileLoginModal"
        )
    ){
        return;
    }


    const modal =
        document.createElement("div");


    modal.id =
        "zyperProfileLoginModal";


    modal.innerHTML = `

<div class="zyper-profile-modal-card">

    <div class="zyper-profile-modal-icon">
        🔐
    </div>

    <h3>
        Login Required
    </h3>

    <p>
        Please login to use your
        Zyper Profile.
    </p>

    <a
    href="./index.html"
    class="zyper-profile-modal-login"
    >
        LOGIN
    </a>

    <button
    type="button"
    class="zyper-profile-modal-cancel"
    id="zyperProfileModalCancel"
    >
        Continue Browsing
    </button>

</div>

    `;


    document.body.appendChild(
        modal
    );


    document
    .getElementById(
        "zyperProfileModalCancel"
    )
    .addEventListener(
        "click",
        hideLoginPopup
    );


    modal.addEventListener(
        "click",
        function(event){

            if(
                event.target === modal
            ){
                hideLoginPopup();
            }

        }
    );

}


function showLoginPopup(){

    createLoginModal();

    const modal =
        document.getElementById(
            "zyperProfileLoginModal"
        );

    if(modal){
        modal.classList.add("show");
    }

}


function hideLoginPopup(){

    const modal =
        document.getElementById(
            "zyperProfileLoginModal"
        );

    if(modal){
        modal.classList.remove("show");
    }

}


/* =====================================================
   GUEST NOTICE
===================================================== */

function showGuestNotice(){

    const card =
        document.querySelector(
            ".profile-card"
        );

    if(
        !card ||
        document.getElementById(
            "zyperProfileGuestNotice"
        )
    ){
        return;
    }


    const notice =
        document.createElement("div");


    notice.id =
        "zyperProfileGuestNotice";


    notice.className =
        "zyper-profile-login-box";


    notice.innerHTML = `

<div class="guest-title">
    🔐 Login to use your Profile
</div>

<div class="guest-text">
    You can view this page and all options.
    Login is required to view or change
    your personal profile information.
</div>

<a
href="./index.html"
class="guest-login"
>
    LOGIN
</a>

    `;


    const badge =
        card.querySelector(
            ".company-badge"
        );


    if(
        badge &&
        badge.nextSibling
    ){

        card.insertBefore(
            notice,
            badge.nextSibling
        );

    }
    else{

        card.prepend(
            notice
        );

    }

}


function removeGuestNotice(){

    const notice =
        document.getElementById(
            "zyperProfileGuestNotice"
        );


    if(notice){
        notice.remove();
    }


    hideLoginPopup();

}


/* =====================================================
   GUEST PROFILE STATE
===================================================== */

function showGuestProfile(){

    currentUser =
        null;


    if(username){
        username.textContent =
            "Guest";
    }


    if(profileImage){
        profileImage.src =
            DEFAULT_IMAGE;
    }


    if(accountStatus){

        accountStatus.textContent =
            "Login Required";

        accountStatus.classList.add(
            "guest-private"
        );

    }


    if(userEmail){

        userEmail.textContent =
            "Login to view";

        userEmail.classList.add(
            "guest-private"
        );

    }


    if(memberSince){

        memberSince.textContent =
            "Login to view";

        memberSince.classList.add(
            "guest-private"
        );

    }


    if(nameInput){
        nameInput.value = "";
    }


    if(imagePreview){
        imagePreview.src =
            DEFAULT_IMAGE;
    }


    if(editPanel){
        editPanel.classList.remove(
            "show"
        );
    }


    if(logoutButton){

    logoutButton.innerHTML =
        "🚪 Logout";

}

    showGuestNotice();

}


/* =====================================================
   LOGGED-IN PROFILE
===================================================== */

function showUserProfile(user){

    currentUser =
        user;


    removeGuestNotice();


    if(accountStatus){

        accountStatus.textContent =
            "Active";

        accountStatus.classList.remove(
            "guest-private"
        );

    }


    if(userEmail){

        userEmail.textContent =
            user.email ||
            "Not available";

        userEmail.classList.remove(
            "guest-private"
        );

    }


    let createdDate =
        "Not available";


    if(
        user.metadata &&
        user.metadata.creationTime
    ){

        try{

            createdDate =
                new Date(
                    user.metadata.creationTime
                )
                .toLocaleDateString(
                    "en-LK",
                    {
                        year:"numeric",
                        month:"short",
                        day:"numeric"
                    }
                );

        }
        catch(error){

            console.error(
                "Creation date error:",
                error
            );

        }

    }


    if(memberSince){

        memberSince.textContent =
            createdDate;

        memberSince.classList.remove(
            "guest-private"
        );

    }


    const uid =
        user.uid;


    let savedName =
        localStorage.getItem(
            uid + "_name"
        );


    if(!savedName){

        savedName =
            user.displayName ||
            "Zyper Customer";

    }


    let savedImage =
        localStorage.getItem(
            uid + "_img"
        );


    if(!savedImage){

        savedImage =
            DEFAULT_IMAGE;

    }


    try{

        localStorage.setItem(
            uid + "_img",
            savedImage
        );

    }
    catch(error){

        console.error(
            "Profile image cache error:",
            error
        );

    }


    if(username){
        username.innerText =
            savedName;
    }


    if(profileImage){
        profileImage.src =
            savedImage;
    }


    if(nameInput){
        nameInput.value =
            savedName;
    }


    if(imagePreview){
        imagePreview.src =
            savedImage;
    }


    if(logoutButton){

        logoutButton.innerHTML =
            "🚪 Logout";

    }

}


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            showGuestProfile();

            return;

        }


        showUserProfile(
            user
        );

    }
);


/* =====================================================
   QUICK ACTIONS
===================================================== */

window.goRecharge =
function(){

    if(!currentUser){

        showLoginPopup();

        return;
    }


    window.location.href =
        "./recharge-payment.html";

};


window.goHistory =
function(){

    /*
       History page is public.
       Guest can open it and the page itself
       shows Login to view private history.
    */

    window.location.href =
        "./history.html";

};


window.goHelp =
function(){

    window.location.href =
        "./whatsapp.html";

};



window.goWallet =
function(){
    window.location.href =
        "./wallet.html";
};

window.goShop =
function(){
    window.location.href =
        "./topup.html";
};

window.goHome =
function(){
    window.location.href =
        "./home.html";
};


/* =====================================================
   EDIT PROFILE
===================================================== */

window.editProfile =
function(){

    if(!currentUser){

        showLoginPopup();

        return;
    }


    const uid =
        currentUser.uid;


    let savedName =
        localStorage.getItem(
            uid + "_name"
        );


    if(!savedName){

        savedName =
            currentUser.displayName ||
            "Zyper Customer";

    }


    let savedImage =
        localStorage.getItem(
            uid + "_img"
        );


    if(!savedImage){

        savedImage =
            DEFAULT_IMAGE;

    }


    if(nameInput){

        nameInput.value =
            savedName;

    }


    if(imagePreview){

        imagePreview.src =
            savedImage;

    }


    if(imageInput){

        imageInput.value =
            "";

    }


    if(editPanel){

        editPanel.classList.add(
            "show"
        );

    }

};


/* =====================================================
   IMAGE PREVIEW
===================================================== */

if(imageInput){

    imageInput.addEventListener(

        "change",

        function(event){


            if(!currentUser){

                event.target.value =
                    "";

                showLoginPopup();

                return;

            }


            const file =
                event.target.files[0];


            if(!file){
                return;
            }


            if(
                file.size >
                2 * 1024 * 1024
            ){

                alert(
                    "Please select an image smaller than 2MB."
                );

                event.target.value =
                    "";

                return;

            }


            if(
                !file.type.startsWith(
                    "image/"
                )
            ){

                alert(
                    "Please select a valid image."
                );

                event.target.value =
                    "";

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
            function(){

                if(imagePreview){

                    imagePreview.src =
                        reader.result;

                }

            };


            reader.readAsDataURL(
                file
            );

        }

    );

}


/* =====================================================
   SAVE PROFILE
===================================================== */

window.saveProfile =
function(){

    if(!currentUser){

        showLoginPopup();

        return;

    }


    const uid =
        currentUser.uid;


    let name =
        nameInput
        ? nameInput.value.trim()
        : "";


    if(!name){

        name =
            "Zyper Customer";

    }


    if(
        name.length >
        40
    ){

        name =
            name.substring(
                0,
                40
            );

    }


    localStorage.setItem(
        uid + "_name",
        name
    );


    const file =
        imageInput
        ? imageInput.files[0]
        : null;


    if(file){

        const reader =
            new FileReader();


        reader.onload =
        function(){

            const imageData =
                reader.result;


            try{

                localStorage.setItem(
                    uid + "_img",
                    imageData
                );


                finishProfileSave(
                    name,
                    imageData
                );

            }
            catch(error){

                console.error(
                    "Profile image save error:",
                    error
                );


                alert(
                    "Image is too large to save. Please choose a smaller image."
                );

            }

        };


        reader.readAsDataURL(
            file
        );

    }
    else{

        let existingImage =
            localStorage.getItem(
                uid + "_img"
            );


        if(!existingImage){

            existingImage =
                DEFAULT_IMAGE;


            localStorage.setItem(
                uid + "_img",
                DEFAULT_IMAGE
            );

        }


        finishProfileSave(
            name,
            existingImage
        );

    }

};


/* =====================================================
   FINISH SAVE
===================================================== */

function finishProfileSave(
    name,
    image
){

    if(profileImage){

        profileImage.src =
            image;

    }


    if(username){

        username.innerText =
            name;

    }


    if(imagePreview){

        imagePreview.src =
            image;

    }


    if(imageInput){

        imageInput.value =
            "";

    }


    if(editPanel){

        editPanel.classList.remove(
            "show"
        );

    }


    const savedNotice =
        document.createElement(
            "div"
        );


    savedNotice.style.position =
        "fixed";

    savedNotice.style.left =
        "50%";

    savedNotice.style.bottom =
        "105px";

    savedNotice.style.transform =
        "translateX(-50%)";

    savedNotice.style.zIndex =
        "10001";

    savedNotice.style.padding =
        "12px 20px";

    savedNotice.style.borderRadius =
        "14px";

    savedNotice.style.background =
        "rgba(22,163,74,.95)";

    savedNotice.style.border =
        "1px solid rgba(134,239,172,.5)";

    savedNotice.style.color =
        "white";

    savedNotice.style.fontSize =
        "13px";

    savedNotice.style.fontWeight =
        "600";

    savedNotice.style.whiteSpace =
        "nowrap";

    savedNotice.style.boxShadow =
        "0 10px 30px rgba(0,0,0,.4)";

    savedNotice.innerText =
        "✅ Profile saved successfully";


    document.body.appendChild(
        savedNotice
    );


    setTimeout(
        function(){

            savedNotice.style.opacity =
                "0";

            savedNotice.style.transition =
                "opacity .3s";


            setTimeout(
                function(){

                    savedNotice.remove();

                },
                300
            );

        },
        2000
    );

}


/* =====================================================
   CANCEL EDIT
===================================================== */

window.cancelEdit =
function(){

    if(editPanel){

        editPanel.classList.remove(
            "show"
        );

    }


    if(imageInput){

        imageInput.value =
            "";

    }


    if(!currentUser){
        return;
    }


    const uid =
        currentUser.uid;


    let savedName =
        localStorage.getItem(
            uid + "_name"
        );


    let savedImage =
        localStorage.getItem(
            uid + "_img"
        );


    if(!savedName){

        savedName =
            currentUser.displayName ||
            "Zyper Customer";

    }


    if(!savedImage){

        savedImage =
            DEFAULT_IMAGE;

    }


    if(nameInput){

        nameInput.value =
            savedName;

    }


    if(imagePreview){

        imagePreview.src =
            savedImage;

    }

};


/* =====================================================
   LOGOUT / LOGIN BUTTON
===================================================== */

window.logout =
async function(){

    if(!currentUser){

        showLoginPopup();

        return;

    }


    try{

        await signOut(
            auth
        );


        window.location.href =
            "./home.html";

    }
    catch(error){

        console.error(
            "Logout error:",
            error
        );


        alert(
            "Logout failed. Please try again."
        );

    }

};


/* =====================================================
   START
===================================================== */

createLoginModal();

</script>
