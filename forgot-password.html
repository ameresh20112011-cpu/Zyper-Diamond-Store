<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Forgot Password - Zyper Diamond Store</title>

<link rel="icon" href="1.jpg">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Poppins,sans-serif;
    color:white;

    background:
    radial-gradient(circle at top left,#07598555,transparent 35%),
    radial-gradient(circle at bottom right,#7e22ce55,transparent 35%),
    #020617;
}

.card{
    width:100%;
    max-width:420px;
    padding:32px 25px;
    border-radius:25px;

    background:rgba(15,23,42,.85);
    border:1px solid rgba(255,255,255,.1);

    box-shadow:
    0 25px 70px rgba(0,0,0,.55),
    0 0 35px rgba(0,150,255,.08);

    backdrop-filter:blur(18px);
}

.logo{
    width:80px;
    height:80px;
    object-fit:cover;
    display:block;
    margin:0 auto 18px;
    border-radius:22px;
}

h1{
    text-align:center;
    font-size:26px;
    margin-bottom:8px;

    background:linear-gradient(
        90deg,
        #00c6ff,
        #8b5cf6,
        #ec4899
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    font-size:13px;
    line-height:1.6;
    margin-bottom:25px;
}

label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:8px;
    color:#cbd5e1;
}

.input-box{
    position:relative;
}

.input-box span{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    font-size:17px;
}

input{
    width:100%;
    height:54px;

    border-radius:14px;
    border:1px solid rgba(255,255,255,.1);

    outline:none;

    background:#020617cc;
    color:white;

    padding:0 15px 0 45px;

    font-family:Poppins,sans-serif;
    font-size:14px;

    transition:.25s;
}

input:focus{
    border-color:#38bdf8;
    box-shadow:0 0 0 3px #38bdf81a;
}

input::placeholder{
    color:#64748b;
}

button{
    width:100%;
    height:54px;
    margin-top:18px;

    border:0;
    border-radius:15px;

    color:white;
    font-family:Poppins,sans-serif;
    font-size:14px;
    font-weight:700;

    cursor:pointer;

    background:linear-gradient(
        135deg,
        #009dff,
        #6d28d9
    );

    box-shadow:0 10px 30px #009dff33;

    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;

    margin-top:17px;
    padding:13px;

    border-radius:12px;

    font-size:12px;
    line-height:1.5;
    text-align:center;
}

.message.success{
    display:block;
    color:#86efac;
    background:#16a34a15;
    border:1px solid #22c55e40;
}

.message.error{
    display:block;
    color:#fca5a5;
    background:#ef444415;
    border:1px solid #ef444440;
}

.back{
    display:block;
    text-align:center;

    margin-top:20px;

    color:#94a3b8;
    text-decoration:none;

    font-size:13px;
}

.back:hover{
    color:#38bdf8;
}

.loading{
    display:inline-block;

    width:15px;
    height:15px;

    border:2px solid #ffffff55;
    border-top-color:white;

    border-radius:50%;

    animation:spin .7s linear infinite;

    vertical-align:middle;

    margin-right:7px;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

@media(max-width:480px){

    .card{
        padding:28px 20px;
    }

    h1{
        font-size:23px;
    }

}

</style>

</head>

<body>

<div class="card">

    <img
        src="1.jpg"
        class="logo"
        alt="Zyper Diamond Store">

    <h1>
        Forgot Password?
    </h1>

    <p class="subtitle">
        Enter your registered Gmail address
        to reset your Zyper Diamond Store password.
    </p>

    <form id="forgotForm">

        <label for="email">
            Gmail Address
        </label>

        <div class="input-box">

            <span>📧</span>

            <input
                type="email"
                id="email"
                placeholder="Enter your Gmail"
                autocomplete="email"
                required>

        </div>

        <button
            type="submit"
            id="resetBtn">

            Send Reset Email

        </button>

    </form>

    <div
        id="message"
        class="message">
    </div>

    <a
        href="index.html"
        class="back">

        ← Back to Login

    </a>

</div>


<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    sendPasswordResetEmail
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyCd_2LplLOl4TOGjbWQqndwHNGzPh2PEHM",

    authDomain:
    "zyper-d-iamond-store.firebaseapp.com",

    projectId:
    "zyper-d-iamond-store",

    storageBucket:
    "zyper-d-iamond-store.firebasestorage.app",

    messagingSenderId:
    "892467477866",

    appId:
    "1:892467477866:web:61e9b6ff9435798da23913"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const WORKER_URL =
"https://zyper-forgot-password.ameresh20112011.workers.dev";


const form =
document.getElementById("forgotForm");

const emailInput =
document.getElementById("email");

const resetBtn =
document.getElementById("resetBtn");

const message =
document.getElementById("message");


function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;

}


function loading(text){

    resetBtn.disabled =
        true;

    resetBtn.innerHTML =
        '<span class="loading"></span>' +
        text;

}


function normalButton(){

    resetBtn.disabled =
        false;

    resetBtn.textContent =
        "Send Reset Email";

}


form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        message.className =
            "message";

        message.textContent =
            "";


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        if(!email){

            showMessage(
                "Please enter your Gmail address.",
                "error"
            );

            return;

        }


        if(
            !email.endsWith("@gmail.com")
        ){

            showMessage(
                "Please enter a valid Gmail address.",
                "error"
            );

            return;

        }


        loading("Checking...");


        try{


            const response =
                await fetch(
                    WORKER_URL,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email:email
                            })
                    }
                );


            const result =
                await response.json();


            if(!response.ok){

                throw new Error(
                    result.error ||
                    "Unable to check email."
                );

            }


            if(
                result.registered !== true
            ){

                showMessage(
                    "❌ This Gmail is not registered. Please create an account first.",
                    "error"
                );

                normalButton();

                return;

            }


            loading("Sending...");


            await sendPasswordResetEmail(
                auth,
                email
            );


            showMessage(
                "✅ Password reset email sent. Please check your Gmail inbox and spam folder.",
                "success"
            );


            emailInput.value = "";


        }

        catch(error){

            console.error(
                "FORGOT PASSWORD ERROR:",
                error
            );


            let text =
                "Something went wrong. Please try again.";


            if(
                error.code ===
                "auth/invalid-email"
            ){

                text =
                    "Please enter a valid Gmail address.";

            }

            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                text =
                    "Too many requests. Please wait and try again.";

            }

            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                text =
                    "Network error. Check your internet connection.";

            }

            else if(
                error.message
            ){

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }


        normalButton();

    }
);

</script>

</body>
</html>
