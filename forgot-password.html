<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Zyper Diamond Store - Forgot Password</title>

<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="media.css">

<link rel="icon" href="1.jpg">

<style>

.login-header{
    text-align:center;
    margin-bottom:28px;
}

.company-logo{

    width:76px !important;
    height:76px !important;

    margin:0 auto 15px !important;

    padding:0 !important;

    border-radius:50% !important;

    overflow:hidden !important;

    display:flex !important;

    align-items:center !important;
    justify-content:center !important;

    background:#fff;

    box-shadow:
    0 8px 25px rgba(0,0,0,.20);
}

.company-logo img{

    width:100% !important;
    height:100% !important;

    object-fit:cover !important;

    display:block !important;

    border-radius:50% !important;
}

.brand-name{

    margin:0;

    font-size:24px;

    font-weight:800;
}

.brand-subtitle{

    margin:7px 0 0;

    font-size:13px;

    opacity:.7;
}

.reset-message{

    display:none;

    text-align:center;

    margin-top:15px;

    font-size:14px;

    font-weight:600;

    line-height:1.5;
}

@media(max-width:500px){

    .company-logo{

        width:68px !important;
        height:68px !important;
    }

    .brand-name{

        font-size:21px;
    }

}

</style>

</head>


<body>

<div class="login-container">

<div class="login-card">


<div class="login-header">

<div class="company-logo">

<img
src="1.jpg"
alt="Zyper Diamond Store">

</div>


<h2 class="brand-name">
Forgot Password?
</h2>


<p class="brand-subtitle">
Enter your email to reset your password
</p>

</div>



<form
id="resetForm"
class="login-form"
novalidate>


<div class="form-group">

<div class="input-group neu-input">

<input
type="email"
id="email"
required
placeholder=" "
autocomplete="email">

<label for="email">
Email Address
</label>

</div>

</div>


<button
type="submit"
class="neu-button login-btn"
id="resetButton">

<span id="resetText">
Send Reset Email
</span>

<span
id="resetLoading"
style="display:none;">

Sending...

</span>

</button>


<div
id="resetMessage"
class="reset-message">
</div>


</form>


<div class="signup-link">

<p>

Remember your password?

<a href="index.html">
Back to Login
</a>

</p>

</div>


</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
sendPasswordResetEmail
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

apiKey:
"AIzaSyCd_2LplLOl4TOGjbWQqndwHNGzPh2PEHM",

authDomain:
"zyper-d-iamond-store.firebaseapp.com",

projectId:
"zyper-d-iamond-store",

storageBucket:
"zyper-d-iamond-store.firebasestorage.app",

messagingSenderId:
"892467477866",

appId:
"1:892467477866:web:61e9b6ff9435798da23913"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);


const form =
document.getElementById("resetForm");

const email =
document.getElementById("email");

const button =
document.getElementById("resetButton");

const resetText =
document.getElementById("resetText");

const resetLoading =
document.getElementById("resetLoading");

const message =
document.getElementById("resetMessage");


form.addEventListener("submit", async (e) => {

    e.preventDefault();


    const emailValue =
        email.value.trim();


    if(!emailValue){

        alert(
            "Please enter your email."
        );

        email.focus();

        return;

    }


    try{

        button.disabled = true;

        resetText.style.display = "none";

        resetLoading.style.display = "inline";


        await sendPasswordResetEmail(
            auth,
            emailValue
        );


        message.style.display =
            "block";

        message.style.color =
            "#00c853";

        message.textContent =
            "Password reset email sent. Please check your inbox.";


    }catch(error){

        console.error(
            "RESET ERROR:",
            error
        );


        message.style.display =
            "block";

        message.style.color =
            "#ff1744";


        if(
            error.code ===
            "auth/user-not-found"
        ){

            message.textContent =
                "No account found with this email.";

        }

        else if(
            error.code ===
            "auth/invalid-email"
        ){

            message.textContent =
                "Please enter a valid email.";

        }

        else{

            message.textContent =
                "Password reset failed: " +
                error.message;

        }

    }finally{

        button.disabled = false;

        resetText.style.display =
            "inline";

        resetLoading.style.display =
            "none";

    }

});

</script>

</body>
</html>
