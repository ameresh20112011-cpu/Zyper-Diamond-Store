<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#070b18">

    <title>Forgot Password - Zyper Diamond Store</title>

    <link rel="icon" href="1.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Poppins", sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 102, 255, 0.20), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(145, 0, 255, 0.20), transparent 35%),
                linear-gradient(135deg, #030712, #0a1020, #050816);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: rgba(0, 140, 255, 0.15);
            filter: blur(80px);
            top: -80px;
            left: -80px;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(168, 0, 255, 0.12);
            filter: blur(90px);
            bottom: -100px;
            right: -80px;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 430px;
            position: relative;
            z-index: 2;
        }

        .card {
            width: 100%;
            padding: 34px 28px 30px;
            border-radius: 26px;

            background: rgba(10, 17, 35, 0.82);

            border: 1px solid rgba(255, 255, 255, 0.10);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            animation: cardIn 0.6s ease;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;

            border-radius: 22px;

            object-fit: cover;

            display: block;

            border: 2px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                0 0 25px rgba(0, 132, 255, 0.35),
                0 0 50px rgba(117, 0, 255, 0.12);
        }

        .title {
            text-align: center;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 7px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #8ec5ff,
                #b68cff
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 27px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            opacity: 0.8;
            pointer-events: none;
        }

        input {
            width: 100%;
            height: 53px;

            border-radius: 14px;

            border: 1px solid rgba(255, 255, 255, 0.10);

            outline: none;

            background: rgba(255, 255, 255, 0.055);

            color: #ffffff;

            font-family: "Poppins", sans-serif;

            font-size: 14px;

            padding: 0 15px 0 45px;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #4f8cff;

            background: rgba(255, 255, 255, 0.075);

            box-shadow:
                0 0 0 3px rgba(79, 140, 255, 0.12),
                0 0 25px rgba(79, 140, 255, 0.08);
        }

        .reset-btn {
            width: 100%;
            height: 54px;

            border: none;
            border-radius: 15px;

            cursor: pointer;

            font-family: "Poppins", sans-serif;

            font-size: 15px;
            font-weight: 700;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #1677ff,
                    #6d35ff
                );

            box-shadow:
                0 10px 30px rgba(53, 101, 255, 0.30);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }

        .reset-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 38px rgba(53, 101, 255, 0.42);
        }

        .reset-btn:active {
            transform: scale(0.98);
        }

        .reset-btn:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            transform: none;
            box-shadow: none;
        }

        .message {
            display: none;

            margin-top: 18px;

            padding: 13px 14px;

            border-radius: 13px;

            font-size: 12px;
            line-height: 1.55;

            text-align: center;
        }

        .message.success {
            display: block;

            color: #bbf7d0;

            background: rgba(34, 197, 94, 0.10);

            border: 1px solid rgba(34, 197, 94, 0.22);
        }

        .message.error {
            display: block;

            color: #fecaca;

            background: rgba(239, 68, 68, 0.10);

            border: 1px solid rgba(239, 68, 68, 0.22);
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 23px;

            color: #93c5fd;

            font-size: 13px;

            text-decoration: none;

            font-weight: 600;

            transition: color 0.2s ease;
        }

        .back:hover {
            color: #ffffff;
        }

        .security {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            margin-top: 20px;

            color: #64748b;

            font-size: 10px;
        }

        .security span {
            color: #4ade80;
            font-size: 13px;
        }

        .loading {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        .spinner {
            width: 16px;
            height: 16px;

            border-radius: 50%;

            border: 2px solid rgba(255,255,255,0.35);

            border-top-color: #ffffff;

            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 30px 21px 26px;
                border-radius: 22px;
            }

            .logo {
                width: 68px;
                height: 68px;
            }

            .title {
                font-size: 24px;
            }

            .subtitle {
                font-size: 12px;
            }
        }

    </style>
</head>

<body>

    <main class="container">

        <section class="card">

            <img
                src="1.jpg"
                alt="Zyper Diamond Store"
                class="logo"
                onerror="this.style.display='none';"
            >

            <h1 class="title">
                Forgot Password?
            </h1>

            <p class="subtitle">
                Enter your registered email address and
                we'll send you a secure password reset link.
            </p>

            <form id="forgotPasswordForm">

                <div class="input-group">

                    <label
                        class="label"
                        for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉️
                        </span>

                        <input
                            id="email"
                            type="email"
                            autocomplete="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>

                <button
                    type="submit"
                    class="reset-btn"
                    id="resetBtn">

                    Send Reset Link

                </button>

            </form>

            <div
                id="message"
                class="message">
            </div>

            <a
                href="login.html"
                class="back">
                ← Back to Login
            </a>

            <div class="security">
                <span>🔒</span>
                Secure password recovery
            </div>

        </section>

    </main>


    <!-- Firebase -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        import {
            getAuth,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


        /*
         * IMPORTANT:
         * Use the SAME Firebase configuration
         * that you use on login.html.
         */

        const firebaseConfig = {

            apiKey: "YOUR_API_KEY",

            authDomain: "YOUR_PROJECT.firebaseapp.com",

            projectId: "YOUR_PROJECT_ID",

            storageBucket: "YOUR_PROJECT.appspot.com",

            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

            appId: "YOUR_APP_ID"

        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        const form =
            document.getElementById(
                "forgotPasswordForm"
            );

        const emailInput =
            document.getElementById(
                "email"
            );

        const resetBtn =
            document.getElementById(
                "resetBtn"
            );

        const message =
            document.getElementById(
                "message"
            );


        function showMessage(
            text,
            type
        ) {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        function getFirebaseError(
            error
        ) {

            switch (error.code) {

                case "auth/invalid-email":

                    return "Please enter a valid email address.";

                case "auth/user-not-found":

                    return "No account was found with this email address.";

                case "auth/too-many-requests":

                    return "Too many attempts. Please wait a while and try again.";

                case "auth/network-request-failed":

                    return "Network error. Please check your internet connection.";

                case "auth/invalid-api-key":

                    return "Firebase configuration is incorrect.";

                case "auth/app-not-authorized":

                    return "This website is not authorized in your Firebase project.";

                default:

                    return error.message ||
                        "Unable to send the reset email. Please try again.";

            }

        }


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    emailInput.value
                        .trim();


                if (!email) {

                    showMessage(
                        "Please enter your email address.",
                        "error"
                    );

                    return;

                }


                resetBtn.disabled = true;

                resetBtn.innerHTML = `
                    <span class="loading">
                        <span class="spinner"></span>
                        Sending...
                    </span>
                `;


                message.className =
                    "message";


                try {

                    await sendPasswordResetEmail(
                        auth,
                        email
                    );


                    showMessage(
                        "Password reset email sent successfully. Please check your inbox and spam folder.",
                        "success"
                    );


                    emailInput.value = "";


                } catch (error) {

                    console.error(
                        "Password reset error:",
                        error
                    );


                    showMessage(
                        getFirebaseError(error),
                        "error"
                    );

                } finally {

                    resetBtn.disabled = false;

                    resetBtn.textContent =
                        "Send Reset Link";

                }

            }
        );

    </script>

</body>
</html>
