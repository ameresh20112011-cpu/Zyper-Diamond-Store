<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Zyper Diamond Store - Forgot Password</title>

<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="media.css">
<link rel="icon" href="1.jpg">

<style>

.login-header{
    text-align:center;
    margin-bottom:28px;
}

.company-logo{
    width:76px !important;
    height:76px !important;

    min-width:76px !important;
    min-height:76px !important;

    max-width:76px !important;
    max-height:76px !important;

    margin:0 auto 15px !important;
    padding:0 !important;

    border-radius:50% !important;
    overflow:hidden !important;

    display:flex !important;
    align-items:center !important;
    justify-content:center !important;

    background:#fff;

    box-shadow:
    0 8px 25px rgba(0,0,0,.20);
}

.company-logo img{
    width:100% !important;
    height:100% !important;

    display:block !important;

    object-fit:cover !important;

    border-radius:50% !important;
}

.brand-name{
    margin:0;
    font-size:24px;
    font-weight:800;
}

.brand-subtitle{
    margin:7px 0 0;
    opacity:.7;
    font-size:13px;
    line-height:1.5;
}

/* ICON INPUT */

.icon-input{
    position:relative;
}

.icon-input .field-icon{
    position:absolute;

    left:16px;
    top:50%;

    transform:translateY(-50%);

    z-index:15;

    font-size:17px;

    pointer-events:none;

    opacity:.8;
}

.icon-input input{
    padding-left:48px !important;
}

.icon-input label{
    left:48px !important;
}


/* EMAIL ROW */

.email-row{
    display:flex;
    gap:8px;
    align-items:stretch;
}

.email-row .input-group{
    flex:1;
    min-width:0;
}

.send-code-btn{
    min-width:95px;

    border:0;

    border-radius:12px;

    padding:0 12px;

    cursor:pointer;

    font-weight:700;

    font-size:12px;

    background:#ffffff;

    color:#111827;

    box-shadow:
    0 5px 15px rgba(0,0,0,.15);
}

.send-code-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}


/* OTP AREA */

.otp-area{
    display:none;

    margin-top:15px;

    padding:16px 12px;

    border-radius:15px;

    background:
    rgba(255,255,255,.04);

    border:
    1px solid rgba(255,255,255,.08);
}

.otp-title{
    text-align:center;

    font-size:13px;

    margin-bottom:12px;

    opacity:.8;
}

.otp-boxes{
    display:flex;

    justify-content:center;

    gap:7px;

    margin-bottom:13px;
}

input.otp-box,
.otp-boxes input.otp-box{
    width:42px !important;
    height:48px !important;

    padding:0 !important;

    background:#ffffff !important;
    background-color:#ffffff !important;

    color:#000000 !important;
    -webkit-text-fill-color:#000000 !important;

    border:2px solid #94a3b8 !important;

    outline:none !important;

    border-radius:10px !important;

    text-align:center !important;

    font-size:21px !important;

    font-weight:800 !important;

    caret-color:#000000 !important;

    box-shadow:
    0 4px 12px rgba(0,0,0,.20) !important;

    opacity:1 !important;
}

input.otp-box:focus,
.otp-boxes input.otp-box:focus{
    background:#ffffff !important;

    color:#000000 !important;
    -webkit-text-fill-color:#000000 !important;

    border-color:#3b82f6 !important;

    box-shadow:
    0 0 0 3px rgba(59,130,246,.25),
    0 4px 12px rgba(0,0,0,.20) !important;
}

input.otp-box:disabled{
    background:#ffffff !important;

    color:#000000 !important;
    -webkit-text-fill-color:#000000 !important;

    opacity:1 !important;
}

.verify-code-btn{
    width:100%;

    min-height:44px;

    border:0;

    border-radius:12px;

    cursor:pointer;

    font-weight:800;

    background:#ffffff;

    color:#111827;
}

.verify-code-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}


/* PASSWORD */

.password-section{
    display:none;
    margin-top:18px;
}

.password-group{
    position:relative;
}

.password-group input{
    padding-right:55px !important;
}

.password-toggle{
    position:absolute;

    right:8px;
    top:50%;

    transform:translateY(-50%);

    width:40px;
    height:40px;

    border:0;

    background:transparent;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:20;
}

.password-toggle svg{
    width:21px;
    height:21px;
}


/* STATUS */

.status{
    display:none;

    text-align:center;

    margin-top:15px;

    padding:10px;

    border-radius:10px;

    font-size:13px;

    font-weight:700;
}

.back-login{
    margin-top:28px !important;
    text-align:center;
}

.back-login a{
    text-decoration:none;
    font-weight:700;
}


/* MOBILE */

@media(max-width:500px){

    .company-logo{
        width:68px !important;
        height:68px !important;

        min-width:68px !important;
        min-height:68px !important;

        max-width:68px !important;
        max-height:68px !important;
    }

    .brand-name{
        font-size:21px;
    }

    input{
        font-size:16px !important;
    }

    .email-row{
        gap:6px;
    }

    .send-code-btn{
        min-width:86px;
        font-size:11px;
    }

    input.otp-box,
    .otp-boxes input.otp-box{
        width:38px !important;
        height:46px !important;
    }

}

</style>

</head>


<body>


<div class="login-container">

<div class="login-card">


<!-- HEADER -->

<div class="login-header">

<div class="company-logo">

<img
src="1.jpg"
alt="Zyper Diamond Store"
>

</div>


<h2 class="brand-name">
Zyper Diamond Store
</h2>


<p class="brand-subtitle">
Reset your password securely
</p>

</div>



<!-- EMAIL -->

<div class="form-group">

<div class="email-row">

<div class="input-group neu-input icon-input">

<span class="field-icon">
✉️
</span>

</div>



<!-- OTP -->

<div
id="otpArea"

>

Enter the 6-digit verification code sent to your Gmail
</div>


<div class="otp-boxes">

<input
class="otp-box"
maxlength="1"
inputmode="numeric"
autocomplete="one-time-code"
>

<input
class="otp-box"
maxlength="1"
inputmode="numeric"
>

<input
class="otp-box"
maxlength="1"
inputmode="numeric"
>

<input
class="otp-box"
maxlength="1"
inputmode="numeric"
>

<input
class="otp-box"
maxlength="1"
inputmode="numeric"
>

<input
class="otp-box"
maxlength="1"
inputmode="numeric"
>

</div>


<button
type="button"
id="verifyCodeButton"
class="verify-code-btn"
>

Verify Code

</button>

</div>



<!-- NEW PASSWORD -->

<div
id="passwordSection"
class="password-section"
>


<div class="form-group">

<div
class="input-group neu-input password-group icon-input"
>

<span class="field-icon">
🔒
</span>

<input
type="password"
id="newPassword"
required
placeholder=" "
minlength="6"

>

<label for="newPassword">
New Password
</label>


<button
type="button"

>

<svg

>

/>

/>

<line
x1="1"
y1="1"

/>

</svg>

<div
class="input-group neu-input password-group icon-input"
>

<span class="field-icon">
🔐
</span>

<input
type="password"
id="confirmPassword"
required

>

<label for="confirmPassword">
Re-enter Password

<button

<svg

>

<path

/>

<circle
cx="12"
cy="12"
r="3"
/>

</svg>


<svg
class="eye-closed"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
style="display:none;"
>

<path
d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8"
/>

<path
d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8"
/>

<line
x1="1"
y1="1"
x2="23"
y2="23"
/>

</svg>

</button>

</div>

<button
type="button"
class="neu-button login-btn"
id="resetPasswordButton"
>

<span id="resetText">
Reset Password
</span>

id="resetLoading"
style="display:none;"
>

Changing Password...

</span>

id="status"
class="status"

aria-live="polite"
>
</div>

<a href="./index.html">
← Back to Login
</a>

</div>

<script>

const OTP_WORKER =
"https://zyper-email-otp.ameresh20112011.workers.dev/";


const email =
document.getElementById(
    "email"
);

const sendCodeButton =
document.getElementById(
    "sendCodeButton"
);

const otpArea =
document.getElementById(
    "otpArea"
);

const otpBoxes =
Array.from(
    document.querySelectorAll(
        ".otp-box"
    )
);

const verifyCodeButton =
document.getElementById(
    "verifyCodeButton"
);

const passwordSection =
document.getElementById(
    "passwordSection"
);

const newPassword =
document.getElementById(
    "newPassword"
);

const confirmPassword =
document.getElementById(
    "confirmPassword"
);

const resetPasswordButton =
document.getElementById(
    "resetPasswordButton"
);

const resetText =
document.getElementById(
    "resetText"
);

const resetLoading =
document.getElementById(
    "resetLoading"
);

const status =
document.getElementById(
    "status"
);


let verifiedEmail =
"";

let resetToken =
"";

let resendTimer =
null;



function showStatus(
    message,
    success = false
){

    status.style.display =
    "block";

    status.textContent =
    message;

    status.style.color =
    success
    ?
    "#22c55e"
    :
    "#f87171";

    status.style.background =
    success
    ?
    "rgba(34,197,94,.08)"
    :
    "rgba(239,68,68,.08)";

}


function clearStatus(){

    status.style.display =
    "none";

    status.textContent =
    "";

}



/* PASSWORD EYES */

document
.querySelectorAll(
    ".password-toggle"
)
.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                const input =
                document.getElementById(
                    button.dataset.target
                );

                const eyeOpen =
                button.querySelector(
                    ".eye-open"
                );

                const eyeClosed =
                button.querySelector(
                    ".eye-closed"
                );


                if(
                    input.type ===
                    "password"
                ){

                    input.type =
                    "text";

                    eyeOpen.style.display =
                    "none";

                    eyeClosed.style.display =
                    "block";

                }

                else{

                    input.type =
                    "password";

                    eyeOpen.style.display =
                    "block";

                    eyeClosed.style.display =
                    "none";

                }

            }
        );

    }
);



/* OTP INPUT */

otpBoxes.forEach(
    function(box,index){

        box.addEventListener(
            "input",
            function(){

                box.value =
                box.value
                .replace(/\D/g,"")
                .slice(0,1);


                if(
                    box.value &&
                    index <
                    otpBoxes.length - 1
                ){

                    otpBoxes[
                        index + 1
                    ].focus();

                }

            }
        );


        box.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key === "Backspace" &&
                    !box.value &&
                    index > 0
                ){

                    otpBoxes[
                        index - 1
                    ].focus();

                }

            }
        );


        box.addEventListener(
            "paste",
            function(event){

                const text =
                (
                    event.clipboardData ||
                    window.clipboardData
                )
                .getData("text")
                .replace(/\D/g,"")
                .slice(0,6);


                if(!text){

                    return;

                }


                event.preventDefault();


                text
                .split("")
                .forEach(
                    function(number,i){

                        if(
                            otpBoxes[i]
                        ){

                            otpBoxes[i].value =
                            number;

                        }

                    }
                );

            }
        );

    }
);



/* EMAIL CHANGE */

email.addEventListener(
    "input",
    function(){

        const value =
        email.value
        .trim()
        .toLowerCase();


        if(
            verifiedEmail &&
            value !==
            verifiedEmail
        ){

            verifiedEmail =
            "";

            resetToken =
            "";

            passwordSection.style.display =
            "none";

            otpArea.style.display =
            "none";

        }

    }
);



/* 60 SECOND RESEND TIMER */

function startTimer(){

    let seconds =
    60;


    sendCodeButton.disabled =
    true;


    sendCodeButton.textContent =
    "60s";


    if(resendTimer){

        clearInterval(
            resendTimer
        );

    }


    resendTimer =
    setInterval(
        function(){

            seconds--;


            if(
                seconds <= 0
            ){

                clearInterval(
                    resendTimer
                );

                resendTimer =
                null;

                sendCodeButton.disabled =
                false;

                sendCodeButton.textContent =
                "Resend";

                return;

            }


            sendCodeButton.textContent =
            seconds +
            "s";

        },
        1000
    );

}



/* SEND RESET OTP */

sendCodeButton.addEventListener(
    "click",
    async function(){

        clearStatus();


        const emailValue =
        email.value
        .trim()
        .toLowerCase();


        if(
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(
                emailValue
            )
        ){

            showStatus(
                "Please enter a valid email address."
            );

            email.focus();

            return;

        }


        sendCodeButton.disabled =
        true;

        sendCodeButton.textContent =
        "Sending...";


        try{

            const response =
            await fetch(
                OTP_WORKER,
                {

                    method:
                    "POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify({

                        action:
                        "send_reset_otp",

                        email:
                        emailValue

                    })

                }
            );


            const data =
            await response.json();


            if(
                !response.ok ||
                !data.success
            ){

                throw new Error(
                    data.message ||
                    "Unable to send verification code."
                );

            }


            otpArea.style.display =
            "block";

            passwordSection.style.display =
            "none";

            verifiedEmail =
            "";

            resetToken =
            "";


            otpBoxes.forEach(
                function(box){

                    box.disabled =
                    false;

                    box.value =
                    "";

                }
            );


            verifyCodeButton.disabled =
            false;

            verifyCodeButton.textContent =
            "Verify Code";


            otpBoxes[0].focus();


            showStatus(
                "If this email is registered, a verification code has been sent.",
                true
            );


            startTimer();

        }

        catch(error){

            console.error(
                "SEND RESET OTP ERROR:",
                error
            );


            sendCodeButton.disabled =
            false;

            sendCodeButton.textContent =
            "Send Code";


            showStatus(
                error.message ||
                "Unable to send verification code."
            );

        }

    }
);



/* VERIFY RESET OTP */

verifyCodeButton.addEventListener(
    "click",
    async function(){

        clearStatus();


        const emailValue =
        email.value
        .trim()
        .toLowerCase();


        const otp =
        otpBoxes
        .map(
            box =>
            box.value
        )
        .join("");


        if(
            otp.length !== 6
        ){

            showStatus(
                "Enter the complete 6-digit verification code."
            );

            return;

        }


        verifyCodeButton.disabled =
        true;

        verifyCodeButton.textContent =
        "Verifying...";


        try{

            const response =
            await fetch(
                OTP_WORKER,
                {

                    method:
                    "POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify({

                        action:
                        "verify_reset_otp",

                        email:
                        emailValue,

                        otp:
                        otp

                    })

                }
            );


            const data =
            await response.json();


            if(
                !response.ok ||
                !data.success ||
                !data.verified ||
                !data.resetToken
            ){

                throw new Error(
                    data.message ||
                    "Incorrect verification code."
                );

            }


            resetToken =
            data.resetToken;


            verifiedEmail =
            emailValue;


            email.readOnly =
            true;


            otpBoxes.forEach(
                function(box){

                    box.disabled =
                    true;

                }
            );


            verifyCodeButton.textContent =
            "Verified ✓";


            passwordSection.style.display =
            "block";


            newPassword.focus();


            showStatus(
                "Email verified. Enter your new password.",
                true
            );

        }

        catch(error){

            console.error(
                "VERIFY RESET OTP ERROR:",
                error
            );


            verifyCodeButton.disabled =
            false;

            verifyCodeButton.textContent =
            "Verify Code";


            showStatus(
                error.message ||
                "Verification failed."
            );

        }

    }
);



/* RESET PASSWORD */

resetPasswordButton.addEventListener(
    "click",
    async function(){

        clearStatus();


        const passwordValue =
        newPassword.value;


        const confirmValue =
        confirmPassword.value;


        if(
            !resetToken ||
            !verifiedEmail
        ){

            showStatus(
                "Verify your email first."
            );

            return;

        }


        if(
            passwordValue.length < 6
        ){

            showStatus(
                "Password must contain at least 6 characters."
            );

            newPassword.focus();

            return;

        }


        if(
            passwordValue !==
            confirmValue
        ){

            showStatus(
                "Passwords do not match."
            );

            confirmPassword.focus();

            return;

        }


        resetPasswordButton.disabled =
        true;

        resetText.style.display =
        "none";

        resetLoading.style.display =
        "inline";


        try{

            const response =
            await fetch(
                OTP_WORKER,
                {

                    method:
                    "POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify({

                        action:
                        "reset_password",

                        email:
                        verifiedEmail,

                        newPassword:
                        passwordValue,

                        resetToken:
                        resetToken

                    })

                }
            );


            const data =
            await response.json();


            if(
                !response.ok ||
                !data.success
            ){

                throw new Error(
                    data.message ||
                    "Unable to reset password."
                );

            }


            showStatus(
                "Password changed successfully ✓ Redirecting to login...",
                true
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "./index.html"
                    );

                },
                1500
            );

        }

        catch(error){

            console.error(
                "RESET PASSWORD ERROR:",
                error
            );


            resetPasswordButton.disabled =
            false;

            resetText.style.display =
            "inline";

            resetLoading.style.display =
            "none";


            showStatus(
                error.message ||
                "Password reset failed."
            );

        }

    }
);

</script>
