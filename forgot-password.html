<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    sendPasswordResetEmail
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyCd_2LplLOl4TOGjbWQqndwHNGzPh2PEHM",

    authDomain:
    "zyper-d-iamond-store.firebaseapp.com",

    projectId:
    "zyper-d-iamond-store",

    storageBucket:
    "zyper-d-iamond-store.firebasestorage.app",

    messagingSenderId:
    "892467477866",

    appId:
    "1:892467477866:web:61e9b6ff9435798da23913"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);


const WORKER_URL =
"https://zyper-forgot-password.ameresh20112011.workers.dev";


const form =
document.getElementById("forgotForm");

const emailInput =
document.getElementById("email");

const resetBtn =
document.getElementById("resetBtn");

const message =
document.getElementById("message");


function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

}


function loading(text){

    resetBtn.disabled = true;

    resetBtn.innerHTML =
        '<span class="loading"></span>' +
        text;

}


function normalButton(){

    resetBtn.disabled = false;

    resetBtn.textContent =
        "Send Reset Email";

}


form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        message.className =
            "message";

        message.textContent =
            "";


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        if(!email){

            showMessage(
                "Please enter your Gmail address.",
                "error"
            );

            return;

        }


        if(!email.endsWith("@gmail.com")){

            showMessage(
                "Please enter a valid Gmail address.",
                "error"
            );

            return;

        }


        loading("Checking...");


        try{

            const response =
                await fetch(
                    WORKER_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email
                        })
                    }
                );


            /*
             * Read the response as TEXT first.
             * This lets us see the real Cloudflare
             * error instead of hiding it.
             */

            const rawResponse =
                await response.text();


            console.log(
                "CLOUDFLARE STATUS:",
                response.status
            );


            console.log(
                "CLOUDFLARE RESPONSE:",
                rawResponse
            );


            let result = {};

            try{

                result =
                    JSON.parse(rawResponse);

            }catch{

                result = {
                    error: rawResponse
                };

            }


            if(!response.ok){

                throw new Error(
                    "Cloudflare " +
                    response.status +
                    ": " +
                    (
                        result.error ||
                        rawResponse ||
                        "Unknown error"
                    )
                );

            }


            if(
                result.registered !== true
            ){

                showMessage(
                    "❌ This Gmail is not registered. Please create an account first.",
                    "error"
                );

                normalButton();

                return;

            }


            loading("Sending...");


            await sendPasswordResetEmail(
                auth,
                email
            );


            showMessage(
                "✅ Password reset email sent. Please check your Gmail inbox and spam folder.",
                "success"
            );


            emailInput.value = "";


        }

        catch(error){

            console.error(
                "FORGOT PASSWORD ERROR:",
                error
            );


            let text =
                "Something went wrong. Please try again.";


            if(
                error.code ===
                "auth/invalid-email"
            ){

                text =
                    "Please enter a valid Gmail address.";

            }

            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                text =
                    "Too many requests. Please wait and try again.";

            }

            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                text =
                    "Network error. Check your internet connection.";

            }

            else if(error.message){

                text =
                    error.message;

            }


            showMessage(
                "❌ " + text,
                "error"
            );

        }


        normalButton();

    }
);

</script>
