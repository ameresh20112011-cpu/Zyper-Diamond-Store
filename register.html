<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Zyper Diamond Store - Register</title>

<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="media.css">

<link rel="icon" href="1.jpg">

<style>

.login-header{
    text-align:center;
    margin-bottom:28px;
}

.company-logo{
    width:76px !important;
    height:76px !important;
    min-width:76px !important;
    min-height:76px !important;
    max-width:76px !important;
    max-height:76px !important;

    margin:0 auto 15px !important;
    padding:0 !important;

    border-radius:50% !important;
    overflow:hidden !important;

    display:flex !important;
    align-items:center !important;
    justify-content:center !important;

    background:#fff;

    box-shadow:
    0 8px 25px rgba(0,0,0,.20);
}

.company-logo img{
    width:100% !important;
    height:100% !important;

    display:block !important;
    object-fit:cover !important;

    border-radius:50% !important;
}

.brand-name{
    margin:0;
    font-size:24px;
    font-weight:800;
}

.brand-subtitle{
    margin:7px 0 0;
    opacity:.7;
}

.password-group{
    position:relative;
}

.password-group input{
    padding-right:55px !important;
}

.password-toggle{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);

    width:40px;
    height:40px;

    border:0;
    background:transparent;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:20;
}

.password-toggle svg{
    width:21px;
    height:21px;
}

.status{
    display:none;
    text-align:center;

    margin-top:15px;
    padding:10px;

    border-radius:10px;

    font-size:13px;
    font-weight:600;
}


/* EMAIL + OTP BUTTON */

.email-row{
    display:flex;
    gap:8px;
    align-items:stretch;
}

.email-row .input-group{
    flex:1;
}

.send-otp-btn{
    min-width:95px;
    padding:0 12px;

    border:0;
    border-radius:12px;

    background:#fff;
    color:#111827;

    font-size:12px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
    0 5px 15px rgba(0,0,0,.15);
}

.send-otp-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}


/* OTP */

.otp-area{
    display:none;

    margin-top:15px;
    padding:16px 12px;

    border-radius:15px;

    background:
    rgba(255,255,255,.04);

    border:
    1px solid rgba(255,255,255,.08);
}

.otp-title{
    text-align:center;
    font-size:13px;
    margin-bottom:12px;
    opacity:.8;
}

.otp-boxes{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-bottom:13px;
}

.otp-box{
    width:42px;
    height:48px;

    text-align:center;

    font-size:21px !important;
    font-weight:800;

    border:0;
    outline:0;

    border-radius:10px;

    background:
    rgba(255,255,255,.09);

    color:white;
}

.verify-otp-btn{
    width:100%;
    min-height:44px;

    border:0;
    border-radius:12px;

    background:#fff;
    color:#111827;

    cursor:pointer;
    font-weight:800;
}

.verify-otp-btn:disabled{
    opacity:.55;
}

.verified-message{
    display:none;

    text-align:center;
    margin-top:10px;

    color:#22c55e;

    font-size:13px;
    font-weight:800;
}

#registerButton:disabled{
    opacity:.55;
    cursor:not-allowed;
}


@media(max-width:500px){

    .company-logo{
        width:68px !important;
        height:68px !important;

        min-width:68px !important;
        min-height:68px !important;

        max-width:68px !important;
        max-height:68px !important;
    }

    .brand-name{
        font-size:21px;
    }

    input{
        font-size:16px !important;
    }

    .email-row{
        gap:6px;
    }

    .send-otp-btn{
        min-width:86px;
        font-size:11px;
    }

    .otp-box{
        width:38px;
        height:46px;
    }

}

</style>

</head>


<body>

<div class="login-container">

<div class="login-card">


<div class="login-header">

<div class="company-logo">

<img
src="1.jpg"
alt="Zyper Diamond Store">

</div>

<h2 class="brand-name">
Zyper Diamond Store
</h2>

<p class="brand-subtitle">
Create your account
</p>

</div>


<form
id="registerForm"
class="login-form"
novalidate>


<!-- USERNAME -->

<div class="form-group">

<div class="input-group neu-input">

<input
type="text"
id="username"
required
placeholder=" "
maxlength="20"
autocomplete="username">

<label for="username">
Username
</label>

</div>

</div>


<!-- PHONE -->

<div class="form-group">

<div class="input-group neu-input">

<input
type="tel"
id="phone"
required
placeholder=" "
maxlength="15"
autocomplete="tel">

<label for="phone">
Phone Number
</label>

</div>

</div>


<!-- EMAIL -->

<div class="form-group">

<div class="email-row">

<div class="input-group neu-input">

<input
type="email"
id="email"
required
placeholder=" "
autocomplete="email">

<label for="email">
Email Address
</label>

</div>


<button
type="button"
id="sendOtpButton"
class="send-otp-btn">

Send OTP

</button>

</div>

</div>


<!-- OTP -->

<div
id="otpArea"
class="otp-area">

<div class="otp-title">
Enter the 6-digit code sent to your email
</div>

<div class="otp-boxes">

<input class="otp-box" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
<input class="otp-box" maxlength="1" inputmode="numeric">
<input class="otp-box" maxlength="1" inputmode="numeric">
<input class="otp-box" maxlength="1" inputmode="numeric">
<input class="otp-box" maxlength="1" inputmode="numeric">
<input class="otp-box" maxlength="1" inputmode="numeric">

</div>

<button
type="button"
id="verifyOtpButton"
class="verify-otp-btn">

Verify OTP

</button>

<div
id="verifiedMessage"
class="verified-message">

✓ Email verified successfully

</div>

</div>


<!-- PASSWORD -->

<div class="form-group">

<div class="input-group neu-input password-group">

<input
type="password"
id="password"
required
placeholder=" "
minlength="6"
autocomplete="new-password">

<label for="password">
Password
</label>

<button
type="button"
id="passwordToggle"
class="password-toggle"
aria-label="Show password">

<svg
id="eyeOpen"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
<circle cx="12" cy="12" r="3"/>

</svg>

<svg
id="eyeClosed"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
style="display:none;">

<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8"/>
<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8"/>
<line x1="1" y1="1" x2="23" y2="23"/>

</svg>

</button>

</div>

</div>


<!-- REGISTER -->

<button
type="submit"
class="neu-button login-btn"
id="registerButton"
disabled>

<span id="registerText">
Create Account
</span>

<span
id="registerLoading"
style="display:none;">

Creating Account...

</span>

</button>


<div
id="status"
class="status">
</div>


</form>


<div class="signup-link">

<p>

Already have an account?

<a href="./index.html">
Login
</a>

</p>

</div>


</div>

</div>



<script type="module">

import {
    auth,
    db
}
from "./firebase.js";


import {
    signInWithEmailAndPassword,
    updateProfile
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    doc,
    setDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const OTP_WORKER =
"https://zyper-email-otp.ameresh20112011.workers.dev/";


const form =
document.getElementById(
    "registerForm"
);

const username =
document.getElementById(
    "username"
);

const phone =
document.getElementById(
    "phone"
);

const email =
document.getElementById(
    "email"
);

const password =
document.getElementById(
    "password"
);


const toggle =
document.getElementById(
    "passwordToggle"
);

const eyeOpen =
document.getElementById(
    "eyeOpen"
);

const eyeClosed =
document.getElementById(
    "eyeClosed"
);


const sendOtpButton =
document.getElementById(
    "sendOtpButton"
);

const otpArea =
document.getElementById(
    "otpArea"
);

const otpBoxes =
Array.from(
    document.querySelectorAll(
        ".otp-box"
    )
);

const verifyOtpButton =
document.getElementById(
    "verifyOtpButton"
);

const verifiedMessage =
document.getElementById(
    "verifiedMessage"
);


const registerButton =
document.getElementById(
    "registerButton"
);

const registerText =
document.getElementById(
    "registerText"
);

const registerLoading =
document.getElementById(
    "registerLoading"
);

const status =
document.getElementById(
    "status"
);


let otpVerified =
false;

let verifiedEmail =
"";

let verificationToken =
"";

let resendTimer =
null;


/* STATUS */

function showStatus(
    message,
    success = false
){

    status.style.display =
    "block";

    status.textContent =
    message;


    if(success){

        status.style.color =
        "#22c55e";

        status.style.background =
        "rgba(34,197,94,.08)";

    }

    else{

        status.style.color =
        "#f87171";

        status.style.background =
        "rgba(239,68,68,.08)";

    }

}


function clearStatus(){

    status.style.display =
    "none";

    status.textContent =
    "";

}


/* PASSWORD */

toggle.addEventListener(
    "click",
    function(){

        if(
            password.type ===
            "password"
        ){

            password.type =
            "text";

            eyeOpen.style.display =
            "none";

            eyeClosed.style.display =
            "block";

        }

        else{

            password.type =
            "password";

            eyeOpen.style.display =
            "block";

            eyeClosed.style.display =
            "none";

        }

    }
);


/* EMAIL CHANGE INVALIDATES OTP */

email.addEventListener(
    "input",
    function(){

        const value =
        email.value
        .trim()
        .toLowerCase();


        if(
            otpVerified &&
            value !== verifiedEmail
        ){

            otpVerified =
            false;

            verifiedEmail =
            "";

            verificationToken =
            "";

            registerButton.disabled =
            true;

            verifiedMessage.style.display =
            "none";


            otpBoxes.forEach(
                function(box){

                    box.disabled =
                    false;

                    box.value =
                    "";

                }
            );


            verifyOtpButton.disabled =
            false;

            verifyOtpButton.textContent =
            "Verify OTP";

        }

    }
);


/* OTP INPUT */

otpBoxes.forEach(
    function(box, index){

        box.addEventListener(
            "input",
            function(){

                box.value =
                box.value
                .replace(/\D/g, "")
                .slice(0,1);


                if(
                    box.value &&
                    index <
                    otpBoxes.length - 1
                ){

                    otpBoxes[
                        index + 1
                    ].focus();

                }

            }
        );


        box.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key ===
                    "Backspace" &&
                    !box.value &&
                    index > 0
                ){

                    otpBoxes[
                        index - 1
                    ].focus();

                }

            }
        );


        box.addEventListener(
            "paste",
            function(event){

                const text =
                (
                    event.clipboardData ||
                    window.clipboardData
                )
                .getData("text")
                .replace(/\D/g, "")
                .slice(0,6);


                if(!text){

                    return;

                }


                event.preventDefault();


                text
                .split("")
                .forEach(
                    function(number, i){

                        if(
                            otpBoxes[i]
                        ){

                            otpBoxes[i].value =
                            number;

                        }

                    }
                );

            }
        );

    }
);


/* RESEND TIMER */

function startResendTimer(){

    let seconds =
    60;


    sendOtpButton.disabled =
    true;


    sendOtpButton.textContent =
    "60s";


    if(resendTimer){

        clearInterval(
            resendTimer
        );

    }


    resendTimer =
    setInterval(
        function(){

            seconds--;


            if(
                seconds <= 0
            ){

                clearInterval(
                    resendTimer
                );

                resendTimer =
                null;


                sendOtpButton.disabled =
                false;


                sendOtpButton.textContent =
                "Resend OTP";


                return;

            }


            sendOtpButton.textContent =
            seconds + "s";

        },
        1000
    );

}


/* SEND OTP */

sendOtpButton.addEventListener(
    "click",
    async function(){

        clearStatus();


        const emailValue =
        email.value
        .trim()
        .toLowerCase();


        if(
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(
                emailValue
            )
        ){

            showStatus(
                "Please enter a valid email address."
            );

            return;

        }


        sendOtpButton.disabled =
        true;

        sendOtpButton.textContent =
        "Sending...";


        try{

            const response =
            await fetch(
                OTP_WORKER,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "send_otp",

                            email:
                                emailValue

                        })

                }
            );


            const data =
            await response.json();


            if(
                !response.ok ||
                !data.success
            ){

                throw new Error(
                    data.message ||
                    "Unable to send OTP."
                );

            }


            otpVerified =
            false;

            verifiedEmail =
            "";

            verificationToken =
            "";


            otpArea.style.display =
            "block";


            verifiedMessage.style.display =
            "none";


            registerButton.disabled =
            true;


            otpBoxes.forEach(
                function(box){

                    box.disabled =
                    false;

                    box.value =
                    "";

                }
            );


            verifyOtpButton.disabled =
            false;

            verifyOtpButton.textContent =
            "Verify OTP";


            otpBoxes[0].focus();


            showStatus(
                "Verification code sent. Check your Gmail.",
                true
            );


            startResendTimer();

        }

        catch(error){

            console.error(
                error
            );


            sendOtpButton.disabled =
            false;

            sendOtpButton.textContent =
            "Send OTP";


            showStatus(
                error.message ||
                "Unable to send OTP."
            );

        }

    }
);


/* VERIFY OTP */

verifyOtpButton.addEventListener(
    "click",
    async function(){

        clearStatus();


        const emailValue =
        email.value
        .trim()
        .toLowerCase();


        const otp =
        otpBoxes
        .map(
            box => box.value
        )
        .join("");


        if(
            otp.length !== 6
        ){

            showStatus(
                "Enter the complete 6-digit OTP."
            );

            return;

        }


        verifyOtpButton.disabled =
        true;

        verifyOtpButton.textContent =
        "Verifying...";


        try{

            const response =
            await fetch(
                OTP_WORKER,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "verify_otp",

                            email:
                                emailValue,

                            otp:
                                otp

                        })

                }
            );


            const data =
            await response.json();


            if(
                !response.ok ||
                !data.success ||
                !data.verified ||
                !data.verificationToken
            ){

                throw new Error(
                    data.message ||
                    "OTP verification failed."
                );

            }


            otpVerified =
            true;

            verifiedEmail =
            emailValue;

            verificationToken =
            data.verificationToken;


            verifiedMessage.style.display =
            "block";


            verifyOtpButton.textContent =
            "Verified ✓";


            otpBoxes.forEach(
                function(box){

                    box.disabled =
                    true;

                }
            );


            email.readOnly =
            true;


            registerButton.disabled =
            false;


            showStatus(
                "Email verified successfully ✓",
                true
            );

        }

        catch(error){

            console.error(
                error
            );


            verifyOtpButton.disabled =
            false;

            verifyOtpButton.textContent =
            "Verify OTP";


            showStatus(
                error.message ||
                "OTP verification failed."
            );

        }

    }
);


/* REGISTER */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        clearStatus();


        const usernameValue =
        username.value.trim();


        const phoneValue =
        phone.value.trim();


        const emailValue =
        email.value
        .trim()
        .toLowerCase();


        const passwordValue =
        password.value;


        if(
            usernameValue.length < 3
        ){

            showStatus(
                "Username must contain at least 3 characters."
            );

            return;

        }


        if(!phoneValue){

            showStatus(
                "Please enter your phone number."
            );

            return;

        }


        if(
            !otpVerified ||
            !verificationToken ||
            emailValue !== verifiedEmail
        ){

            showStatus(
                "Please verify your email OTP first."
            );

            return;

        }


        if(
            passwordValue.length < 6
        ){

            showStatus(
                "Password must be at least 6 characters."
            );

            return;

        }


        try{

            registerButton.disabled =
            true;


            registerText.style.display =
            "none";


            registerLoading.style.display =
            "inline";


            /*
               WORKER CONSUMES TOKEN
               AND CREATES FIREBASE ACCOUNT
            */

            const response =
            await fetch(
                OTP_WORKER,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "complete_registration",

                            username:
                                usernameValue,

                            phone:
                                phoneValue,

                            email:
                                emailValue,

                            password:
                                passwordValue,

                            verificationToken:
                                verificationToken

                        })

                }
            );


            const data =
            await response.json();


            if(
                !response.ok ||
                !data.success
            ){

                throw new Error(
                    data.message ||
                    "Unable to create account."
                );

            }


            /*
               WORKER CREATED ACCOUNT.
               NOW SIGN INTO FIREBASE CLIENT.
            */

            const loginResult =
            await signInWithEmailAndPassword(
                auth,
                emailValue,
                passwordValue
            );


            const user =
            loginResult.user;


            /*
               NORMAL PROFILE NAME
            */

            await updateProfile(
                user,
                {
                    displayName:
                        usernameValue
                }
            );


            /*
               FIRESTORE USER PROFILE

               otpVerified here is only informational.
               Security does NOT trust this field anymore.
               Real verification lives in Worker KV.
            */

            await setDoc(
                doc(
                    db,
                    "users",
                    user.uid
                ),
                {

                    uid:
                        user.uid,

                    username:
                        usernameValue,

                    phone:
                        phoneValue,

                    email:
                        emailValue,

                    role:
                        "customer",

                    provider:
                        "password",

                    otpVerified:
                        true,

                    otpVerifiedAt:
                        serverTimestamp(),

                    createdAt:
                        serverTimestamp()

                }
            );


            showStatus(
                "Account created successfully ✓",
                true
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "./home.html"
                    );

                },
                900
            );

        }

        catch(error){

            console.error(
                "REGISTRATION ERROR:",
                error
            );


            registerButton.disabled =
            false;


            registerText.style.display =
            "inline";


            registerLoading.style.display =
            "none";


            showStatus(
                error.message ||
                "Registration failed."
            );

        }

    }
);

</script>

</body>

</html>
