<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zyper Diamond Store - Register</title>

<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="media.css">
<link rel="icon" href="1.jpg">

<style>
.login-header{
    text-align:center;
    margin-bottom:28px;
}

.company-logo{
    width:75px !important;
    height:75px !important;
    margin:0 auto 15px !important;
    padding:0 !important;
    border-radius:50% !important;
    overflow:hidden !important;
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    background:#fff;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.company-logo img{
    width:100% !important;
    height:100% !important;
    object-fit:cover !important;
    display:block !important;
    border-radius:50% !important;
}

.brand-name{
    margin:0;
    font-size:24px;
    font-weight:800;
}

.brand-subtitle{
    margin:7px 0 0;
    opacity:.7;
}

.password-group{
    position:relative;
}

.password-group input{
    padding-right:55px !important;
}

.password-toggle{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    width:40px;
    height:40px;
    border:0;
    background:transparent;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
}

.password-toggle svg{
    width:21px;
    height:21px;
}

.status{
    display:none;
    text-align:center;
    margin-top:15px;
    font-weight:600;
}

@media(max-width:500px){
    .company-logo{
        width:68px !important;
        height:68px !important;
    }

    .brand-name{
        font-size:21px;
    }
}
</style>
</head>

<body>

<div class="login-container">

<div class="login-card">

<div class="login-header">

<div class="company-logo">
<img src="1.jpg" alt="Zyper Diamond Store">
</div>

<h2 class="brand-name">
Zyper Diamond Store
</h2>

<p class="brand-subtitle">
Create your account
</p>

</div>


<form id="registerForm" class="login-form" novalidate>


<!-- USERNAME -->

<div class="form-group">

<div class="input-group neu-input">

<input
type="text"
id="username"
required
placeholder=" "
autocomplete="username"
maxlength="20">

<label for="username">
Username
</label>

</div>

</div>


<!-- PHONE -->

<div class="form-group">

<div class="input-group neu-input">

<input
type="tel"
id="phone"
required
placeholder=" "
autocomplete="tel"
maxlength="15">

<label for="phone">
Phone Number
</label>

</div>

</div>


<!-- EMAIL -->

<div class="form-group">

<div class="input-group neu-input">

<input
type="email"
id="email"
required
placeholder=" "
autocomplete="email">

<label for="email">
Email Address
</label>

</div>

</div>


<!-- PASSWORD -->

<div class="form-group">

<div class="input-group neu-input password-group">

<input
type="password"
id="password"
required
placeholder=" "
autocomplete="new-password"
minlength="6">

<label for="password">
Password
</label>


<button
type="button"
id="passwordToggle"
class="password-toggle">

<svg
id="eyeOpen"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
<circle cx="12" cy="12" r="3"/>

</svg>


<svg
id="eyeClosed"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
style="display:none;">

<path d="M17.94 17.94A10 10 0 0 1 12 20c-7 0-11-8-11-8"/>
<path d="M1 1l22 22"/>
<path d="M9.9 4.24A10 10 0 0 1 12 4c7 0 11 8 11 8"/>

</svg>

</button>

</div>

</div>


<button
type="submit"
class="neu-button login-btn"
id="registerButton">

<span id="normalText">
Create Account
</span>

<span
id="loadingText"
style="display:none;">

Creating Account...

</span>

</button>


<div
id="status"
class="status">
</div>

</form>


<div class="signup-link">

<p>
Already have an account?
<a href="index.html">
Login
</a>
</p>

</div>

</div>
</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
createUserWithEmailAndPassword,
updateProfile
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
setDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================= FIREBASE ================= */

const firebaseConfig = {

apiKey:
"AIzaSyCd_2LplLOl4TOGjbWQqndwHNGzPh2PEHM",

authDomain:
"zyper-d-iamond-store.firebaseapp.com",

projectId:
"zyper-d-iamond-store",

storageBucket:
"zyper-d-iamond-store.firebasestorage.app",

messagingSenderId:
"892467477866",

appId:
"1:892467477866:web:61e9b6ff9435798da23913"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ================= ELEMENTS ================= */

const form =
document.getElementById("registerForm");

const username =
document.getElementById("username");

const phone =
document.getElementById("phone");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const toggle =
document.getElementById("passwordToggle");

const eyeOpen =
document.getElementById("eyeOpen");

const eyeClosed =
document.getElementById("eyeClosed");

const button =
document.getElementById("registerButton");

const normalText =
document.getElementById("normalText");

const loadingText =
document.getElementById("loadingText");

const status =
document.getElementById("status");


/* ================= SHOW PASSWORD ================= */

toggle.addEventListener("click", function(){

    if(password.type === "password"){

        password.type = "text";

        eyeOpen.style.display = "none";
        eyeClosed.style.display = "block";

    }else{

        password.type = "password";

        eyeOpen.style.display = "block";
        eyeClosed.style.display = "none";

    }

});


/* ================= REGISTER ================= */

form.addEventListener("submit", async function(e){

    e.preventDefault();


    const usernameValue =
        username.value.trim();

    const phoneValue =
        phone.value.trim();

    const emailValue =
        email.value.trim();

    const passwordValue =
        password.value;


    /* VALIDATION */

    if(usernameValue.length < 3){

        alert(
            "Username must contain at least 3 characters."
        );

        return;

    }


    if(!/^[a-zA-Z0-9_]+$/.test(usernameValue)){

        alert(
            "Username can contain only letters, numbers and _"
        );

        return;

    }


    if(!phoneValue){

        alert(
            "Please enter your phone number."
        );

        return;

    }


    if(!emailValue){

        alert(
            "Please enter your email."
        );

        return;

    }


    if(passwordValue.length < 6){

        alert(
            "Password must be at least 6 characters."
        );

        return;

    }


    try{

        /* LOADING */

        button.disabled = true;

        normalText.style.display = "none";

        loadingText.style.display = "inline";


        /* =========================
           CREATE FIREBASE ACCOUNT
        ========================= */

        const result =
            await createUserWithEmailAndPassword(
                auth,
                emailValue,
                passwordValue
            );


        const user =
            result.user;


        /* =========================
           SAVE DISPLAY NAME
        ========================= */

        await updateProfile(
            user,
            {
                displayName: usernameValue
            }
        );


        /* =========================
           CREATE USER DOCUMENT
        ========================= */

        await setDoc(
            doc(
                db,
                "users",
                user.uid
            ),
            {

                uid:
                    user.uid,

                username:
                    usernameValue,

                phone:
                    phoneValue,

                email:
                    emailValue,

                role:
                    "customer",

                createdAt:
                    serverTimestamp()

            }
        );


        /* SUCCESS */

        status.style.display =
            "block";

        status.style.color =
            "#00c853";

        status.innerHTML =
            "Account created successfully ✅";


        setTimeout(function(){

            window.location.href =
                "home.html";

        },1500);


    }catch(error){

        console.error(
            "REGISTER ERROR:",
            error
        );


        button.disabled = false;

        normalText.style.display =
            "inline";

        loadingText.style.display =
            "none";


        /* AUTH ERRORS */

        if(
            error.code ===
            "auth/email-already-in-use"
        ){

            alert(
                "This email is already registered."
            );

        }

        else if(
            error.code ===
            "auth/invalid-email"
        ){

            alert(
                "Invalid email address."
            );

        }

        else if(
            error.code ===
            "auth/weak-password"
        ){

            alert(
                "Password must be at least 6 characters."
            );

        }

        else if(
            error.code ===
            "auth/operation-not-allowed"
        ){

            alert(
                "Email/Password login is not enabled in Firebase Authentication."
            );

        }

        else if(
            error.code ===
            "permission-denied"
        ){

            alert(
                "Firestore permission denied. Please check your Firestore Rules."
            );

        }

        else{

            alert(
                "Registration failed:\n\n" +
                error.message
            );

        }

    }

});

</script>

</body>
</html>
