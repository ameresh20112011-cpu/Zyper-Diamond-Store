<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Zyper Diamond Store - Register</title>

<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="media.css">

<link rel="icon" href="1.jpg">

<style>

/* ================= LOGO ================= */

.login-header{
    text-align:center;
    margin-bottom:28px;
}

.company-logo{
    width:76px !important;
    height:76px !important;

    min-width:76px !important;
    min-height:76px !important;

    max-width:76px !important;
    max-height:76px !important;

    margin:0 auto 14px !important;
    padding:0 !important;

    border-radius:50% !important;
    overflow:hidden !important;

    display:flex !important;
    align-items:center !important;
    justify-content:center !important;

    background:#fff;

    box-shadow:
        0 8px 20px rgba(0,0,0,.18),
        inset 0 0 0 3px rgba(255,255,255,.8);

    flex-shrink:0 !important;
}

.company-logo img{
    width:76px !important;
    height:76px !important;

    min-width:76px !important;
    min-height:76px !important;

    max-width:76px !important;
    max-height:76px !important;

    display:block !important;

    margin:0 !important;
    padding:0 !important;

    object-fit:cover !important;

    border-radius:50% !important;
}

.brand-name{
    margin:0;
    font-size:24px;
    font-weight:800;
    line-height:1.2;
}

.brand-subtitle{
    margin:7px 0 0;
    font-size:13px;
    opacity:.7;
}

.logo-glow{
    width:45px;
    height:3px;
    margin:12px auto 0;
    border-radius:10px;
    background:currentColor;
    opacity:.35;
}


/* ================= PASSWORD ================= */

.password-group{
    position:relative;
}

.password-group input{
    padding-right:55px !important;
}

.password-toggle{
    position:absolute;

    right:9px;
    top:50%;

    transform:translateY(-50%);

    width:38px;
    height:38px;

    border:none;
    border-radius:50%;

    background:transparent;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:10;
}

.password-toggle svg{
    width:20px;
    height:20px;
}


/* ================= STATUS ================= */

.status-message{
    display:none;

    margin-top:15px;

    text-align:center;

    font-size:14px;

    font-weight:600;
}


/* ================= MOBILE ================= */

@media(max-width:500px){

    .company-logo{
        width:68px !important;
        height:68px !important;

        min-width:68px !important;
        min-height:68px !important;

        max-width:68px !important;
        max-height:68px !important;
    }

    .company-logo img{
        width:68px !important;
        height:68px !important;

        min-width:68px !important;
        min-height:68px !important;

        max-width:68px !important;
        max-height:68px !important;
    }

    .brand-name{
        font-size:21px;
    }

}

</style>

</head>


<body>


<div class="login-container">

<div class="login-card">


<!-- ================= HEADER ================= -->

<div class="login-header">

<div class="company-logo">

<img
src="1.jpg"
alt="Zyper Diamond Store">

</div>

<h2 class="brand-name">
Zyper Diamond Store
</h2>

<p class="brand-subtitle">
Create your account
</p>

<div class="logo-glow"></div>

</div>



<!-- ================= REGISTER FORM ================= -->

<form
id="registerForm"
class="login-form"
novalidate>


<!-- USERNAME -->

<div class="form-group">

<div class="input-group neu-input">

<input
type="text"
id="username"
required
autocomplete="username"
placeholder=" "
minlength="3"
maxlength="20">

<label for="username">
Username
</label>

</div>

</div>



<!-- PHONE -->

<div class="form-group">

<div class="input-group neu-input">

<input
type="tel"
id="phone"
required
autocomplete="tel"
placeholder=" "
maxlength="15">

<label for="phone">
Phone Number
</label>

</div>

</div>



<!-- EMAIL -->

<div class="form-group">

<div class="input-group neu-input">

<input
type="email"
id="email"
required
autocomplete="email"
placeholder=" ">

<label for="email">
Email Address
</label>

</div>

</div>



<!-- PASSWORD -->

<div class="form-group">

<div class="input-group neu-input password-group">

<input
type="password"
id="password"
required
autocomplete="new-password"
placeholder=" "
minlength="6">

<label for="password">
Password
</label>


<button
type="button"
id="passwordToggle"
class="password-toggle"
aria-label="Show password">


<svg
class="eye-open"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path
d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>

<circle
cx="12"
cy="12"
r="3"/>

</svg>


<svg
class="eye-closed"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
style="display:none;">

<path
d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>

<path
d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>

<line
x1="1"
y1="1"
x2="23"
y2="23"/>

</svg>

</button>

</div>

</div>



<!-- REGISTER BUTTON -->

<button
type="submit"
class="neu-button login-btn"
id="registerButton">

<span id="buttonText">
Create Account
</span>

<span
id="buttonLoading"
style="display:none;">

Creating Account...

</span>

</button>



<!-- STATUS -->

<div
id="statusMessage"
class="status-message">
</div>


</form>



<!-- LOGIN -->

<div class="signup-link">

<p>

Already have an account?

<a href="index.html">
Login
</a>

</p>

</div>


</div>

</div>



<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
createUserWithEmailAndPassword,
updateProfile
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
setDoc,
getDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================= FIREBASE ================= */

const firebaseConfig = {

apiKey:
"AIzaSyCd_2LplLOl4TOGjbWQqndwHNGzPh2PEHM",

authDomain:
"zyper-d-iamond-store.firebaseapp.com",

projectId:
"zyper-d-iamond-store",

storageBucket:
"zyper-d-iamond-store.firebasestorage.app",

messagingSenderId:
"892467477866",

appId:
"1:892467477866:web:61e9b6ff9435798da23913"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ================= ELEMENTS ================= */

const form =
document.getElementById("registerForm");

const usernameInput =
document.getElementById("username");

const phoneInput =
document.getElementById("phone");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const passwordToggle =
document.getElementById("passwordToggle");

const button =
document.getElementById("registerButton");

const buttonText =
document.getElementById("buttonText");

const buttonLoading =
document.getElementById("buttonLoading");

const status =
document.getElementById("statusMessage");


/* ================= PASSWORD SHOW ================= */

passwordToggle.addEventListener("click", () => {

    if(passwordInput.type === "password"){

        passwordInput.type = "text";

        passwordToggle
        .querySelector(".eye-open")
        .style.display = "none";

        passwordToggle
        .querySelector(".eye-closed")
        .style.display = "block";

    }else{

        passwordInput.type = "password";

        passwordToggle
        .querySelector(".eye-open")
        .style.display = "block";

        passwordToggle
        .querySelector(".eye-closed")
        .style.display = "none";

    }

});


/* ================= REGISTER ================= */

form.addEventListener("submit", async (e) => {

    e.preventDefault();


    const username =
        usernameInput.value.trim();

    const phone =
        phoneInput.value.trim();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    /* VALIDATION */

    if(username.length < 3){

        alert("Username must be at least 3 characters.");

        usernameInput.focus();

        return;

    }


    if(!/^[a-zA-Z0-9_]+$/.test(username)){

        alert(
            "Username can only contain letters, numbers and _"
        );

        usernameInput.focus();

        return;

    }


    if(!phone){

        alert("Please enter your phone number.");

        phoneInput.focus();

        return;

    }


    if(password.length < 6){

        alert(
            "Password must be at least 6 characters."
        );

        passwordInput.focus();

        return;

    }


    try{


        /* =================
           CHECK USERNAME
           WITHOUT SEARCHING
           USERS COLLECTION
        ================= */

        const usernameRef =
            doc(
                db,
                "usernames",
                username.toLowerCase()
            );


        const usernameDoc =
            await getDoc(usernameRef);


        if(usernameDoc.exists()){

            alert(
                "This username is already taken."
            );

            return;

        }


        /* LOADING */

        button.disabled = true;

        buttonText.style.display = "none";

        buttonLoading.style.display = "inline";


        /* =================
           CREATE AUTH USER
        ================= */

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            credential.user;


        /* =================
           DISPLAY NAME
        ================= */

        await updateProfile(
            user,
            {
                displayName: username
            }
        );


        /* =================
           USER PROFILE
        ================= */

        await setDoc(
            doc(
                db,
                "users",
                user.uid
            ),
            {

                uid:
                    user.uid,

                username:
                    username,

                phone:
                    phone,

                email:
                    email,

                role:
                    "customer",

                walletBalance:
                    0,

                createdAt:
                    serverTimestamp()

            }
        );


        /* =================
           USERNAME LOOKUP
        ================= */

        await setDoc(
            usernameRef,
            {

                uid:
                    user.uid,

                email:
                    email,

                username:
                    username

            }
        );


        /* SUCCESS */

        status.style.display = "block";

        status.style.color = "#00c853";

        status.textContent =
            "Account created successfully! Redirecting...";


        setTimeout(() => {

            window.location.href =
                "home.html";

        }, 1200);


    }catch(error){

        console.error(error);


        button.disabled = false;

        buttonText.style.display = "inline";

        buttonLoading.style.display = "none";


        if(
            error.code ===
            "auth/email-already-in-use"
        ){

            alert(
                "This email is already registered."
            );

        }
        else if(
            error.code ===
            "auth/invalid-email"
        ){

            alert(
                "Please enter a valid email."
            );

        }
        else if(
            error.code ===
            "auth/weak-password"
        ){

            alert(
                "Password must be at least 6 characters."
            );

        }
        else if(
            error.code ===
            "permission-denied"
        ){

            alert(
                "Firestore permission denied. Check your Firestore Rules."
            );

        }
        else{

            alert(
                "Registration failed: " +
                error.message
            );

        }

    }

});

</script>

</body>
</html>
