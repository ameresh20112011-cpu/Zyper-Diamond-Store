<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Zyper Diamond Store - Register</title>

<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="media.css">

<link rel="icon" href="1.jpg">

<style>

.login-header{
    text-align:center;
    margin-bottom:28px;
}

.company-logo{
    width:76px !important;
    height:76px !important;

    min-width:76px !important;
    min-height:76px !important;

    max-width:76px !important;
    max-height:76px !important;

    margin:0 auto 15px !important;
    padding:0 !important;

    border-radius:50% !important;
    overflow:hidden !important;

    display:flex !important;

    align-items:center !important;
    justify-content:center !important;

    background:#fff;

    box-shadow:
    0 8px 25px rgba(0,0,0,.20);
}

.company-logo img{
    width:100% !important;
    height:100% !important;

    display:block !important;

    object-fit:cover !important;

    border-radius:50% !important;
}

.brand-name{
    margin:0;
    font-size:24px;
    font-weight:800;
}

.brand-subtitle{
    margin:7px 0 0;
    opacity:.7;
}

.password-group{
    position:relative;
}

.password-group input{
    padding-right:55px !important;
}

.password-toggle{

    position:absolute;

    right:8px;
    top:50%;

    transform:translateY(-50%);

    width:40px;
    height:40px;

    border:0;

    background:transparent;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:20;
}

.password-toggle svg{
    width:21px;
    height:21px;
}

.status{

    display:none;

    text-align:center;

    margin-top:15px;

    font-weight:600;
}

@media(max-width:500px){

    .company-logo{
        width:68px !important;
        height:68px !important;
    }

    .brand-name{
        font-size:21px;
    }

}

</style>

</head>

<body>

<div class="login-container">

<div class="login-card">


<div class="login-header">

<div class="company-logo">

<img
src="1.jpg"
alt="Zyper Diamond Store">

</div>


<h2 class="brand-name">
Zyper Diamond Store
</h2>


<p class="brand-subtitle">
Create your account
</p>

</div>



<form
id="registerForm"
class="login-form"
novalidate>


<!-- USERNAME -->

<div class="form-group">

<div class="input-group neu-input">

<input
type="text"
id="username"
required
placeholder=" "
maxlength="20"
autocomplete="username">

<label for="username">
Username
</label>

</div>

</div>


<!-- PHONE -->

<div class="form-group">

<div class="input-group neu-input">

<input
type="tel"
id="phone"
required
placeholder=" "
maxlength="15"
autocomplete="tel">

<label for="phone">
Phone Number
</label>

</div>

</div>


<!-- EMAIL -->

<div class="form-group">

<div class="input-group neu-input">

<input
type="email"
id="email"
required
placeholder=" "
autocomplete="email">

<label for="email">
Email Address
</label>

</div>

</div>


<!-- PASSWORD -->

<div class="form-group">

<div class="input-group neu-input password-group">

<input
type="password"
id="password"
required
placeholder=" "
minlength="6"
autocomplete="new-password">

<label for="password">
Password
</label>


<button
type="button"
id="passwordToggle"
class="password-toggle"
aria-label="Show password">


<svg
id="eyeOpen"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>

<circle
cx="12"
cy="12"
r="3"/>

</svg>


<svg
id="eyeClosed"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
style="display:none;">

<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8"/>

<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8"/>

<line
x1="1"
y1="1"
x2="23"
y2="23"/>

</svg>

</button>

</div>

</div>


<button
type="submit"
class="neu-button login-btn"
id="registerButton">

<span id="registerText">
Create Account
</span>

<span
id="registerLoading"
style="display:none;">

Creating Account...

</span>

</button>


<div
id="status"
class="status">
</div>


</form>


<div class="signup-link">

<p>

Already have an account?

<a href="index.html">
Login
</a>

</p>

</div>


</div>

</div>



<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
createUserWithEmailAndPassword,
updateProfile
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
setDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyCd_2LplLOl4TOGjbWQqndwHNGzPh2PEHM",

authDomain:
"zyper-d-iamond-store.firebaseapp.com",

projectId:
"zyper-d-iamond-store",

storageBucket:
"zyper-d-iamond-store.firebasestorage.app",

messagingSenderId:
"892467477866",

appId:
"1:892467477866:web:61e9b6ff9435798da23913"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


const form =
document.getElementById("registerForm");

const username =
document.getElementById("username");

const phone =
document.getElementById("phone");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const toggle =
document.getElementById("passwordToggle");

const eyeOpen =
document.getElementById("eyeOpen");

const eyeClosed =
document.getElementById("eyeClosed");

const button =
document.getElementById("registerButton");

const registerText =
document.getElementById("registerText");

const registerLoading =
document.getElementById("registerLoading");

const status =
document.getElementById("status");


/* SHOW PASSWORD */

toggle.addEventListener("click", () => {

    if(password.type === "password"){

        password.type = "text";

        eyeOpen.style.display = "none";

        eyeClosed.style.display = "block";

    }else{

        password.type = "password";

        eyeOpen.style.display = "block";

        eyeClosed.style.display = "none";

    }

});


/* REGISTER */

form.addEventListener("submit", async (e) => {

    e.preventDefault();


    const usernameValue =
        username.value.trim();

    const phoneValue =
        phone.value.trim();

    const emailValue =
        email.value.trim();

    const passwordValue =
        password.value;


    if(usernameValue.length < 3){

        alert(
            "Username must contain at least 3 characters."
        );

        return;

    }


    if(!phoneValue){

        alert(
            "Please enter your phone number."
        );

        return;

    }


    if(!emailValue){

        alert(
            "Please enter your email."
        );

        return;

    }


    if(passwordValue.length < 6){

        alert(
            "Password must be at least 6 characters."
        );

        return;

    }


    try{

        button.disabled = true;

        registerText.style.display = "none";

        registerLoading.style.display = "inline";


        /* CREATE AUTH ACCOUNT */

        const result =
            await createUserWithEmailAndPassword(
                auth,
                emailValue,
                passwordValue
            );


        const user =
            result.user;


        /* SAVE USERNAME */

        await updateProfile(
            user,
            {
                displayName:
                usernameValue
            }
        );


        /* SAVE USER PROFILE */

        await setDoc(
            doc(
                db,
                "users",
                user.uid
            ),
            {

                uid:
                user.uid,

                username:
                usernameValue,

                phone:
                phoneValue,

                email:
                emailValue,

                role:
                "customer",

                createdAt:
                serverTimestamp()

            }
        );


        status.style.display =
            "block";

        status.style.color =
            "#00c853";

        status.textContent =
            "Account created successfully ✓";


        setTimeout(() => {

            window.location.href =
                "home.html";

        },1200);


    }catch(error){

        console.error(
            "REGISTRATION ERROR:",
            error
        );


        button.disabled = false;

        registerText.style.display =
            "inline";

        registerLoading.style.display =
            "none";


        if(
            error.code ===
            "auth/email-already-in-use"
        ){

            alert(
                "This email is already registered."
            );

        }

        else if(
            error.code ===
            "auth/invalid-email"
        ){

            alert(
                "Invalid email address."
            );

        }

        else if(
            error.code ===
            "auth/weak-password"
        ){

            alert(
                "Password must be at least 6 characters."
            );

        }

        else if(
            error.code ===
            "permission-denied" ||
            error.code ===
            "firestore/permission-denied"
        ){

            alert(
                "Firestore permission denied. Check your Firestore Rules."
            );

        }

        else{

            alert(
                "Registration failed:\n\n" +
                error.message
            );

        }

    }

});

</script>

</body>
</html>
