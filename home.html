<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Zyper Diamond Store</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="media.css">

<link rel="icon" href="1.jpg">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>

body {

margin:0;

font-family:'Segoe UI',sans-serif;

background:#0f172a;

color:white;

padding-bottom:80px;

}



.header {

padding:20px;

font-size:22px;

font-weight:bold;

text-align:center;

background:#020617;

border-bottom:1px solid #1e293b;

text-shadow:

0 0 10px #17b8c0,

0 0 20px #17b8c0,

0 0 40px #17b8c0;

letter-spacing:2px;

}



.container {

padding:30px;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

}



.card {

background:#1e293b;

padding:25px;

border-radius:20px;

text-align:center;

cursor:pointer;

border:1px solid #334155;

transition:.3s;

}



.card:hover {

transform:translateY(-5px);

background:#334155;

}



.card h2 {

margin-bottom:10px;

}



.card p {

color:#94a3b8;

}





.bottom-nav {

position:fixed;

bottom:0;

left:0;

width:100%;

height:70px;

display:flex;

justify-content:space-around;

align-items:center;

background:rgba(255,255,255,0.1);

backdrop-filter:blur(15px);

border-top:1px solid rgba(255,255,255,.2);

z-index:1000;

}



.nav-item {

text-align:center;

text-decoration:none;

color:#aaa;

font-size:12px;

}



.nav-item i {

display:block;

font-size:22px;

margin-bottom:4px;

}



.nav-item:hover,

.nav-item.active {

color:#00eaff;

}



</style>


</head>



<body>




<div class="header">

💎 Zyper Diamond Store

</div>







<div class="container">





<div class="card" onclick="goTopup()">


<h2>

💎 Top-up Shop

</h2>


<p>

Buy diamonds easily

</p>


</div>







<div class="card" onclick="goPayment()">



<h2>

💳 Payment Methods

</h2>


<p>

View bank details & upload receipt

</p>


</div>








<div class="card" onclick="goHistory()">



<h2>

📜 Order History

</h2>


<p>

View all your previous orders

</p>


</div>








<div class="card" onclick="goWhatsApp()">



<h2>

📲 WhatsApp Contact

</h2>


<p>

Chat directly for support

</p>


</div>





</div>









<script type="module">



import { initializeApp }

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getAuth,

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";







const firebaseConfig = {


apiKey:"AIzaSyCd_2LplLOl4TOGjbWQqndwHNGzPh2PEHM",

authDomain:"zyper-d-iamond-store.firebaseapp.com",

projectId:"zyper-d-iamond-store",

storageBucket:"zyper-d-iamond-store.firebasestorage.app",

messagingSenderId:"892467477866",

appId:"1:892467477866:web:61e9b6ff9435798da23913",

measurementId:"G-RLJFR6F2GC"


};






const app=initializeApp(firebaseConfig);


const auth=getAuth(app);






// CHECK LOGIN


onAuthStateChanged(auth,(user)=>{


if(!user){


window.location.href="index.html";


}


});








// NAVIGATION



window.goTopup=function(){

window.location.href="topup.html";

}



window.goPayment=function(){

window.location.href="payment.html";

}



window.goHistory=function(){

window.location.href="history.html";

}



window.goWhatsApp=function(){

window.location.href="whatsapp.html";

}





</script>

</html>
