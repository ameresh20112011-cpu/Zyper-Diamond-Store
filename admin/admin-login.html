<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zyper Admin Login</title>

    <link
        rel="stylesheet"
        href="./admin.css?v=20260828-2"
    >

</head>


<body class="login-page">


<div class="login-box">

    <div class="logo">
        💎
    </div>


    <h1>
        Zyper Diamond Store
    </h1>


    <h3>
        Admin Login
    </h3>


    <form
        id="loginForm"
        autocomplete="on"
    >

        <input
            id="email"
            name="email"
            type="email"
            placeholder="Email"
            autocomplete="email"
            required
        >


        <input
            id="password"
            name="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >


        <button
            id="login"
            type="submit"
        >
            LOGIN
        </button>

    </form>


    <p id="msg"></p>

</div>


<!--
    ADMIN JAVASCRIPT
    Version query forces browser/GitHub Pages
    to load the newest admin.js
-->

<script
    type="module"
    src="./admin.js?v=20260828-2">
</script>


</body>

</html>
