<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Zyper Admin Login</title>

<link rel="stylesheet"
href="admin.css">

</head>


<body class="login-page">


<div class="login-box">


<div class="logo">
💎
</div>


<h1>
Zyper Diamond Store
</h1>


<h3>
Admin Login
</h3>


<input
id="email"
type="email"
placeholder="Email"
autocomplete="email"
required
>


<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
required
>


<button id="login">
LOGIN
</button>


<p id="msg"></p>


</div>


<script
type="module"
src="admin.js">
</script>


</body>

</html>
