```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Zyper Admin Login</title>

<link
rel="stylesheet"
href="admin.css">

</head>


<body class="login-page">


<div class="login-box">


<div class="login-logo">
💎
</div>


<h1>
Zyper Diamond Store
</h1>


<p class="login-subtitle">
Administrator Login
</p>


<div class="input-group">

<label>
📧 Admin Email
</label>

<input
id="email"
type="email"
placeholder="Enter admin email"
autocomplete="username">

</div>


<div class="input-group">

<label>
🔐 Password
</label>

<input
id="password"
type="password"
placeholder="Enter password"
autocomplete="current-password">

</div>


<button
id="login"
type="button">

LOGIN

</button>


<p id="msg"></p>


<a
href="../index.html"
class="back-link">

← Back to Store

</a>


</div>


<script
type="module"
src="admin.js">
</script>


</body>

</html>
```
