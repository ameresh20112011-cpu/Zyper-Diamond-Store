
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Zyper Admin Login</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

font-family:
Segoe UI,
Arial,
sans-serif;

color:white;

background:
radial-gradient(
circle at top,
#312e81,
#0f172a 50%,
#020617
);

}

.login-box{

width:92%;

max-width:400px;

padding:35px;

border-radius:25px;

background:
rgba(255,255,255,.08);

border:
1px solid rgba(255,255,255,.15);

backdrop-filter:
blur(20px);

box-shadow:
0 25px 70px
rgba(0,0,0,.5);

}

.logo{

text-align:center;

font-size:55px;

}

h1{

text-align:center;

margin:10px 0;

}

.subtitle{

text-align:center;

color:#94a3b8;

margin-bottom:25px;

}

label{

display:block;

margin:15px 0 7px;

color:#cbd5e1;

font-size:14px;

}

input{

width:100%;

padding:14px;

border:
1px solid #334155;

border-radius:12px;

background:#0f172a;

color:white;

outline:none;

font-size:15px;

}

input:focus{

border-color:#60a5fa;

box-shadow:
0 0 0 3px
rgba(96,165,250,.1);

}

button{

width:100%;

margin-top:22px;

padding:15px;

border:0;

border-radius:13px;

background:
linear-gradient(
90deg,
#2563eb,
#7c3aed
);

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

box-shadow:
0 10px 25px
rgba(37,99,235,.25);

transition:.2s;

}

button:hover{

transform:
translateY(-2px);

}

button:disabled{

opacity:.6;

cursor:not-allowed;

transform:none;

}

#msg{

min-height:20px;

margin-top:18px;

text-align:center;

color:#fca5a5;

font-size:14px;

line-height:1.5;

}

.back{

display:block;

text-align:center;

margin-top:20px;

color:#93c5fd;

text-decoration:none;

font-size:14px;

}

.back:hover{

color:white;

}

</style>

</head>


<body>


<div class="login-box">


<div class="logo">
💎
</div>


<h1>
Zyper Admin
</h1>


<div class="subtitle">
Secure Administrator Login
</div>


<label for="email">
Email
</label>


<input
id="email"
type="email"
placeholder="Enter admin email"
autocomplete="username"
>


<label for="password">
Password
</label>


<input
id="password"
type="password"
placeholder="Enter admin password"
autocomplete="current-password"
>


<button
id="login"
type="button">

LOGIN

</button>


<div id="msg"></div>


<a
class="back"
href="../index.html">

← Back to Store

</a>


</div>


<script
type="module"
src="admin.js">
</script>


</body>

</html>
```
