<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Zyper Diamond Store - Admin Login</title>

<link rel="stylesheet" href="./admin.css">

</head>

<body class="login-page">

<div class="login-box">

<div class="login-logo">
💎
</div>

<h1>Zyper Diamond Store</h1>

<div class="login-subtitle">
ADMIN PANEL
</div>

<div class="input-group">

<label>Email</label>

<input
id="email"
type="email"
placeholder="Enter admin email"
autocomplete="username"
>

</div>

<div class="input-group">

<label>Password</label>

<input
id="password"
type="password"
placeholder="Enter password"
autocomplete="current-password"
>

</div>

<button
id="login"
type="button">

LOGIN TO DASHBOARD

</button>

<div id="msg"></div>

</div>

<script
type="module"
src="./admin.js">
</script>

</body>

</html>
