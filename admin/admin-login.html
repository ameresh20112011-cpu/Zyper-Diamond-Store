<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Zyper Admin Login</title>

<link rel="stylesheet"
href="admin.css">

</head>


<body class="login-page">


<div class="login-background">

<div class="glow glow-one"></div>
<div class="glow glow-two"></div>


<div class="login-card">


<div class="login-logo">
💎
</div>


<h1>
Zyper Diamond Store
</h1>


<p class="login-subtitle">
Administrator Panel
</p>


<div id="msg"
class="login-message">
</div>


<div class="input-group">

<label>
📧 Admin Email
</label>

<input
type="email"
id="email"
placeholder="Enter admin email"
autocomplete="username">

</div>


<div class="input-group">

<label>
🔐 Password
</label>

<input
type="password"
id="password"
placeholder="Enter password"
autocomplete="current-password">

</div>


<button
id="login"
class="login-button">

🔐 LOGIN TO DASHBOARD

</button>


<div class="security-note">

🔒 Secure Firebase Authentication

</div>


</div>

</div>


<script
type="module"
src="admin.js">
</script>

</body>

</html>
