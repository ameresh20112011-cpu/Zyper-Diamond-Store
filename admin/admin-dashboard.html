```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Zyper Dashboard</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<!-- =====================================================
     ADMIN DASHBOARD
===================================================== -->

<div id="app" style="display:none;">


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div class="sidebar">

<h1>
💎 Zyper
</h1>

<h3>
Admin Panel
</h3>

<button id="logout">
Logout
</button>

</div>



<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


<h1>
Orders Dashboard
</h1>



<!-- =====================================================
     DASHBOARD CARDS
===================================================== -->

<div class="cards">


<div class="card">

<h3>
Orders
</h3>

<h2 id="totalOrders">
0
</h2>

</div>



<div class="card">

<h3>
Revenue
</h3>

<h2>
LKR <span id="revenue">0</span>
</h2>

</div>



<div class="card">

<h3>
Pending
</h3>

<h2 id="pendingOrders">
0
</h2>

</div>



<div class="card">

<h3>
Success
</h3>

<h2 id="successOrders">
0
</h2>

</div>


</div>



<!-- =====================================================
     SEARCH
===================================================== -->

<input
id="search"
class="search"
type="text"
placeholder="🔎 Search Order ID / Customer / UID / Phone"
autocomplete="off"
>



<!-- =====================================================
     ORDERS TABLE
===================================================== -->

<div class="table-wrapper">

<table>


<thead>

<tr>

<th>
Order ID
</th>

<th>
Customer
</th>

<th>
Phone
</th>

<th>
Firebase UID
</th>

<th>
Game UID
</th>

<th>
Product
</th>

<th>
Price
</th>

<th>
Payment
</th>

<th>
Date Time
</th>

<th>
Total
</th>

<th>
Status
</th>

<th>
Action
</th>

</tr>

</thead>



<tbody id="orders">

<tr>

<td colspan="12">
Loading orders...
</td>

</tr>

</tbody>


</table>

</div>


</div>

</div>



<!-- =====================================================
     ADMIN JAVASCRIPT
===================================================== -->

<script
type="module"
src="admin.js">
</script>


</body>

</html>
```
