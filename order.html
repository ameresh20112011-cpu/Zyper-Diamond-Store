<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zyper Diamond Store - Order</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:'Segoe UI',Arial,sans-serif;

background:
linear-gradient(135deg,#020617,#0f172a,#312e81);

color:white;

min-height:100vh;

}

.container{

padding:20px;

display:flex;

justify-content:center;

}

.card{

width:100%;

max-width:420px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(15px);

padding:25px;

border-radius:25px;

border:1px solid rgba(255,255,255,.15);

box-shadow:
0 20px 50px rgba(0,0,0,.4);

animation:show .5s ease;

}

@keyframes show{

from{

opacity:0;

transform:translateY(25px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.logo{

text-align:center;

font-size:45px;

}

.title{

text-align:center;

font-size:26px;

font-weight:800;

background:
linear-gradient(90deg,#60a5fa,#c084fc);

-webkit-background-clip:text;

background-clip:text;

color:transparent;

}

.subtitle{

text-align:center;

color:#cbd5e1;

margin-bottom:20px;

}


/* =========================
   PACKAGE
========================= */

.package-box{

background:
linear-gradient(
135deg,
rgba(37,99,235,.25),
rgba(124,58,237,.25)
);

padding:18px;

border-radius:18px;

border:1px solid rgba(255,255,255,.15);

margin-bottom:20px;

text-align:center;

}

.package-label{

font-size:12px;

color:#94a3b8;

}

.package-name{

font-size:20px;

font-weight:bold;

margin-top:5px;

}

.package-price{

font-size:24px;

font-weight:bold;

color:#60a5fa;

margin-top:5px;

}


/* =========================
   INPUT
========================= */

.field{

margin-top:16px;

}

.field label{

display:block;

font-size:13px;

font-weight:600;

color:#cbd5e1;

margin-bottom:7px;

}

input[type="text"],
input[type="tel"]{

width:100%;

padding:14px;

border:1px solid rgba(255,255,255,.1);

border-radius:12px;

background:#1e293b;

color:white;

font-size:15px;

outline:none;

}

input::placeholder{

color:#94a3b8;

}

input:focus{

border-color:#60a5fa;

box-shadow:
0 0 0 3px rgba(96,165,250,.1);

}


/* =========================
   UPLOAD
========================= */

.upload-box{

margin-top:20px;

}

.upload-label{

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

padding:25px;

border-radius:20px;

border:2px dashed #60a5fa;

background:
linear-gradient(
135deg,
rgba(37,99,235,.25),
rgba(124,58,237,.25)
);

cursor:pointer;

transition:.3s;

}

.upload-label:hover{

transform:scale(1.02);

border-color:#c084fc;

}

.upload-label.active{

border-color:#22c55e;

background:
rgba(34,197,94,.15);

}

.upload-icon{

font-size:50px;

}

.upload-text{

text-align:center;

}

.upload-text h3{

margin:10px 0 5px;

}

.upload-text p{

color:#cbd5e1;

font-size:13px;

margin:0;

word-break:break-word;

}

#receipt{

display:none;

}


/* =========================
   PREVIEW
========================= */

.preview{

width:100%;

max-height:300px;

object-fit:contain;

margin-top:15px;

border-radius:15px;

display:none;

border:1px solid rgba(255,255,255,.15);

}


/* =========================
   BUTTON
========================= */

button{

width:100%;

padding:15px;

margin-top:20px;

border:none;

border-radius:15px;

background:
linear-gradient(
90deg,
#2563eb,
#7c3aed
);

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

box-shadow:
0 10px 25px rgba(37,99,235,.35);

transition:.3s;

}

button:hover{

transform:translateY(-2px);

}

button:disabled{

opacity:.6;

cursor:not-allowed;

transform:none;

}


/* =========================
   LOADING
========================= */

#loading{

display:none;

text-align:center;

color:#93c5fd;

margin-top:15px;

font-size:14px;

}


/* =========================
   ERROR
========================= */

#error{

display:none;

background:rgba(239,68,68,.12);

border:1px solid rgba(239,68,68,.35);

color:#fca5a5;

padding:13px;

border-radius:12px;

margin-bottom:15px;

font-size:13px;

text-align:center;

}


/* =========================
   SUCCESS
========================= */

#success{

display:none;

text-align:center;

}

.success-icon{

font-size:65px;

margin-top:10px;

}

.success-title{

font-size:25px;

font-weight:bold;

margin-top:10px;

}

.order-id{

font-size:42px;

font-weight:800;

letter-spacing:5px;

margin:15px 0;

background:
linear-gradient(90deg,#60a5fa,#c084fc);

-webkit-background-clip:text;

background-clip:text;

color:transparent;

}

.success-text{

color:#cbd5e1;

font-size:13px;

line-height:1.7;

}

.home-button{

display:block;

text-decoration:none;

padding:14px;

margin-top:20px;

border-radius:14px;

background:
linear-gradient(
90deg,
#2563eb,
#7c3aed
);

color:white;

font-weight:bold;

}


/* =========================
   BACK BUTTON
========================= */

.back-button{

display:block;

text-decoration:none;

padding:13px;

margin-top:12px;

border-radius:14px;

background:#334155;

color:white;

font-weight:bold;

text-align:center;

transition:.3s;

}

.back-button:hover{

background:#475569;

transform:translateY(-2px);

}

</style>

</head>


<body>


<div class="container">

<div class="card">


<!-- =========================
     ORDER FORM
========================= -->

<div id="formArea">


<div class="logo">
💎
</div>


<h2 class="title">
Place Your Order
</h2>


<p class="subtitle">
Complete your diamond purchase
</p>


<div id="error"></div>


<!-- =========================
     PACKAGE
========================= -->

<div class="package-box">

<div class="package-label">
SELECTED PACKAGE
</div>

<div
id="packageName"
class="package-name">

Loading...

</div>

<div
id="packagePrice"
class="package-price">

LKR 0

</div>

</div>


<!-- =========================
     UID
========================= -->

<div class="field">

<label for="uid">
🎮 Free Fire UID
</label>

<input
type="text"
id="uid"
inputmode="numeric"
maxlength="15"
placeholder="Enter your Free Fire UID"
autocomplete="off"
>

</div>


<!-- =========================
     CUSTOMER NAME
========================= -->

<div class="field">

<label for="playerName">
👤 Customer Name
</label>

<input
type="text"
id="playerName"
maxlength="50"
placeholder="Enter your Customer Name"
autocomplete="name"
>

</div>


<!-- =========================
     PHONE
========================= -->

<div class="field">

<label for="phone">
📱 WhatsApp / Phone
</label>

<input
type="tel"
id="phone"
maxlength="20"
placeholder="07XXXXXXXX"
autocomplete="tel"
>

</div>


<!-- =========================
     RECEIPT
========================= -->

<div class="upload-box">

<input
type="file"
id="receipt"
accept="image/jpeg,image/png"
>

<label
for="receipt"
class="upload-label"
id="uploadLabel"
>

<div class="upload-icon">
📸
</div>


<div class="upload-text">

<h3 id="uploadTitle">
Upload Payment Receipt
</h3>

<p id="uploadText">
JPG or PNG • Maximum 5 MB
</p>

</div>

</label>


<img
id="preview"
class="preview"
alt="Payment Receipt Preview"
>

</div>


<!-- =========================
     SUBMIT
========================= -->

<button
id="send"
type="button">

🚀 Place Order

</button>


<p id="loading">
⏳ Sending Order...
</p>


<!-- BACK -->

<a
href="topup.html"
class="back-button">

⬅️ Back to Top Up

</a>


</div>


<!-- =========================
     SUCCESS
========================= -->

<div id="success">


<div class="success-icon">
✅
</div>


<div class="success-title">
Order Submitted!
</div>


<p class="success-text">

Your order has been successfully sent
to Zyper Diamond Store.

</p>


<div
id="orderId"
class="order-id">

0000

</div>


<p class="success-text">

⏳ Status: <b>Pending</b>

<br><br>

Please save your Order ID.

</p>


<a
href="topup.html"
class="home-button">

💎 Place Another Order

</a>


</div>


</div>

</div>


<script>


/* =========================================
   CLOUDFLARE WORKER URL
========================================= */

const WORKER_URL =
"https://zyper-order.ameresh20112011.workers.dev/";


/* =========================================
   PACKAGE PRICES
========================================= */

const PACKAGES = {

"Weekly":560,

"Monthly":2720,

"Weekly Lite":150,

"VIP Bundle":3280,

"SVIP Bundle":4960,

"Level 6":130,

"Level 10":250,

"Level 15":250,

"Level 20":250,

"Level 25":250,

"Level 30":380,

"Full Pass":1500,

"E Badge 3":250,

"E Badge 7":350,

"E Badge 30":1100,

"25 Diamonds":150,

"100 Diamonds":380,

"310 Diamonds":1150,

"520 Diamonds":1800,

"1060 Diamonds":3400,

"2180 Diamonds":6500,

"5600 Diamonds":16500,

"11500 Diamonds":35000

};


/* =========================================
   ERROR ELEMENT
========================================= */

const errorBox =
document.getElementById("error");


/* =========================================
   SHOW ERROR
========================================= */

function showError(message){

errorBox.textContent =
message;

errorBox.style.display =
"block";

window.scrollTo({

top:0,

behavior:"smooth"

});

}


/* =========================================
   HIDE ERROR
========================================= */

function hideError(){

errorBox.style.display =
"none";

}


/* =========================================
   GET SELECTED PACKAGE
========================================= */

function getSelectedPackage(){

const raw =
localStorage.getItem("package");

if(!raw){

return null;

}


const separator =
" - LKR ";


const index =
raw.lastIndexOf(separator);


if(index === -1){

return null;

}


const name =
raw
.substring(0,index)
.trim();


const price =
Number(
raw
.substring(
index + separator.length
)
.trim()
);


if(
!Object.prototype.hasOwnProperty.call(
PACKAGES,
name
)
){

return null;

}


if(
PACKAGES[name] !== price
){

return null;

}


return {

name:name,

price:price

};

}


/* =========================================
   LOAD PACKAGE
========================================= */

const selected =
getSelectedPackage();


if(!selected){

document
.getElementById("packageName")
.textContent =
"No Package Selected";

document
.getElementById("packagePrice")
.textContent =
"LKR 0";

document
.getElementById("send")
.disabled =
true;

showError(
"Package information is missing. Please go back and select a package."
);

}else{

document
.getElementById("packageName")
.textContent =
selected.name;

document
.getElementById("packagePrice")
.textContent =
"LKR " +
selected.price.toLocaleString("en-US");

}


/* =========================================
   RECEIPT UPLOAD
========================================= */

document
.getElementById("receipt")
.addEventListener(
"change",
function(){

hideError();

const file =
this.files[0];

if(!file){

return;

}


/* TYPE */

if(
file.type !== "image/jpeg" &&
file.type !== "image/png"
){

this.value="";

showError(
"❌ Only JPG and PNG receipts are allowed."
);

return;

}


/* SIZE */

if(
file.size > 5 * 1024 * 1024
){

this.value="";

showError(
"❌ Receipt image must be 5 MB or smaller."
);

return;

}


/* PREVIEW */

const preview =
document.getElementById("preview");


if(
preview.src
){

URL.revokeObjectURL(
preview.src
);

}


preview.src =
URL.createObjectURL(file);

preview.style.display =
"block";


document
.getElementById("uploadLabel")
.classList
.add("active");


document
.getElementById("uploadTitle")
.textContent =
"✅ Receipt Selected";


document
.getElementById("uploadText")
.textContent =
file.name;

}
);


/* =========================================
   SUBMIT ORDER
========================================= */

document
.getElementById("send")
.addEventListener(
"click",
async function(){

hideError();


/* PACKAGE CHECK */

if(!selected){

showError(
"Please select a package first."
);

return;

}


/* BUTTON */

const button =
document.getElementById("send");


if(button.disabled){

return;

}


/* VALUES */

const uid =
document
.getElementById("uid")
.value
.trim();


const playerName =
document
.getElementById("playerName")
.value
.trim();


const phone =
document
.getElementById("phone")
.value
.trim();


const receipt =
document
.getElementById("receipt")
.files[0];


/* UID VALIDATION */

if(
!/^[0-9]{6,15}$/.test(uid)
){

showError(
"❌ Please enter a valid Free Fire UID (6-15 digits)."
);

document
.getElementById("uid")
.focus();

return;

}


/* CUSTOMER NAME */

if(
playerName.length < 2 ||
playerName.length > 50
){

showError(
"❌ Customer Name must be between 2 and 50 characters."
);

document
.getElementById("playerName")
.focus();

return;

}


/* PHONE */

const cleanPhone =
phone.replace(
/[\s\-().]/g,
""
);


if(
!/^\+?[0-9]{9,15}$/.test(
cleanPhone
)
){

showError(
"❌ Please enter a valid WhatsApp / Phone number."
);

document
.getElementById("phone")
.focus();

return;

}


/* RECEIPT */

if(!receipt){

showError(
"❌ Please upload your payment receipt."
);

return;

}


if(
receipt.type !== "image/jpeg" &&
receipt.type !== "image/png"
){

showError(
"❌ Receipt must be JPG or PNG."
);

return;

}


if(
receipt.size > 5 * 1024 * 1024
){

showError(
"❌ Receipt must be 5 MB or smaller."
);

return;

}


/* =========================================
   LOADING
========================================= */

button.disabled =
true;

button.textContent =
"⏳ Sending Order...";


document
.getElementById("loading")
.style.display =
"block";


try{


/* =========================================
   FORM DATA
========================================= */

const formData =
new FormData();


formData.append(
"package",
selected.name +
" - LKR " +
selected.price
);


formData.append(
"uid",
uid
);


formData.append(
"playerName",
playerName
);


formData.append(
"phone",
phone
);


formData.append(
"receipt",
receipt,
receipt.name
);


/* =========================================
   SEND TO CLOUDFLARE WORKER
========================================= */

const response =
await fetch(
WORKER_URL,
{

method:"POST",

body:formData

}
);


/* =========================================
   READ RESPONSE
========================================= */

let result;

try{

result =
await response.json();

}catch{

throw new Error(
"Invalid response from Cloudflare Worker."
);

}


/* =========================================
   SERVER ERROR
========================================= */

if(
!response.ok ||
!result.success
){

throw new Error(
result.message ||
"Order submission failed."
);

}


/* =========================================
   SUCCESS
========================================= */

document
.getElementById("formArea")
.style.display =
"none";


document
.getElementById("success")
.style.display =
"block";


document
.getElementById("orderId")
.textContent =
result.orderId;


/* =========================================
   CLEAR PACKAGE ONLY AFTER SUCCESS
========================================= */

localStorage.removeItem(
"package"
);


window.scrollTo({

top:0,

behavior:"smooth"

});


}catch(error){

console.error(
"Order error:",
error
);

showError(
"❌ " +
(
error.message ||
"Something went wrong. Please try again."
)
);


button.disabled =
false;

button.textContent =
"🚀 Place Order";


}finally{

document
.getElementById("loading")
.style.display =
"none";

}

}
);

</script>


</body>

</html>
