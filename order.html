<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zyper Diamond Store - Order</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:'Segoe UI',Arial,sans-serif;

background:
linear-gradient(135deg,#020617,#0f172a,#312e81);

color:white;

}



.container{

padding:20px;
display:flex;
justify-content:center;

}



.card{

width:100%;
max-width:420px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(15px);

padding:25px;

border-radius:25px;

border:1px solid rgba(255,255,255,.15);

box-shadow:
0 20px 50px rgba(0,0,0,.4);

}



.logo{

text-align:center;
font-size:45px;

}



.title{

text-align:center;
font-size:26px;
font-weight:800;

background:linear-gradient(90deg,#60a5fa,#c084fc);

-webkit-background-clip:text;
background-clip:text;

color:transparent;

}



.subtitle{

text-align:center;

color:#cbd5e1;

margin-bottom:20px;

}



input{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:12px;

background:#1e293b;

color:white;

font-size:15px;

}



input::placeholder{

color:#94a3b8;

}



/* Upload Box */


.upload-box{

margin-top:20px;

}



.upload-label{


display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

padding:25px;

border-radius:20px;

border:2px dashed #60a5fa;

background:

linear-gradient(
135deg,
rgba(37,99,235,.25),
rgba(124,58,237,.25)
);


cursor:pointer;

transition:.3s;


}



.upload-label:hover{

transform:scale(1.03);

border-color:#c084fc;

}



.upload-icon{

font-size:50px;

}



.upload-text{

text-align:center;

}



.upload-text h3{

margin:10px 0 5px;

}



.upload-text p{

color:#cbd5e1;

font-size:14px;

}



.upload-label.active{

border-color:#22c55e;

background:

rgba(34,197,94,.15);

}




.preview{

width:100%;

margin-top:15px;

border-radius:15px;

display:none;

}





button{

width:100%;

padding:15px;

margin-top:20px;

border:none;

border-radius:15px;

background:

linear-gradient(
90deg,
#2563eb,
#7c3aed
);

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

}



button:hover{

transform:translateY(-2px);

}



#loading{

display:none;

text-align:center;

color:#93c5fd;

margin-top:15px;

}



</style>


</head>



<body>



<div class="container">


<div class="card">


<div class="logo">
💎
</div>



<h2 class="title">

Place Your Order

</h2>



<p class="subtitle">

Complete your diamond purchase

</p>




<input

id="uid"

placeholder="🎮 Enter Game UID"

>




<input

id="diamond"

readonly

placeholder="💎 Selected Package"

>





<div class="upload-box">


<input

type="file"

id="receipt"

accept="image/*"

hidden

>



<label

for="receipt"

class="upload-label"



>


<div class="upload-icon">

📸

</div>



<div class="upload-text">


<h3>

Upload Payment Receipt

</h3>


<p>

Tap here to select screenshot

</p>


</div>


</label>



</div>





<img

id="preview"

class="preview"

>




<button id="send">

🚀 Place Order

</button>



<p id="loading">

⏳ Sending Order...

</p>




</div>


</div>







<script type="module">


import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getFirestore,
collection,
addDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



import {

getAuth,
onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";






const firebaseConfig = {


apiKey:"AIzaSyCd_2LplLOl4TOGjbWQqndwHNGzPh2PEHM",

authDomain:"zyper-d-iamond-store.firebaseapp.com",

projectId:"zyper-d-iamond-store",

messagingSenderId:"892467477866",

appId:"1:892467477866:web:61e9b6ff9435798da23913"

};





const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


const auth =
getAuth(app);



let currentUser=null;




onAuthStateChanged(auth,(user)=>{


if(user){

currentUser=user;

}

else{

location.href="index.html";

}


});





let savedPackage =
localStorage.getItem("package");


if(savedPackage){

document.getElementById("diamond").value=savedPackage;

}






// BEAUTIFUL RECEIPT UPLOAD


document
.getElementById("receipt")
.addEventListener("change",function(){


let file=this.files[0];


if(file){


let img=document.getElementById("preview");


img.src=URL.createObjectURL(file);


img.style.display="block";



document
.querySelector(".upload-label")
.classList.add("active");



document
.querySelector(".upload-text h3")
.innerHTML="✅ Receipt Selected";



document
.querySelector(".upload-text p")
.innerHTML=file.name;


}


});







// SEND ORDER


document
.getElementById("send")
.onclick=async()=>{


if(!currentUser){

alert("Please login first");

return;

}



let uid=
document.getElementById("uid").value.trim();



let pack=
document.getElementById("diamond").value;



let receipt=
document.getElementById("receipt").files[0];





if(uid==""){

alert("Enter Game UID");

return;

}



if(!receipt){

alert("Upload payment receipt");

return;

}




try{


document
.getElementById("loading")
.style.display="block";



const orderRef =
await addDoc(

collection(db,"orders"),

{

userId:currentUser.uid,

email:currentUser.email,

gameUID:uid,

package:pack,

status:"Pending",

receipt:"Telegram",

createdAt:serverTimestamp()

}

);




let orderID=orderRef.id;






let formData=new FormData();


formData.append(
"photo",
receipt
);



formData.append(
"caption",

`

💎 New Zyper Order

🆔 Order ID:
${orderID}

🎮 UID:
${uid}

💎 Package:
${pack}

👤 Email:
${currentUser.email}

`

);





fetch(
"telegram.php",
{

method:"POST",

body:formData

}

);





let message=

`

💎 Zyper Diamond Store

Order ID:
${orderID}

UID:
${uid}

Package:
${pack}

Payment Completed

`;





window.open(

"https://wa.me/94751483909?text="+encodeURIComponent(message),

"_blank"

);





alert(
"✅ Order Sent\n\nOrder ID:\n"+orderID
);




location.href="track.html?id="+orderID;




}

catch(error){


alert(error.message);


}


finally{


document
.getElementById("loading")
.style.display="none";


}



};



</script>



</body>

</html>
