<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Zyper Diamond Store</title>

<link
rel="icon"
href="./1.jpg"
>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    color:white;

    background:

    radial-gradient(
        circle at 15% 15%,
        rgba(37,99,235,.20),
        transparent 35%
    ),

    radial-gradient(
        circle at 85% 20%,
        rgba(124,58,237,.20),
        transparent 35%
    ),

    linear-gradient(
        145deg,
        #020617,
        #0f172a,
        #111827
    );

}


.loading-box{

    text-align:center;

    padding:30px;

}


.logo{

    width:72px;
    height:72px;

    margin:
    0 auto 18px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:20px;

    font-size:38px;

    background:

    linear-gradient(
        135deg,
        rgba(37,99,235,.35),
        rgba(124,58,237,.35)
    );

    border:
    1px solid
    rgba(129,140,248,.30);

    box-shadow:

    0 0 35px
    rgba(79,70,229,.20);

}


h1{

    margin:0 0 8px;

    font-size:22px;

}


p{

    margin:0;

    color:#94a3b8;

    font-size:13px;

}


.loader{

    width:38px;
    height:38px;

    margin:
    24px auto 0;

    border-radius:50%;

    border:
    3px solid
    rgba(255,255,255,.12);

    border-top-color:
    #60a5fa;

    animation:
    spin .8s linear infinite;

}


@keyframes spin{

    to{
        transform:
        rotate(360deg);
    }

}

</style>

</head>


<body>


<div class="loading-box">

    <div class="logo">
        💎
    </div>


    <h1>
        Zyper Diamond Store
    </h1>


    <p>
        Opening store...
    </p>


    <div class="loader"></div>

</div>



<script>

setTimeout(
    function(){

        window.location.replace(
            "./home.html"
        );

    },
    350
);

</script>


</body>

</html>
