<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Zyper Diamond Store - Login</title>

<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="media.css">
<link rel="icon" href="1.jpg">

<style>

/* ==================================================
   HEADER
================================================== */

.login-header{
    text-align:center;
    margin-bottom:28px;
}

.company-logo{
    width:76px !important;
    height:76px !important;

    min-width:76px !important;
    min-height:76px !important;

    max-width:76px !important;
    max-height:76px !important;

    margin:0 auto 15px !important;
    padding:0 !important;

    border-radius:50% !important;
    overflow:hidden !important;

    display:flex !important;
    align-items:center !important;
    justify-content:center !important;

    background:#fff;

    box-shadow:
    0 8px 25px rgba(0,0,0,.20);
}

.company-logo img{
    width:100% !important;
    height:100% !important;

    display:block !important;
    object-fit:cover !important;

    border-radius:50% !important;
}

.brand-name{
    margin:0;
    font-size:24px;
    font-weight:800;
}

.brand-subtitle{
    margin:7px 0 0;
    font-size:13px;
    opacity:.7;
}


/* ==================================================
   PASSWORD
================================================== */

.password-group{
    position:relative;
}

.password-group input{
    padding-right:58px !important;
}

.password-toggle{

    position:absolute;

    right:7px;
    top:50%;

    transform:translateY(-50%);

    width:44px;
    height:44px;

    padding:0;
    margin:0;

    border:0;
    outline:0;

    border-radius:50%;

    background:transparent;
    color:inherit;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:999;

    touch-action:manipulation;

    -webkit-tap-highlight-color:transparent;

    user-select:none;
    -webkit-user-select:none;
}

.password-toggle:active{
    transform:translateY(-50%) scale(.90);
}

.password-toggle svg{
    width:21px;
    height:21px;
    pointer-events:none;
}


/* ==================================================
   STATUS
================================================== */

.login-status{

    display:none;

    text-align:center;

    margin-top:15px;

    padding:10px;

    border-radius:10px;

    font-size:13px;
    font-weight:600;
}


/* ==================================================
   GOOGLE DIVIDER
================================================== */

.google-divider{

    display:flex;

    align-items:center;

    gap:12px;

    margin:8px 0 16px;

    color:rgba(255,255,255,.55);

    font-size:12px;
    font-weight:600;
}

.google-divider::before,
.google-divider::after{

    content:"";

    flex:1;

    height:1px;

    background:rgba(255,255,255,.12);
}


/* ==================================================
   GOOGLE BUTTON
================================================== */

.google-login-button{

    width:100%;

    min-height:52px;

    border:0;

    border-radius:14px;

    background:#ffffff;

    color:#1f2937;

    font-family:inherit;

    font-size:14px;
    font-weight:700;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:11px;

    box-shadow:
    0 8px 22px rgba(0,0,0,.12);

    touch-action:manipulation;

    -webkit-tap-highlight-color:transparent;
}

.google-login-button:active{
    transform:scale(.985);
}

.google-login-button:disabled{
    opacity:.72;
    cursor:not-allowed;
}

.google-login-button svg{
    width:20px;
    height:20px;
    flex:0 0 20px;
}


/* MORE GAP GOOGLE -> CREATE ACCOUNT */

.signup-link{
    margin-top:30px !important;
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:500px){

    .company-logo{

        width:68px !important;
        height:68px !important;

        min-width:68px !important;
        min-height:68px !important;

        max-width:68px !important;
        max-height:68px !important;
    }

    .brand-name{
        font-size:21px;
    }

    input{
        font-size:16px !important;
    }

    .password-toggle{
        width:46px;
        height:46px;
        right:4px;
    }

    .google-login-button{
        min-height:52px;
        font-size:14px;
    }

}

</style>

</head>


<body>


<div class="login-container">

<div class="login-card">


<!-- HEADER -->

<div class="login-header">

<div class="company-logo">

<img
src="1.jpg"
alt="Zyper Diamond Store"
>

</div>


<h2 class="brand-name">
Zyper Diamond Store
</h2>


<p class="brand-subtitle">
Welcome back! Sign in to continue
</p>

</div>



<!-- LOGIN FORM -->

<form
id="loginForm"
class="login-form"
novalidate
>


<!-- EMAIL -->

<div class="form-group">

<div class="input-group neu-input">

<input
type="email"
id="email"
name="email"
required
autocomplete="email"
inputmode="email"
placeholder=" "
>

<label for="email">
Email Address
</label>

</div>

</div>



<!-- PASSWORD -->

<div class="form-group">

<div class="input-group neu-input password-group">

<input
type="password"
id="password"
name="password"
required
autocomplete="current-password"
placeholder=" "
>

<label for="password">
Password
</label>


<button
type="button"
id="passwordToggle"
class="password-toggle"
aria-label="Show password"
aria-pressed="false"
>


<svg
id="eyeOpen"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round"
>

<path
d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
/>

<circle
cx="12"
cy="12"
r="3"
/>

</svg>


<svg
id="eyeClosed"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round"
style="display:none;"
>

<path
d="M17.94 17.94A10.07 10.07 0 0 1 12 20"
/>

<path
d="M9.9 4.24A9.12 9.12 0 0 1 12 4"
/>

<path
d="M3 3l18 18"
/>

<path
d="M6.71 6.71C3.93 8.5 2 12 2 12s4 8 10 8c1.52 0 2.9-.38 4.12-.98"
/>

<path
d="M14.12 14.12A3 3 0 0 1 9.88 9.88"
/>

<path
d="M17.29 17.29C20.07 15.5 22 12 22 12s-4-8-10-8c-.72 0-1.41.09-2.06.24"
/>

</svg>

</button>

</div>

</div>



<!-- OPTIONS -->

<div class="form-options">


<div class="remember-wrapper">

<input
type="checkbox"
id="remember"
name="remember"
checked
>


<label
for="remember"
class="checkbox-label"
>


<div class="neu-checkbox">

<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="3"
>

<polyline
points="20 6 9 17 4 12"
/>

</svg>

</div>


Remember me

</label>

</div>



<a
href="./forgot-password.html"
class="forgot-link"
>

Forgot password?

</a>


</div>



<!-- SIGN IN -->

<button
type="submit"
class="neu-button login-btn"
id="loginButton"
>

<span id="loginText">
Sign In
</span>

<span
id="loginLoading"
style="display:none;"
>

Signing in...

</span>

</button>



<div
id="loginStatus"
class="login-status"
role="status"
aria-live="polite"
>
</div>


</form>



<!-- OR -->

<div class="google-divider">

<span>
OR
</span>

</div>



<!-- GOOGLE LOGIN -->

<button
type="button"
id="googleLoginButton"
class="google-login-button"
>


<svg
viewBox="0 0 24 24"
aria-hidden="true"
>

<path
fill="#4285F4"
d="M21.35 12.2c0-.64-.06-1.25-.17-1.84H12v3.48h5.25a4.48 4.48 0 0 1-1.95 2.94v2.26h3.16c1.85-1.7 2.89-4.22 2.89-6.84z"
/>

<path
fill="#34A853"
d="M12 21.72c2.64 0 4.86-.87 6.48-2.37l-3.16-2.26c-.88.59-2 .94-3.32.94-2.55 0-4.71-1.72-5.48-4.03H3.25v2.34A9.79 9.79 0 0 0 12 21.72z"
/>

<path
fill="#FBBC05"
d="M6.52 14a5.87 5.87 0 0 1 0-3.76V7.9H3.25a9.79 9.79 0 0 0 0 8.44L6.52 14z"
/>

<path
fill="#EA4335"
d="M12 6.2c1.44 0 2.73.49 3.75 1.46l2.81-2.81A9.43 9.43 0 0 0 12 2.5 9.79 9.79 0 0 0 3.25 7.9l3.27 2.34C7.29 7.93 9.45 6.2 12 6.2z"
/>

</svg>


<span id="googleLoginText">
Continue with Google
</span>


</button>



<!-- CREATE ACCOUNT -->

<div class="signup-link">

<p>

Don't have an account?

<a href="./register.html">
Create Account
</a>

</p>

</div>


</div>

</div>



<script type="module">


/* ==================================================
   FIREBASE
================================================== */

import {
    auth,
    db
}
from "./firebase.js";


import {

    signInWithEmailAndPassword,

    setPersistence,

    browserLocalPersistence,

    browserSessionPersistence,

    onAuthStateChanged,

    GoogleAuthProvider,

    signInWithPopup,

    signOut

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

    doc,

    getDoc,

    setDoc,

    serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* ==================================================
   ELEMENTS
================================================== */

const loginForm =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const passwordToggle =
document.getElementById("passwordToggle");

const eyeOpen =
document.getElementById("eyeOpen");

const eyeClosed =
document.getElementById("eyeClosed");

const rememberInput =
document.getElementById("remember");

const loginButton =
document.getElementById("loginButton");

const loginText =
document.getElementById("loginText");

const loginLoading =
document.getElementById("loginLoading");

const loginStatus =
document.getElementById("loginStatus");

const googleLoginButton =
document.getElementById("googleLoginButton");

const googleLoginText =
document.getElementById("googleLoginText");


let loginInProgress =
false;



/* ==================================================
   STATUS
================================================== */

function showStatus(
    message,
    type = "error"
){

    loginStatus.style.display =
    "block";


    loginStatus.textContent =
    message;


    if(type === "success"){

        loginStatus.style.color =
        "#4ade80";


        loginStatus.style.background =
        "rgba(34,197,94,.10)";

    }

    else{

        loginStatus.style.color =
        "#fca5a5";


        loginStatus.style.background =
        "rgba(239,68,68,.10)";

    }

}



function clearStatus(){

    loginStatus.style.display =
    "none";

    loginStatus.textContent =
    "";

}



/* ==================================================
   LOADING
================================================== */

function setLoading(
    loading
){

    loginButton.disabled =
    loading;


    loginText.style.display =
    loading
    ?
    "none"
    :
    "inline";


    loginLoading.style.display =
    loading
    ?
    "inline"
    :
    "none";

}



/* ==================================================
   PASSWORD SHOW / HIDE
================================================== */

function togglePassword(){

    const hidden =
    passwordInput.type === "password";


    if(hidden){

        passwordInput.type =
        "text";


        eyeOpen.style.display =
        "none";


        eyeClosed.style.display =
        "block";


        passwordToggle.setAttribute(
            "aria-label",
            "Hide password"
        );


        passwordToggle.setAttribute(
            "aria-pressed",
            "true"
        );

    }

    else{

        passwordInput.type =
        "password";


        eyeOpen.style.display =
        "block";


        eyeClosed.style.display =
        "none";


        passwordToggle.setAttribute(
            "aria-label",
            "Show password"
        );


        passwordToggle.setAttribute(
            "aria-pressed",
            "false"
        );

    }

}



passwordToggle.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();

    }
);



passwordToggle.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        event.stopPropagation();


        togglePassword();


        passwordInput.focus({
            preventScroll:true
        });

    }
);



/* ==================================================
   CHECK PASSWORD ACCOUNT OTP STATUS
================================================== */

async function checkOtpVerified(
    user
){

    try{

        const userRef =
        doc(
            db,
            "users",
            user.uid
        );


        const userSnap =
        await getDoc(
            userRef
        );


        if(!userSnap.exists()){

            return false;

        }


        const userData =
        userSnap.data();


        return (
            userData.otpVerified === true
        );

    }

    catch(error){

        console.error(
            "OTP STATUS CHECK ERROR:",
            error
        );


        return false;

    }

}



/* ==================================================
   SAVE GOOGLE USER
================================================== */

async function saveGoogleUserToFirestore(
    user
){

    if(!user){

        throw new Error(
            "Google user is missing."
        );

    }


    const userRef =
    doc(
        db,
        "users",
        user.uid
    );


    const userSnapshot =
    await getDoc(
        userRef
    );


    /* FIRST LOGIN */

    if(!userSnapshot.exists()){

        await setDoc(
            userRef,
            {

                uid:
                user.uid,

                email:
                user.email || "",

                name:
                user.displayName || "",

                username:
                user.displayName || "",

                photoURL:
                user.photoURL || "",

                provider:
                "google",

                role:
                "customer",

                otpVerified:
                true,

                createdAt:
                serverTimestamp(),

                lastLoginAt:
                serverTimestamp()

            }
        );

    }

    else{

        /*
           DO NOT OVERWRITE ROLE
        */

        await setDoc(
            userRef,
            {

                uid:
                user.uid,

                email:
                user.email || "",

                name:
                user.displayName || "",

                username:
                user.displayName || "",

                photoURL:
                user.photoURL || "",

                provider:
                "google",

                lastLoginAt:
                serverTimestamp()

            },
            {
                merge:true
            }
        );

    }

}



/* ==================================================
   ALREADY LOGGED IN
================================================== */

const unsubscribe =
onAuthStateChanged(

    auth,

    async function(user){


        if(
            !user ||
            loginInProgress
        ){

            return;

        }


        /*
           CHECK PROVIDER
        */

        const passwordUser =
        user.providerData.some(
            function(provider){

                return (
                    provider.providerId ===
                    "password"
                );

            }
        );


        /*
           PASSWORD USER MUST HAVE
           otpVerified:true
        */

        if(passwordUser){

            const verified =
            await checkOtpVerified(
                user
            );


            if(!verified){

                await signOut(
                    auth
                );


                showStatus(
                    "Please verify your email OTP first."
                );


                return;

            }

        }


        /*
           VERIFIED / GOOGLE USER
           GO HOME
        */

        window.location.replace(
            "./home.html"
        );

    }

);



/* ==================================================
   GOOGLE PROVIDER
================================================== */

const googleProvider =
new GoogleAuthProvider();


googleProvider.setCustomParameters({

    prompt:
    "select_account"

});



/* ==================================================
   GOOGLE LOGIN
================================================== */

googleLoginButton.addEventListener(

    "click",

    async function(){


        if(loginInProgress){

            return;

        }


        clearStatus();


        loginInProgress =
        true;


        googleLoginButton.disabled =
        true;


        googleLoginText.textContent =
        "Connecting...";


        try{


            /* PERSISTENCE */

            if(rememberInput.checked){

                await setPersistence(
                    auth,
                    browserLocalPersistence
                );

            }

            else{

                await setPersistence(
                    auth,
                    browserSessionPersistence
                );

            }



            /* GOOGLE LOGIN */

            const result =
            await signInWithPopup(
                auth,
                googleProvider
            );


            if(!result.user){

                throw new Error(
                    "Google login session was not created."
                );

            }



            /* SAVE FIRESTORE USER */

            await saveGoogleUserToFirestore(
                result.user
            );



            /* REFRESH TOKEN */

            await result.user.getIdToken(
                true
            );



            showStatus(
                "Google login successful ✓",
                "success"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "./home.html"
                    );

                },
                250
            );


        }

        catch(error){


            console.error(
                "GOOGLE LOGIN ERROR:",
                error
            );


            loginInProgress =
            false;


            googleLoginButton.disabled =
            false;


            googleLoginText.textContent =
            "Continue with Google";


            let message =
            "Google login failed. Please try again.";



            if(
                error.code ===
                "auth/popup-closed-by-user" ||
                error.code ===
                "auth/cancelled-popup-request"
            ){

                message =
                "Google sign in was cancelled.";

            }


            else if(
                error.code ===
                "auth/popup-blocked"
            ){

                message =
                "Google sign in popup was blocked. Please allow popups and try again.";

            }


            else if(
                error.code ===
                "auth/account-exists-with-different-credential"
            ){

                message =
                "This email already has another login method. Please use your existing login method.";

            }


            else if(
                error.code ===
                "auth/unauthorized-domain"
            ){

                message =
                "This website domain is not authorized for Google login.";

            }


            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                message =
                "Network error. Check your internet connection.";

            }


            showStatus(
                message
            );

        }

    }

);



/* ==================================================
   EMAIL + PASSWORD LOGIN
================================================== */

loginForm.addEventListener(

    "submit",

    async function(event){


        event.preventDefault();


        clearStatus();


        const email =
        emailInput.value.trim();


        const password =
        passwordInput.value;



        /* EMAIL */

        if(!email){

            showStatus(
                "Please enter your email."
            );


            emailInput.focus();

            return;

        }



        /* PASSWORD */

        if(!password){

            showStatus(
                "Please enter your password."
            );


            passwordInput.focus();

            return;

        }



        loginInProgress =
        true;


        setLoading(
            true
        );


        try{


            /* PERSISTENCE */

            if(rememberInput.checked){

                await setPersistence(
                    auth,
                    browserLocalPersistence
                );

            }

            else{

                await setPersistence(
                    auth,
                    browserSessionPersistence
                );

            }



            /* FIREBASE LOGIN */

            const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            if(!result.user){

                throw new Error(
                    "Login session was not created."
                );

            }



            /* ==================================================
               CHECK OTP VERIFIED IN FIRESTORE
            ================================================== */

            const verified =
            await checkOtpVerified(
                result.user
            );


            if(!verified){

                await signOut(
                    auth
                );


                loginInProgress =
                false;


                setLoading(
                    false
                );


                showStatus(
                    "This account has not completed email OTP verification."
                );


                return;

            }



            /* ==================================================
               UPDATE LAST LOGIN
            ================================================== */

            await setDoc(
                doc(
                    db,
                    "users",
                    result.user.uid
                ),
                {

                    email:
                    result.user.email || email,

                    lastLoginAt:
                    serverTimestamp()

                },
                {
                    merge:true
                }
            );



            /* REFRESH TOKEN */

            await result.user.getIdToken(
                true
            );



            showStatus(
                "Login successful ✓",
                "success"
            );



            setTimeout(
                function(){

                    window.location.replace(
                        "./home.html"
                    );

                },
                350
            );


        }

        catch(error){


            console.error(
                "LOGIN ERROR:",
                error
            );


            loginInProgress =
            false;


            setLoading(
                false
            );


            let message =
            "Unable to login. Please try again.";



            if(
                error.code ===
                "auth/invalid-credential" ||
                error.code ===
                "auth/wrong-password"
            ){

                message =
                "Incorrect email or password.";

            }


            else if(
                error.code ===
                "auth/user-not-found"
            ){

                message =
                "No account found with this email.";

            }


            else if(
                error.code ===
                "auth/invalid-email"
            ){

                message =
                "Please enter a valid email address.";

            }


            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                message =
                "Too many login attempts. Please try again later.";

            }


            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                message =
                "Network error. Check your internet connection.";

            }


            showStatus(
                message
            );

        }

    }

);



/* ==================================================
   CLEAR STATUS
================================================== */

emailInput.addEventListener(
    "input",
    clearStatus
);


passwordInput.addEventListener(
    "input",
    clearStatus
);



/* ==================================================
   CLEANUP
================================================== */

window.addEventListener(

    "pagehide",

    function(){

        if(
            typeof unsubscribe ===
            "function"
        ){

            unsubscribe();

        }

    }

);

</script>


</body>

</html>
