<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Zyper Diamond Store - Login</title>

<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="media.css">

<link rel="icon" href="1.jpg">


<style>

.login-header{
    text-align:center;
    margin-bottom:28px;
}

.company-logo{
    width:76px !important;
    height:76px !important;

    min-width:76px !important;
    min-height:76px !important;

    max-width:76px !important;
    max-height:76px !important;

    margin:0 auto 14px !important;
    padding:0 !important;

    border-radius:50% !important;
    overflow:hidden !important;

    display:flex !important;

    align-items:center;
    justify-content:center;

    background:#fff;

    box-shadow:
        0 8px 20px rgba(0,0,0,.18),
        inset 0 0 0 3px rgba(255,255,255,.8);

    flex-shrink:0 !important;
}

.company-logo img{
    width:76px !important;
    height:76px !important;

    min-width:76px !important;
    min-height:76px !important;

    max-width:76px !important;
    max-height:76px !important;

    display:block !important;

    margin:0 !important;
    padding:0 !important;

    object-fit:cover !important;

    border-radius:50% !important;
}

.brand-name{
    margin:0;
    font-size:24px;
    font-weight:800;
}

.brand-subtitle{
    margin:7px 0 0;
    font-size:13px;
    opacity:.7;
}

.logo-glow{
    width:45px;
    height:3px;
    margin:12px auto 0;
    border-radius:10px;
    background:currentColor;
    opacity:.35;
}

.password-group{
    position:relative;
}

.password-group input{
    padding-right:55px !important;
}

.password-toggle{
    position:absolute;

    right:9px;
    top:50%;

    transform:translateY(-50%);

    width:38px;
    height:38px;

    border:none;
    border-radius:50%;

    background:transparent;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:10;
}

.password-toggle svg{
    width:20px;
    height:20px;
}

.login-status{
    display:none;

    text-align:center;

    margin-top:15px;

    font-size:14px;

    font-weight:600;
}

@media(max-width:500px){

    .company-logo{
        width:68px !important;
        height:68px !important;

        min-width:68px !important;
        min-height:68px !important;

        max-width:68px !important;
        max-height:68px !important;
    }

    .company-logo img{
        width:68px !important;
        height:68px !important;

        min-width:68px !important;
        min-height:68px !important;

        max-width:68px !important;
        max-height:68px !important;
    }

    .brand-name{
        font-size:21px;
    }

}

</style>

</head>


<body>


<div class="login-container">

<div class="login-card">


<!-- HEADER -->

<div class="login-header">

<div class="company-logo">

<img
src="1.jpg"
alt="Zyper Diamond Store">

</div>

<h2 class="brand-name">
Zyper Diamond Store
</h2>

<p class="brand-subtitle">
Welcome back! Sign in to continue
</p>

<div class="logo-glow"></div>

</div>



<!-- LOGIN -->

<form
id="loginForm"
class="login-form"
novalidate>


<!-- USERNAME / EMAIL -->

<div class="form-group">

<div class="input-group neu-input">

<input
type="text"
id="loginAccount"
required
autocomplete="username"
placeholder=" ">

<label for="loginAccount">
Username or Email
</label>

</div>

</div>



<!-- PASSWORD -->

<div class="form-group">

<div class="input-group neu-input password-group">

<input
type="password"
id="password"
required
autocomplete="current-password"
placeholder=" ">

<label for="password">
Password
</label>


<button
type="button"
id="passwordToggle"
class="password-toggle"
aria-label="Show password">


<svg
class="eye-open"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path
d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>

<circle
cx="12"
cy="12"
r="3"/>

</svg>


<svg
class="eye-closed"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
style="display:none;">

<path
d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>

<path
d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>

<line
x1="1"
y1="1"
x2="23"
y2="23"/>

</svg>

</button>

</div>

</div>



<!-- OPTIONS -->

<div class="form-options">

<div class="remember-wrapper">

<input
type="checkbox"
id="remember">

<label
for="remember"
class="checkbox-label">

<div class="neu-checkbox">

<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="3">

<polyline
points="20 6 9 17 4 12"/>

</svg>

</div>

Remember me

</label>

</div>


<a
href="forgot-password.html"
class="forgot-link">

Forgot password?

</a>

</div>



<!-- LOGIN BUTTON -->

<button
type="submit"
class="neu-button login-btn"
id="loginButton">

<span id="loginText">
Sign In
</span>

<span
id="loginLoading"
style="display:none;">

Signing in...

</span>

</button>


<div
id="loginStatus"
class="login-status">
</div>


</form>



<!-- REGISTER -->

<div class="signup-link">

<p>

Don't have an account?

<a href="register.html">
Create Account
</a>

</p>

</div>


</div>

</div>



<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyCd_2LplLOl4TOGjbWQqndwHNGzPh2PEHM",

authDomain:
"zyper-d-iamond-store.firebaseapp.com",

projectId:
"zyper-d-iamond-store",

storageBucket:
"zyper-d-iamond-store.firebasestorage.app",

messagingSenderId:
"892467477866",

appId:
"1:892467477866:web:61e9b6ff9435798da23913"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ELEMENTS */

const form =
document.getElementById("loginForm");

const account =
document.getElementById("loginAccount");

const password =
document.getElementById("password");

const toggle =
document.getElementById("passwordToggle");

const button =
document.getElementById("loginButton");

const loginText =
document.getElementById("loginText");

const loading =
document.getElementById("loginLoading");

const status =
document.getElementById("loginStatus");


/* PASSWORD */

toggle.addEventListener("click", () => {

    if(password.type === "password"){

        password.type = "text";

        toggle.querySelector(".eye-open")
            .style.display = "none";

        toggle.querySelector(".eye-closed")
            .style.display = "block";

    }else{

        password.type = "password";

        toggle.querySelector(".eye-open")
            .style.display = "block";

        toggle.querySelector(".eye-closed")
            .style.display = "none";

    }

});


/* AUTH CHECK */

onAuthStateChanged(auth, (user) => {

    if(user){

        window.location.href =
            "home.html";

    }

});


/* LOGIN */

form.addEventListener("submit", async (e) => {

    e.preventDefault();


    const loginValue =
        account.value.trim();

    const passwordValue =
        password.value;


    if(!loginValue){

        alert(
            "Enter your username or email."
        );

        return;

    }


    if(!passwordValue){

        alert(
            "Enter your password."
        );

        return;

    }


    try{

        button.disabled = true;

        loginText.style.display =
            "none";

        loading.style.display =
            "inline";


        let email = loginValue;


        /* USERNAME LOGIN */

        if(!loginValue.includes("@")){

            const usernameRef =
                doc(
                    db,
                    "usernames",
                    loginValue.toLowerCase()
                );


            const usernameDoc =
                await getDoc(
                    usernameRef
                );


            if(!usernameDoc.exists()){

                throw {
                    code:
                    "auth/user-not-found"
                };

            }


            email =
                usernameDoc.data().email;

        }


        /* FIREBASE LOGIN */

        await signInWithEmailAndPassword(
            auth,
            email,
            passwordValue
        );


        status.style.display =
            "block";

        status.style.color =
            "#00c853";

        status.textContent =
            "Login successful!";


        setTimeout(() => {

            window.location.href =
                "home.html";

        }, 700);


    }catch(error){

        console.error(error);


        button.disabled = false;

        loginText.style.display =
            "inline";

        loading.style.display =
            "none";


        if(
            error.code ===
            "auth/invalid-credential" ||
            error.code ===
            "auth/wrong-password" ||
            error.code ===
            "auth/user-not-found"
        ){

            alert(
                "Username/Email or password is incorrect."
            );

        }
        else if(
            error.code ===
            "permission-denied"
        ){

            alert(
                "Login permission denied. Check Firestore Rules."
            );

        }
        else{

            alert(
                "Login failed: " +
                error.message
            );

        }

    }

});

</script>

</body>
</html>
