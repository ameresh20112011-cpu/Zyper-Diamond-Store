<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Zyper Diamond Store - Login</title>

<link
rel="stylesheet"
href="index.css"
>

<link
rel="stylesheet"
href="media.css"
>

<link
rel="icon"
href="1.jpg"
>


<style>

/* ==================================================
   LOGIN HEADER
================================================== */

.login-header{

    text-align:center;

    margin-bottom:28px;

}


/* ==================================================
   LOGO
================================================== */

.company-logo{

    width:76px !important;
    height:76px !important;

    min-width:76px !important;
    min-height:76px !important;

    max-width:76px !important;
    max-height:76px !important;

    margin:
        0 auto 15px !important;

    padding:0 !important;

    border-radius:50% !important;

    overflow:hidden !important;

    display:flex !important;

    align-items:center !important;
    justify-content:center !important;

    background:#ffffff;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.20);

}


.company-logo img{

    width:100% !important;

    height:100% !important;

    display:block !important;

    object-fit:cover !important;

    border-radius:50% !important;

}


/* ==================================================
   BRAND
================================================== */

.brand-name{

    margin:0;

    font-size:24px;

    font-weight:800;

}


.brand-subtitle{

    margin:
        7px 0 0;

    font-size:13px;

    opacity:.7;

}


/* ==================================================
   PASSWORD
================================================== */

.password-group{

    position:relative;

}


.password-group input{

    padding-right:
        58px !important;

}


/* ==================================================
   PASSWORD EYE
================================================== */

.password-toggle{

    position:absolute;

    right:7px;

    top:50%;

    transform:
        translateY(-50%);

    width:44px;

    height:44px;

    padding:0;

    margin:0;

    border:0;

    outline:0;

    border-radius:50%;

    background:
        transparent;

    color:inherit;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:999;

    touch-action:manipulation;

    -webkit-tap-highlight-color:
        transparent;

    user-select:none;

    -webkit-user-select:none;

}


.password-toggle:active{

    transform:
        translateY(-50%)
        scale(.90);

}


.password-toggle svg{

    width:21px;

    height:21px;

    pointer-events:none;

}


/* ==================================================
   STATUS
================================================== */

.login-status{

    display:none;

    text-align:center;

    margin-top:15px;

    padding:10px;

    border-radius:10px;

    font-size:13px;

    font-weight:600;

}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:500px){

    .company-logo{

        width:68px !important;
        height:68px !important;

        min-width:68px !important;
        min-height:68px !important;

        max-width:68px !important;
        max-height:68px !important;

    }


    .brand-name{

        font-size:21px;

    }


    /*
       iPhone Safari input zoom prevention
    */

    input{

        font-size:16px !important;

    }


    .password-toggle{

        width:46px;

        height:46px;

        right:4px;

    }

}

</style>

</head>


<body>


<div class="login-container">


<div class="login-card">


<!-- ==================================================
     HEADER
================================================== -->

<div class="login-header">


<div class="company-logo">

<img
src="1.jpg"
alt="Zyper Diamond Store"
>

</div>


<h2 class="brand-name">

Zyper Diamond Store

</h2>


<p class="brand-subtitle">

Welcome back! Sign in to continue

</p>


</div>



<!-- ==================================================
     LOGIN FORM
================================================== -->

<form
id="loginForm"
class="login-form"
novalidate
>


<!-- EMAIL -->

<div class="form-group">


<div class="input-group neu-input">


<input
type="email"
id="email"
name="email"
required
autocomplete="email"
inputmode="email"
placeholder=" "
>


<label for="email">

Email Address

</label>


</div>


</div>



<!-- ==================================================
     PASSWORD
================================================== -->

<div class="form-group">


<div
class="input-group neu-input password-group"
>


<input
type="password"
id="password"
name="password"
required
autocomplete="current-password"
placeholder=" "
>


<label for="password">

Password

</label>



<button
type="button"
id="passwordToggle"
class="password-toggle"
aria-label="Show password"
aria-pressed="false"
>


<!-- EYE OPEN -->

<svg
id="eyeOpen"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round"
>

<path
d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
/>

<circle
cx="12"
cy="12"
r="3"
/>

</svg>



<!-- EYE CLOSED -->

<svg
id="eyeClosed"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round"
style="display:none;"
>

<path
d="M17.94 17.94A10.07 10.07 0 0 1 12 20"
/>

<path
d="M9.9 4.24A9.12 9.12 0 0 1 12 4"
/>

<path
d="M3 3l18 18"
/>

<path
d="M6.71 6.71C3.93 8.5 2 12 2 12s4 8 10 8c1.52 0 2.9-.38 4.12-.98"
/>

<path
d="M14.12 14.12A3 3 0 0 1 9.88 9.88"
/>

<path
d="M17.29 17.29C20.07 15.5 22 12 22 12s-4-8-10-8c-.72 0-1.41.09-2.06.24"
/>

</svg>


</button>


</div>


</div>



<!-- ==================================================
     OPTIONS
================================================== -->

<div class="form-options">


<div class="remember-wrapper">


<input
type="checkbox"
id="remember"
name="remember"
checked
>


<label
for="remember"
class="checkbox-label"
>


<div class="neu-checkbox">


<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="3"
>

<polyline
points="20 6 9 17 4 12"
/>

</svg>


</div>


Remember me


</label>


</div>



<a
href="./forgot-password.html"
class="forgot-link"
>

Forgot password?

</a>


</div>



<!-- ==================================================
     LOGIN BUTTON
================================================== -->

<button
type="submit"
class="neu-button login-btn"
id="loginButton"
>


<span id="loginText">

Sign In

</span>


<span
id="loginLoading"
style="display:none;"
>

Signing in...

</span>


</button>



<div
id="loginStatus"
class="login-status"
role="status"
aria-live="polite"
>
</div>


</form>



<!-- ==================================================
     REGISTER
================================================== -->

<div class="signup-link">


<p>

Don't have an account?

<a href="./register.html">

Create Account

</a>

</p>


</div>


</div>


</div>



<!-- ==================================================
     FIREBASE LOGIN
================================================== -->

<script type="module">


/*
   IMPORTANT:

   Do NOT initialize another Firebase app here.

   Every page now uses the SAME firebase.js
   and SAME Firebase Auth instance.
*/

import {
    auth
}
from
"./firebase.js";


import {

    signInWithEmailAndPassword,

    setPersistence,

    browserLocalPersistence,

    browserSessionPersistence,

    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



/* ==================================================
   ELEMENTS
================================================== */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const passwordToggle =
    document.getElementById(
        "passwordToggle"
    );


const eyeOpen =
    document.getElementById(
        "eyeOpen"
    );


const eyeClosed =
    document.getElementById(
        "eyeClosed"
    );


const rememberInput =
    document.getElementById(
        "remember"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const loginText =
    document.getElementById(
        "loginText"
    );


const loginLoading =
    document.getElementById(
        "loginLoading"
    );


const loginStatus =
    document.getElementById(
        "loginStatus"
    );



let loginInProgress =
    false;



/* ==================================================
   STATUS
================================================== */

function showStatus(
    message,
    type = "error"
){

    loginStatus.style.display =
        "block";


    loginStatus.textContent =
        message;


    if(
        type ===
        "success"
    ){

        loginStatus.style.color =
            "#4ade80";


        loginStatus.style.background =
            "rgba(34,197,94,.10)";

    }
    else{

        loginStatus.style.color =
            "#fca5a5";


        loginStatus.style.background =
            "rgba(239,68,68,.10)";

    }

}



function clearStatus(){

    loginStatus.style.display =
        "none";


    loginStatus.textContent =
        "";

}



/* ==================================================
   LOGIN BUTTON STATE
================================================== */

function setLoading(
    loading
){

    loginButton.disabled =
        loading;


    loginText.style.display =
        loading
        ?
        "none"
        :
        "inline";


    loginLoading.style.display =
        loading
        ?
        "inline"
        :
        "none";

}



/* ==================================================
   PASSWORD SHOW / HIDE
================================================== */

function togglePassword(){

    const currentlyHidden =

        passwordInput.type ===
        "password";


    if(
        currentlyHidden
    ){

        passwordInput.type =
            "text";


        eyeOpen.style.display =
            "none";


        eyeClosed.style.display =
            "block";


        passwordToggle.setAttribute(
            "aria-label",
            "Hide password"
        );


        passwordToggle.setAttribute(
            "aria-pressed",
            "true"
        );

    }
    else{

        passwordInput.type =
            "password";


        eyeOpen.style.display =
            "block";


        eyeClosed.style.display =
            "none";


        passwordToggle.setAttribute(
            "aria-label",
            "Show password"
        );


        passwordToggle.setAttribute(
            "aria-pressed",
            "false"
        );

    }

}



/*
   Prevent phone tap from moving
   input focus before toggling.
*/

passwordToggle.addEventListener(

    "pointerdown",

    function(event){

        event.preventDefault();

    }

);


passwordToggle.addEventListener(

    "click",

    function(event){

        event.preventDefault();

        event.stopPropagation();

        togglePassword();

        passwordInput.focus({
            preventScroll:true
        });

    }

);



/* ==================================================
   IF ALREADY LOGGED IN
================================================== */

const unsubscribe =

onAuthStateChanged(

    auth,

    function(user){


        /*
           When user manually submits Login,
           submit handler controls redirect.

           Otherwise if a logged-in customer
           opens index.html, send them Home.
        */

        if(
            user
            &&
            !loginInProgress
        ){

            window.location.replace(
                "./home.html"
            );

        }

    }

);



/* ==================================================
   LOGIN
================================================== */

loginForm.addEventListener(

    "submit",

    async function(event){


        event.preventDefault();


        clearStatus();


        const email =
            emailInput.value
                .trim();


        const password =
            passwordInput.value;



        /* EMAIL */

        if(!email){

            showStatus(
                "Please enter your email."
            );


            emailInput.focus();

            return;

        }



        /* PASSWORD */

        if(!password){

            showStatus(
                "Please enter your password."
            );


            passwordInput.focus();

            return;

        }



        loginInProgress =
            true;


        setLoading(
            true
        );


        try{


            /* ==================================================
               REMEMBER ME

               Checked:
               Keep logged in after browser closes.

               Not checked:
               Keep logged in during this browser session.
            ================================================== */

            if(
                rememberInput.checked
            ){

                await setPersistence(
                    auth,
                    browserLocalPersistence
                );

            }
            else{

                await setPersistence(
                    auth,
                    browserSessionPersistence
                );

            }



            /* ==================================================
               FIREBASE LOGIN
            ================================================== */

            const result =

                await signInWithEmailAndPassword(

                    auth,

                    email,

                    password

                );



            if(
                !result.user
            ){

                throw new Error(
                    "Login session was not created."
                );

            }



            /*
               Force token creation before
               opening Home.

               This helps Wallet / Worker
               recognize logged-in user
               immediately.
            */

            await result.user.getIdToken(
                true
            );



            showStatus(
                "Login successful ✓",
                "success"
            );



            /*
               Use replace so Back button
               does not return to Login.
            */

            setTimeout(

                function(){

                    window.location.replace(
                        "./home.html"
                    );

                },

                350

            );


        }
        catch(error){


            console.error(
                "LOGIN ERROR:",
                error
            );


            loginInProgress =
                false;


            setLoading(
                false
            );


            let message =
                "Unable to login. Please try again.";



            if(
                error.code ===
                "auth/invalid-credential"
                ||
                error.code ===
                "auth/wrong-password"
            ){

                message =
                    "Incorrect email or password.";

            }


            else if(
                error.code ===
                "auth/user-not-found"
            ){

                message =
                    "No account found with this email.";

            }


            else if(
                error.code ===
                "auth/invalid-email"
            ){

                message =
                    "Please enter a valid email address.";

            }


            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                message =
                    "Too many login attempts. Please try again later.";

            }


            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                message =
                    "Network error. Check your internet connection.";

            }


            showStatus(
                message
            );

        }

    }

);



/* ==================================================
   INPUT CHANGE
================================================== */

emailInput.addEventListener(

    "input",

    clearStatus

);


passwordInput.addEventListener(

    "input",

    clearStatus

);



/* ==================================================
   CLEANUP
================================================== */

window.addEventListener(

    "pagehide",

    function(){

        if(
            typeof unsubscribe ===
            "function"
        ){

            unsubscribe();

        }

    }

);

</script>


</body>

</html>
