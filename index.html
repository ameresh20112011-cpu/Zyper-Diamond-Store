<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Zyper Diamond Store - Login</title>

<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="media.css">

<link rel="icon" href="1.jpg">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <!-- COMPANY LOGO -->

        <div class="login-header">

            <div class="company-logo">

                <img
                src="1.jpg"
                alt="Zyper Diamond Store">

            </div>

            <h2>Welcome Back</h2>

            <p>Login to Zyper Diamond Store</p>

        </div>


        <!-- LOGIN FORM -->

        <form
        class="login-form"
        id="loginForm"
        novalidate>


            <!-- USERNAME / EMAIL -->

            <div class="form-group">

                <div class="input-group neu-input">

                    <input
                    type="text"
                    id="loginAccount"
                    name="loginAccount"
                    required
                    autocomplete="username"
                    placeholder=" ">

                    <label for="loginAccount">
                        Username or Email
                    </label>

                    <div class="input-icon">

                        <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2">

                            <path
                            d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>

                            <circle
                            cx="12"
                            cy="7"
                            r="4"/>

                        </svg>

                    </div>

                </div>

                <span
                class="error-message"
                id="accountError"></span>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <div class="input-group neu-input password-group">

                    <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    placeholder=" ">

                    <label for="password">
                        Password
                    </label>


                    <div class="input-icon">

                        <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2">

                            <rect
                            x="3"
                            y="11"
                            width="18"
                            height="11"
                            rx="2"/>

                            <path
                            d="M7 11V7a5 5 0 0110 0v4"/>

                        </svg>

                    </div>


                    <!-- PASSWORD BUTTON -->

                    <button
                    type="button"
                    id="passwordToggle"
                    class="password-toggle neu-toggle"
                    aria-label="Show password">

                        <svg
                        class="eye-open"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2">

                            <path
                            d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>

                            <circle
                            cx="12"
                            cy="12"
                            r="3"/>

                        </svg>


                        <svg
                        class="eye-closed"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        style="display:none;">

                            <path
                            d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>

                            <path
                            d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>

                            <line
                            x1="1"
                            y1="1"
                            x2="23"
                            y2="23"/>

                        </svg>

                    </button>

                </div>

                <span
                class="error-message"
                id="passwordError"></span>

            </div>


            <!-- OPTIONS -->

            <div class="form-options">

                <div class="remember-wrapper">

                    <input
                    type="checkbox"
                    id="remember"
                    name="remember">

                    <label
                    for="remember"
                    class="checkbox-label">

                        <div class="neu-checkbox">

                            <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="3">

                                <polyline
                                points="20 6 9 17 4 12"/>

                            </svg>

                        </div>

                        Remember me

                    </label>

                </div>


                <a
                href="forgot-password.html"
                class="forgot-link">

                    Forgot password?

                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button
            type="submit"
            class="neu-button login-btn"
            id="loginButton">

                <span id="loginText">
                    Sign In
                </span>

                <span
                id="loginLoading"
                style="display:none;">

                    Signing in...

                </span>

            </button>


            <!-- MESSAGE -->

            <p
            id="loginMessage"
            style="
            display:none;
            text-align:center;
            margin-top:15px;
            ">

            </p>

        </form>


        <!-- REGISTER -->

        <div class="signup-link">

            <p>

                Don't have an account?

                <a href="register.html">
                    Sign up
                </a>

            </p>

        </div>


    </div>

</div>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    limit
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyCd_2LplLOl4TOGjbWQqndwHNGzPh2PEHM",

    authDomain:
    "zyper-d-iamond-store.firebaseapp.com",

    projectId:
    "zyper-d-iamond-store",

    storageBucket:
    "zyper-d-iamond-store.firebasestorage.app",

    messagingSenderId:
    "892467477866",

    appId:
    "1:892467477866:web:61e9b6ff9435798da23913"

};



/* ================= INITIALIZE ================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);



/* ================= ELEMENTS ================= */

const form =
document.getElementById("loginForm");

const accountInput =
document.getElementById("loginAccount");

const passwordInput =
document.getElementById("password");

const passwordToggle =
document.getElementById("passwordToggle");

const eyeOpen =
passwordToggle.querySelector(".eye-open");

const eyeClosed =
passwordToggle.querySelector(".eye-closed");

const loginButton =
document.getElementById("loginButton");

const loginText =
document.getElementById("loginText");

const loginLoading =
document.getElementById("loginLoading");

const loginMessage =
document.getElementById("loginMessage");



/* ================= PASSWORD TOGGLE ================= */

passwordToggle.addEventListener(
"click",
() => {

    if (
        passwordInput.type ===
        "password"
    ) {

        passwordInput.type =
        "text";

        eyeOpen.style.display =
        "none";

        eyeClosed.style.display =
        "block";

        passwordToggle.setAttribute(
            "aria-label",
            "Hide password"
        );

    }

    else {

        passwordInput.type =
        "password";

        eyeOpen.style.display =
        "block";

        eyeClosed.style.display =
        "none";

        passwordToggle.setAttribute(
            "aria-label",
            "Show password"
        );

    }

});



/* ================= CHECK EXISTING LOGIN ================= */

onAuthStateChanged(
auth,
(user) => {

    if (user) {

        window.location.href =
        "home.html";

    }

});



/* ================= FIND EMAIL FROM USERNAME ================= */

async function getEmailFromUsername(
username
) {

    const usersRef =
    collection(
        db,
        "users"
    );


    const usernameQuery =
    query(
        usersRef,
        where(
            "username",
            "==",
            username
        ),
        limit(1)
    );


    const snapshot =
    await getDocs(
        usernameQuery
    );


    if (
        snapshot.empty
    ) {

        return null;

    }


    const userData =
    snapshot.docs[0].data();


    return userData.email || null;

}



/* ================= LOGIN ================= */

form.addEventListener(
"submit",
async (e) => {

    e.preventDefault();


    const account =
    accountInput.value.trim();

    const password =
    passwordInput.value;


    if (!account) {

        alert(
            "Please enter your username or email."
        );

        accountInput.focus();

        return;

    }


    if (!password) {

        alert(
            "Please enter your password."
        );

        passwordInput.focus();

        return;

    }


    loginButton.disabled =
    true;

    loginText.style.display =
    "none";

    loginLoading.style.display =
    "inline";


    try {

        let email =
        account;


        /* USERNAME LOGIN */

        if (
            !account.includes("@")
        ) {

            email =
            await getEmailFromUsername(
                account
            );


            if (!email) {

                throw {
                    code:
                    "user-not-found"
                };

            }

        }


        /* FIREBASE LOGIN */

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        loginMessage.textContent =
        "Login successful! Redirecting...";

        loginMessage.style.display =
        "block";

        loginMessage.style.color =
        "#00c853";


        setTimeout(
        () => {

            window.location.href =
            "home.html";

        },
        800
        );


    }

    catch (error) {

        console.error(error);


        loginButton.disabled =
        false;

        loginText.style.display =
        "inline";

        loginLoading.style.display =
        "none";


        if (
            error.code ===
            "auth/invalid-credential" ||
            error.code ===
            "auth/wrong-password" ||
            error.code ===
            "auth/user-not-found"
        ) {

            alert(
                "Username/Email or password is incorrect."
            );

        }

        else if (
            error.code ===
            "auth/too-many-requests"
        ) {

            alert(
                "Too many login attempts. Please try again later."
            );

        }

        else {

            alert(
                "Login failed: " +
                (error.message ||
                "Unknown error")
            );

        }

    }

});

</script>

</body>
</html>
