<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Orders - Zyper Diamond Store</title>

<style>

body{

margin:0;

font-family:Arial,sans-serif;

background:#0f172a;

color:white;

}

h2{

text-align:center;

color:#60a5fa;

margin-top:20px;

}

.order-card{

background:#1e293b;

margin:20px;

padding:20px;

border-radius:15px;

box-shadow:0 0 15px rgba(0,0,0,0.3);

}

.status{

font-weight:bold;

font-size:18px;

}

.pending{

color:#facc15;

}

.approved{

color:#22c55e;

}

.rejected{

color:#ef4444;

}

.track-btn,
.home-btn{

width:90%;

margin:15px auto;

display:block;

padding:13px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}

.track-btn{

width:100%;

margin-top:10px;

}

.empty{

text-align:center;

margin-top:50px;

font-size:18px;

}

.login-btn{

background:#7c3aed;

}

</style>

</head>


<body>


<h2>
📜 My Order History
</h2>


<div id="orders">

<p class="empty">
⏳ Loading orders...
</p>

</div>


<button
class="home-btn"
id="homeButton">

🏠 Go Home

</button>



<script type="module">


/* =========================================
USE THE SAME FIREBASE.JS
========================================= */

import {
auth,
db
} from "./firebase.js";


import {
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
collection,
query,
where,
getDocs
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
ELEMENTS
========================================= */

const ordersDiv =
document.getElementById("orders");

const homeButton =
document.getElementById("homeButton");


/* =========================================
HOME
========================================= */

homeButton.onclick =
function(){

window.location.href =
"index.html";

};


/* =========================================
AUTH CHECK
========================================= */

onAuthStateChanged(

auth,

async function(user){

/* =========================================
NOT LOGGED IN
========================================= */

if(!user){

ordersDiv.innerHTML = `

<p class="empty">

❌ Please Login First

</p>

<button
class="home-btn login-btn"
id="loginButton">

🔐 Login Now

</button>

`;

document
.getElementById("loginButton")
.onclick =
function(){

window.location.href =
"index.html";

};

return;

}


/* =========================================
LOGGED IN
========================================= */

try{

ordersDiv.innerHTML = `

<p class="empty">

⏳ Loading your orders...

</p>

`;


/* =========================================
FIRESTORE QUERY
========================================= */

const ordersRef =
collection(
db,
"orders"
);


const q =
query(

ordersRef,

where(
"userId",
"==",
user.uid
)

);


const snapshot =
await getDocs(q);


/* =========================================
NO ORDERS
========================================= */

if(snapshot.empty){

ordersDiv.innerHTML = `

<p class="empty">

📦 No Orders Found

<br><br>

You haven't placed any orders yet.

</p>

`;

return;

}


/* =========================================
CLEAR LOADING
========================================= */

ordersDiv.innerHTML = "";


/* =========================================
DISPLAY ORDERS
========================================= */

snapshot.forEach(

function(orderSnapshot){

const data =
orderSnapshot.data();


const orderId =
data.orderId ||
orderSnapshot.id;


const gameUID =
data.gameUID ||
data.uid ||
"-";


const packageName =
data.package ||
data.productName ||
data.product ||
"-";


const price =
data.price ||
data.productPrice ||
data.total ||
0;


const status =
data.status ||
"Pending";


/* =========================================
STATUS
========================================= */

let statusClass =
"pending";

let statusText =
"⏳ Pending";


if(
status === "Approved" ||
status === "Success"
){

statusClass =
"approved";

statusText =
"✅ Approved";

}


if(
status === "Rejected"
){

statusClass =
"rejected";

statusText =
"❌ Rejected";

}


/* =========================================
DATE
========================================= */

let orderDate =
"";


if(data.createdAt){

try{

if(
typeof data.createdAt.toDate ===
"function"
){

orderDate =
data.createdAt
.toDate()
.toLocaleString();

}else{

orderDate =
new Date(
data.createdAt
).toLocaleString();

}

}catch{

orderDate = "";

}

}


/* =========================================
ORDER CARD
========================================= */

ordersDiv.innerHTML += `

<div class="order-card">

<h3>
💎 Diamond Order
</h3>


<p>

<b>Order ID:</b><br>

${escapeHTML(orderId)}

</p>


<p>

<b>Game UID:</b><br>

${escapeHTML(gameUID)}

</p>


<p>

<b>Package:</b><br>

${escapeHTML(packageName)}

</p>


<p>

<b>Price:</b><br>

LKR ${Number(price).toLocaleString("en-US")}

</p>


<p>

<b>Status:</b>

<span
class="status ${statusClass}">

${statusText}

</span>

</p>


${
orderDate
?
`
<p>

<b>Order Date:</b><br>

${escapeHTML(orderDate)}

</p>
`
:
""
}


<button
class="track-btn"
data-order-id="${escapeHTML(orderId)}">

🔎 Track Order

</button>


</div>

`;

});


/* =========================================
TRACK BUTTONS
========================================= */

document
.querySelectorAll(".track-btn")
.forEach(

function(button){

button.addEventListener(

"click",

function(){

const id =
button.dataset.orderId;


window.location.href =
"track.html?id=" +
encodeURIComponent(id);

}

);

}

);


}catch(error){

console.error(
"History error:",
error
);


ordersDiv.innerHTML = `

<p class="empty">

❌ Unable to load orders.

<br><br>

${escapeHTML(
error.message
)}

</p>

`;

}

});


/* =========================================
SECURITY DISPLAY HELPER
========================================= */

function escapeHTML(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

</script>

</body>

</html>
