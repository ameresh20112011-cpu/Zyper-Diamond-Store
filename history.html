/* =====================================================
   RESET
===================================================== */

/* =====================================================
   BACKGROUND
===================================================== */

body::before{

    height:420px;

    left:-190px;

    top:140px;

    border-radius:50%;

    background:

    pointer-events:none;

}


body::after{

    background:

    z-index:-1;

/* =====================================================
   PAGE
===================================================== */

   HERO HEADER
===================================================== */

/* =====================================================
   TABS
===================================================== */

.history-tabs{

    0

    padding:5px;

    repeat(2,1fr);

    gap:5px;

.history-tab{

/* =====================================================

===================================================== */

.history-section{

}

/* =====================================================
   SECTION CARD
===================================================== */

.history-section{

/* =====================================================
   SECTION HEADER
===================================================== */

.section-header{

.section-header h2{

/* =====================================================
   ORDER CARD
===================================================== */

.order-card{

/* =====================================================
   ORDER GRID
===================================================== */

.order-grid{

<script type="module">


import {
    auth,
    db
}
from "./firebase.js";


import {
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   WORKER
===================================================== */

const WORKER_URL =
"https://zyper-order.ameresh20112011.workers.dev";


/* =====================================================
   ELEMENTS
===================================================== */

const orderTab =
document.getElementById(
    "orderTab"
);


const walletTab =
document.getElementById(
    "walletTab"
);


const orderSection =
document.getElementById(
    "orderSection"
);


const walletSection =
document.getElementById(
    "walletSection"
);


const ordersDiv =
document.getElementById(
    "orders"
);


const walletTransactionsDiv =
document.getElementById(
    "walletTransactions"
);


const refreshOrders =
document.getElementById(
    "refreshOrders"
);


const refreshWallet =
document.getElementById(
    "refreshWallet"
);


let currentUser =
null;


/* =====================================================
   MONEY
===================================================== */

function money(value){

    return Number(
        value || 0
    )
    .toLocaleString(
        "en-LK",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );
}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );
}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(value){

    if(!value){

        return "";
    }


    try{


        if(
            typeof value.toDate ===
            "function"
        ){

            return value
                .toDate()
                .toLocaleString();
        }


        if(
            value.seconds
        ){

            return new Date(
                Number(
                    value.seconds
                ) * 1000
            )
            .toLocaleString();
        }


        const date =
        new Date(
            value
        );


        if(
            !Number.isNaN(
                date.getTime()
            )
        ){

            return date
                .toLocaleString();
        }


    }
    catch(error){

        console.error(
            "Date error:",
            error
        );
    }


    return "";
}


/* =====================================================
   TABS
===================================================== */

function showOrders(){

    orderTab
        .classList
        .add(
            "active"
        );


    walletTab
        .classList
        .remove(
            "active"
        );


    orderSection
        .classList
        .add(
            "active"
        );


    walletSection
        .classList
        .remove(
            "active"
        );
}


function showWallet(){

    walletTab
        .classList
        .add(
            "active"
        );


    orderTab
        .classList
        .remove(
            "active"
        );


    walletSection
        .classList

        );


    orderSection
        .classList

        );
}


orderTab.addEventListener(
    "click",
    showOrders
);


walletTab.addEventListener(
    "click",
    showWallet
);


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(user){


    ordersDiv.innerHTML = `

        <div class="empty">

            <i class="fa-solid fa-spinner fa-spin"></i>

            <br><br>

            Loading your orders...

        </div>

    `;


    try{


        const ordersRef =
        collection(
            db,
            "orders"
        );


        const ordersQuery =
        query(
            ordersRef,

            where(
                "userId",
                "==",
                user.uid
            )
        );


        const snapshot =
        await getDocs(
            ordersQuery
        );


        if(
            snapshot.empty
        ){

            ordersDiv.innerHTML = `

                <div class="empty">

                    <i class="fa-solid fa-box-open"></i>

                    <br><br>

                    <strong>No Orders Found</strong>

                    <br><br>

                    You haven't placed any orders yet.

                </div>

            `;

            return;
        }


        const orderList =
        [];


        snapshot.forEach(
            function(
                orderSnapshot
            ){

                orderList.push({

                    id:
                    orderSnapshot.id,

                    data:
                    orderSnapshot.data()

                });
            }
        );


        orderList.sort(
            function(a,b){

                const dateA =
                getSortableDate(
                    a.data.createdAt
                );


                const dateB =
                getSortableDate(
                    b.data.createdAt
                );


                return (
                    dateB -
                    dateA
                );
            }
        );


        ordersDiv.innerHTML =
        "";


        orderList.forEach(
            function(item){


                const data =
                item.data;


                const orderId =
                data.orderId ||
                item.id;


                const gameUID =
                data.gameUID ||
                data.uid ||
                "-";


                const packageName =
                data.package ||
                data.productName ||
                data.product ||
                "-";


                const quantity =
                Math.max(
                    1,
                    Number(
                        data.quantity ||
                        1
                    )
                );


                const unitPrice =
                Number(
                    data.unitPrice ??
                    data.productPrice ??
                    (
                        data.total != null
                        ?
                        Number(
                            data.total
                        ) /
                        quantity
                        :
                        data.price ??
                        0
                    )
                );


                const total =
                Number(
                    data.total ??
                    data.price ??
                    (
                        unitPrice *
                        quantity
                    )
                );


                const rawStatus =
                String(
                    data.status ||
                    "Processing"
                )
                .trim();


                const normalizedStatus =
                rawStatus
                .toLowerCase()
                .replace(
                    /[_-]+/g,
                    " "
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


                let statusClass =
                "processing";


                let statusText =
                "⏳ Processing";


                if(
                    normalizedStatus ===
                    "success" ||

                    normalizedStatus ===
                    "approved"
                ){

                    statusClass =
                    "success";

                    statusText =
                    "✅ Success";
                }

                else if(
                    normalizedStatus ===
                    "pending review"
                ){

                    statusClass =
                    "review";

                    statusText =
                    "⚠️ Pending Review";
                }

                else if(
                    normalizedStatus ===
                    "failed" ||

                    normalizedStatus ===
                    "rejected"
                ){

                    statusClass =
                    "failed";


                    statusText =
                    normalizedStatus ===
                    "rejected"

                    ?

                    "❌ Rejected"

                    :

                    "❌ Failed";
                }

                else if(
                    normalizedStatus ===
                    "pending"
                ){

                    statusClass =
                    "review";

                    statusText =
                    "⏳ Pending";
                }


                const verifiedPlayerName =
                (
                    data.playerVerified ===
                    true ||

                    String(
                        data.playerNameSource ||
                        ""
                    )
                    .toLowerCase() ===
                    "provider"
                )

                ?

                (
                    data.playerName ||

                    data.verifiedPlayerName ||

                    data.providerPlayerName ||

                    "-"
                )

                :

                (
                    normalizedStatus ===
                    "success"

                    ?

                    (
                        data.verifiedPlayerName ||

                        data.providerPlayerName ||

                        "Verified name unavailable"
                    )

                    :

                    "Processing..."
                );


                const walletState =
                String(
                    data.walletState ||
                    ""
                )
                .toLowerCase();


                let walletText =
                "-";


                let walletClass =
                "";


                if(
                    walletState ===
                    "held"
                ){

                    walletText =
                    `🔒 LKR ${money(total)} Held`;

                    walletClass =
                    "wallet-held";
                }


                else if(
                    walletState ===
                    "deducted"
                ){

                    const used =
                    Number(
                        data.walletAmountUsed ??
                        total
                    );


                    walletText =
                    `💳 LKR ${money(used)} Deducted`;

                    walletClass =
                    "wallet-deducted";
                }


                else if(
                    walletState ===
                    "released"
                ){

                    walletText =
                    `↩️ LKR ${money(total)} Released`;

                    walletClass =
                    "wallet-released";
                }


                const orderDate =
                formatDate(
                    data.createdAt
                );


                const completedDate =
                formatDate(
                    data.completedAt ||
                    data.providerSuccessAt
                );


                const card =
                document.createElement(
                    "div"
                );


                card.className =
                "order-card";


                card.innerHTML = `

                    <h3>

                        <i class="fa-solid fa-gem"></i>

                        Zyper Order

                    </h3>


                    <div class="order-grid">


                        <div class="order-info">

                            <span>
                                ORDER ID
                            </span>

                            <strong>
                                ${escapeHTML(orderId)}
                            </strong>

                        </div>


                        <div class="order-info">

                            <span>
                                STATUS
                            </span>

                            <strong
                            class="status ${statusClass}"
                            >
                                ${statusText}
                            </strong>

                        </div>


                        <div class="order-info">

                            <span>
                                GAME UID
                            </span>

                            <strong>
                                ${escapeHTML(gameUID)}
                            </strong>

                        </div>


                        <div class="order-info">

                            <span>
                                VERIFIED FF NAME
                            </span>

                            <strong>
                                ${escapeHTML(
                                    verifiedPlayerName
                                )}
                            </strong>

                        </div>


                        <div class="order-info">

                            <span>
                                PACKAGE
                            </span>

                            <strong>
                                ${escapeHTML(
                                    packageName
                                )}
                            </strong>

                        </div>


                        <div class="order-info">

                            <span>
                                QUANTITY
                            </span>

                            <strong>
                                ×${escapeHTML(
                                    quantity
                                )}
                            </strong>

                        </div>


                        <div class="order-info">

                            <span>
                                UNIT PRICE
                            </span>

                            <strong>
                                LKR ${money(unitPrice)}
                            </strong>

                        </div>


                        <div class="order-info">

                            <span>
                                TOTAL
                            </span>

                            <strong>
                                LKR ${money(total)}
                            </strong>

                        </div>


                        <div class="order-info full">

                            <span>
                                WALLET
                            </span>

                            <strong
                            class="${walletClass}"
                            >
                                ${walletText}
                            </strong>

                        </div>


                        ${
                            orderDate
                            ?
                            `

                            <div class="order-info">

                                <span>
                                    ORDERED
                                </span>

                                <strong>
                                    ${escapeHTML(
                                        orderDate
                                    )}
                                </strong>

                            </div>

                            `
                            :
                            ""
                        }


                        ${
                            completedDate &&
                            normalizedStatus ===
                            "success"

                            ?

                            `

                            <div class="order-info">

                                <span>
                                    COMPLETED
                                </span>

                                <strong>
                                    ${escapeHTML(
                                        completedDate
                                    )}
                                </strong>

                            </div>

                            `

                            :

                            ""
                        }


                    </div>


                    <button
                    class="track-btn"
                    data-order-id="${escapeHTML(orderId)}"
                    >

                        <i class="fa-solid fa-location-dot"></i>

                        Track Order

                    </button>

                `;


                ordersDiv.appendChild(
                    card
                );
            }
        );


        document
        .querySelectorAll(
            ".track-btn[data-order-id]"
        )
        .forEach(
            function(button){

                button.addEventListener(
                    "click",
                    function(){

                        const id =
                        button
                        .dataset
                        .orderId;


                        window.location.href =
                        "track.html?id=" +
                        encodeURIComponent(
                            id
                        );
                    }
                );
            }
        );


    }
    catch(error){


        console.error(
            "Order History Error:",
            error
        );


        ordersDiv.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <br><br>

                Unable to load orders.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;
    }
}


/* =====================================================
   SORTABLE FIRESTORE DATE
===================================================== */

function getSortableDate(value){

    try{


        if(!value){

            return 0;
        }


        if(
            typeof value.toDate ===
            "function"
        ){

            return value
                .toDate()
                .getTime();
        }


        if(
            value.seconds
        ){

            return Number(
                value.seconds
            )
            *
            1000;
        }


        const date =
        new Date(
            value
        );


        return Number.isNaN(
            date.getTime()
        )

        ?

        0

        :

        date.getTime();


    }
    catch{

        return 0;
    }
}


/* =====================================================
   LOAD WALLET HISTORY
===================================================== */

async function loadWalletHistory(user){


    walletTransactionsDiv.innerHTML = `

        <div class="empty">

            <i class="fa-solid fa-spinner fa-spin"></i>

            <br><br>

            Loading wallet history...

        </div>

    `;


    try{


        const token =
        await user.getIdToken();


        const response =
        await fetch(
            WORKER_URL,
            {

                method:
                "POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "Authorization":
                    `Bearer ${token}`

                },

                body:
                JSON.stringify({

                    action:
                    "wallet_transactions"

                })

            }
        );


        const result =
        await response.json();


        if(
            !response.ok ||
            !result.success
        ){

            throw new Error(

                result.message ||

                "Unable to load wallet history."

            );
        }


        const transactions =
        Array.isArray(
            result.transactions
        )

        ?

        result.transactions

        :

        [];


        if(
            transactions.length ===
            0
        ){

            walletTransactionsDiv.innerHTML = `

                <div class="empty">

                    <i class="fa-solid fa-wallet"></i>

                    <br><br>

                    <strong>
                        No Wallet History Found
                    </strong>

                    <br><br>

                    Your wallet activity will appear here.

                </div>

            `;

            return;
        }


        walletTransactionsDiv.innerHTML =
        "";


        transactions.forEach(
            function(transaction){


                const type =
                String(
                    transaction.type ||
                    ""
                )
                .toUpperCase();


                const amount =
                Number(
                    transaction.amount ||
                    0
                );


                const balanceAfter =
                Number(
                    transaction.balanceAfter ??
                    0
                );


                const date =
                formatDate(
                    transaction.createdAt
                );


                let icon =
                "💰";


                let title =
                "Wallet Transaction";


                let amountClass =
                "deposit";


                let sign =
                "";


                if(
                    type ===
                    "DEPOSIT"
                ){

                    icon =
                    "➕";

                    title =
                    "Wallet Recharge";

                    amountClass =
                    "deposit";

                    sign =
                    "+";
                }


                else if(
                    type ===
                    "HOLD" ||

                    type ===
                    "ORDER_HOLD"
                ){

                    icon =
                    "🔒";

                    title =
                    "Order Amount Held";

                    amountClass =
                    "refund";

                    sign =
                    "";
                }


                else if(
                    type ===
                    "HOLD_FINALIZED" ||

                    type ===
                    "FINALIZE_HOLD" ||

                    type ===
                    "SPEND"
                ){

                    icon =
                    "💳";

                    title =
                    "Order Payment";

                    amountClass =
                    "spend";

                    sign =
                    "-";
                }


                else if(
                    type ===
                    "HOLD_RELEASED" ||

                    type ===
                    "RELEASE_HOLD" ||

                    type ===
                    "REFUND"
                ){

                    icon =
                    "↩️";

                    title =
                    "Money Released";

                    amountClass =
                    "refund";

                    sign =
                    "+";
                }


                let meta =
                "";


                if(
                    transaction.redeemCode
                ){

                    meta +=

                    `Code: ${
                        escapeHTML(
                            transaction.redeemCode
                        )
                    }`;
                }


                if(
                    transaction.orderId
                ){

                    if(meta){

                        meta +=
                        "<br>";
                    }


                    meta +=

                    `Order ID: ${
                        escapeHTML(
                            transaction.orderId
                        )
                    }`;
                }


                if(
                    transaction.package
                ){

                    if(meta){

                        meta +=
                        "<br>";
                    }


                    meta +=

                    `Package: ${
                        escapeHTML(
                            transaction.package
                        )
                    }`;
                }


                if(
                    transaction.quantity
                ){

                    if(meta){

                        meta +=
                        "<br>";
                    }


                    meta +=

                    `Quantity: ×${
                        escapeHTML(
                            transaction.quantity
                        )
                    }`;
                }


                if(date){

                    if(meta){

                        meta +=
                        "<br>";
                    }


                    meta +=
                    escapeHTML(
                        date
                    );
                }


                const row =
                document.createElement(
                    "div"
                );


                row.className =
                "wallet-transaction";


                row.innerHTML = `

                    <div class="transaction-left">


                        <div class="transaction-icon">

                            ${icon}

                        </div>


                        <div class="transaction-details">


                            <div class="transaction-title">

                                ${title}

                            </div>


                            <div class="transaction-meta">

                                ${
                                    meta ||
                                    "-"
                                }

                            </div>


                        </div>


                    </div>


                    <div class="transaction-right">


                        <div
                        class="transaction-amount ${amountClass}"
                        >

                            ${sign}LKR ${money(amount)}

                        </div>


                        <div class="balance-after">

                            Balance:
                            LKR ${money(balanceAfter)}

                        </div>


                    </div>

                `;


                walletTransactionsDiv
                .appendChild(
                    row
                );

            }
        );


    }
    catch(error){


        console.error(
            "Wallet History Error:",
            error
        );


        walletTransactionsDiv.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <br><br>

                Unable to load wallet history.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;
    }
}

/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){


        currentUser =
        user ||
        null;


        if(!user){


            ordersDiv.innerHTML = `

                <div class="empty">

                    <i class="fa-solid fa-lock"></i>

                    <br><br>

                    Login to view your order history.

                    <br><br>

                    <a
                    href="./index.html"
                    >
                        LOGIN
                    </a>

                </div>

            `;


            walletTransactionsDiv.innerHTML = `

                <div class="empty">

                    <i class="fa-solid fa-lock"></i>

                    <br><br>

                    Login to view your wallet history.

                    <br><br>

                    <a
                    href="./index.html"
                    >
                        LOGIN
                    </a>

                </div>

            `;


            return;
        }


        await Promise.all([

            loadOrders(
                user
            ),

            loadWalletHistory(
                user
            )

        ]);

    }
);
