<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Orders - Zyper Diamond Store</title>

<link rel="stylesheet" href="zyper-nav.css">

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:Arial,sans-serif;

background:
linear-gradient(
135deg,
#020617,
#0f172a,
#312e81
);

color:white;

min-height:100vh;

padding-bottom:100px;

}

h2{

text-align:center;

color:#60a5fa;

margin-top:20px;

margin-bottom:25px;

}

.order-card{

background:
rgba(30,41,59,.95);

margin:20px;

padding:20px;

border-radius:15px;

box-shadow:
0 0 15px rgba(0,0,0,0.3);

border:
1px solid rgba(255,255,255,.08);

}

.order-card h3{

margin-top:0;

color:#c084fc;

}

.order-card p{

line-height:1.6;

color:#e2e8f0;

}

.status{

font-weight:bold;

font-size:18px;

display:inline-block;

margin-left:5px;

}

.pending{

color:#facc15;

}

.success{

color:#22c55e;

}

.rejected{

color:#ef4444;

}

.track-btn{

width:100%;

margin-top:15px;

display:block;

padding:13px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.2s;

}

.track-btn:hover{

transform:translateY(-2px);

opacity:.9;

}

.track-btn:active{

transform:scale(.97);

}

.empty{

text-align:center;

margin-top:50px;

font-size:18px;

color:#cbd5e1;

padding:20px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

.order-card{

margin:15px;

padding:17px;

}

h2{

font-size:22px;

}

}

</style>

</head>


<body>


<h2>
📜 My Order History
</h2>


<div id="orders">

<p class="empty">
⏳ Loading orders...
</p>

</div>


<!-- =====================================================
     ZYPER NAVIGATION
===================================================== -->

<div id="zyper-navigation"></div>


<script type="module">


/* =========================================
FIREBASE
========================================= */

import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
collection,
query,
where,
getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
ELEMENTS
========================================= */

const ordersDiv =
document.getElementById("orders");


/* =========================================
AUTH CHECK
========================================= */

onAuthStateChanged(

auth,

async function(user){


/* =========================================
NOT LOGGED IN
========================================= */

if(!user){

ordersDiv.innerHTML = `

<p class="empty">

❌ Please Login First

</p>

<button
class="track-btn"
id="loginButton"
style="max-width:300px;margin:20px auto;background:#7c3aed;">

🔐 Login Now

</button>

`;


const loginButton =
document.getElementById(
"loginButton"
);


if(loginButton){

loginButton.onclick =
function(){

window.location.href =
"index.html";

};

}

return;

}


/* =========================================
LOGGED IN
========================================= */

try{


ordersDiv.innerHTML = `

<p class="empty">

⏳ Loading your orders...

</p>

`;


/* =========================================
FIRESTORE ORDERS
========================================= */

const ordersRef =
collection(
db,
"orders"
);


/* =========================================
ONLY CURRENT USER ORDERS
========================================= */

const q =
query(

ordersRef,

where(
"userId",
"==",
user.uid
)

);


/* =========================================
GET ORDERS
========================================= */

const snapshot =
await getDocs(q);


/* =========================================
NO ORDERS
========================================= */

if(snapshot.empty){

ordersDiv.innerHTML = `

<p class="empty">

📦 No Orders Found

<br><br>

You haven't placed any orders yet.

</p>

`;

return;

}


/* =========================================
CLEAR LOADING
========================================= */

ordersDiv.innerHTML = "";


/* =========================================
DISPLAY ORDERS
========================================= */

snapshot.forEach(

function(orderSnapshot){

const data =
orderSnapshot.data();


/* =========================================
ORDER ID
========================================= */

const orderId =
data.orderId ||
orderSnapshot.id;


/* =========================================
FREE FIRE UID
========================================= */

const gameUID =
data.gameUID ||
data.uid ||
"-";


/* =========================================
PACKAGE
========================================= */

const packageName =
data.package ||
data.productName ||
data.product ||
"-";


/* =========================================
PRICE
========================================= */

const price =
data.price ??
data.productPrice ??
data.total ??
0;


/* =========================================
STATUS
========================================= */

const rawStatus =
String(
data.status ||
"Pending"
)
.trim();


const normalizedStatus =
rawStatus.toLowerCase();


let statusClass =
"pending";

let statusText =
"⏳ Pending";


/* =========================================
APPROVED = SUCCESS
========================================= */

if(

normalizedStatus ===
"approved"

){

statusClass =
"success";

statusText =
"✅ Success";

}


/* =========================================
SUCCESS
========================================= */

else if(

normalizedStatus ===
"success"

){

statusClass =
"success";

statusText =
"✅ Success";

}


/* =========================================
REJECTED
========================================= */

else if(

normalizedStatus ===
"rejected"

){

statusClass =
"rejected";

statusText =
"❌ Rejected";

}


/* =========================================
PENDING
========================================= */

else if(

normalizedStatus ===
"pending"

){

statusClass =
"pending";

statusText =
"⏳ Pending";

}


/* =========================================
OTHER STATUS
========================================= */

else{

statusClass =
"pending";

statusText =
"⏳ " +
escapeHTML(rawStatus);

}


/* =========================================
DATE
========================================= */

let orderDate =
"";


if(data.createdAt){

try{


/*
FIRESTORE TIMESTAMP
*/

if(

typeof data.createdAt.toDate ===
"function"

){

orderDate =
data.createdAt
.toDate()
.toLocaleString();

}


/*
FIRESTORE REST TIMESTAMP
*/

else if(

data.createdAt.seconds

){

orderDate =
new Date(

Number(
data.createdAt.seconds
) * 1000

)
.toLocaleString();

}


/*
NORMAL DATE
*/

else{

const convertedDate =
new Date(
data.createdAt
);


if(
!isNaN(
convertedDate.getTime()
)
){

orderDate =
convertedDate
.toLocaleString();

}

}

}catch(error){

console.error(
"Date error:",
error
);

orderDate = "";

}

}


/* =========================================
CREATE ORDER CARD
========================================= */

ordersDiv.innerHTML += `

<div class="order-card">


<h3>
💎 Diamond Order
</h3>


<p>

<b>Order ID:</b>

<br>

${escapeHTML(orderId)}

</p>


<p>

<b>Game UID:</b>

<br>

${escapeHTML(gameUID)}

</p>


<p>

<b>Package:</b>

<br>

${escapeHTML(packageName)}

</p>


<p>

<b>Price:</b>

<br>

LKR ${Number(price).toLocaleString("en-US")}

</p>


<p>

<b>Status:</b>

<span
class="status ${statusClass}">

${statusText}

</span>

</p>


${
orderDate
?
`

<p>

<b>Order Date:</b>

<br>

${escapeHTML(orderDate)}

</p>

`
:
""
}


<button
class="track-btn"
data-order-id="${escapeHTML(orderId)}">

🔎 Track Order

</button>


</div>

`;

});


/* =========================================
TRACK BUTTONS
========================================= */

document
.querySelectorAll(".track-btn")
.forEach(

function(button){

button.addEventListener(

"click",

function(){

const id =
button.dataset.orderId;


window.location.href =
"track.html?id=" +
encodeURIComponent(id);

}

);

});


}catch(error){


console.error(
"History error:",
error
);


ordersDiv.innerHTML = `

<p class="empty">

❌ Unable to load orders.

<br><br>

${escapeHTML(
error.message
)}

</p>

`;

}

});


/* =========================================
SECURITY DISPLAY HELPER
========================================= */

function escapeHTML(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

</script>


<!-- =====================================================
     ZYPER NAVIGATION SCRIPT
===================================================== -->

<script src="zyper-nav.js"></script>


</body>

</html>
