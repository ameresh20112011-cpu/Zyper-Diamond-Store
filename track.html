<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Track Order - Zyper Diamond Store</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:
'Segoe UI',
Arial,
sans-serif;

background:
linear-gradient(
135deg,
#020617,
#0f172a,
#312e81
);

color:white;

min-height:100vh;

}

.container{

padding:20px;

display:flex;

justify-content:center;

}

.card{

width:100%;

max-width:450px;

background:
rgba(255,255,255,.08);

backdrop-filter:
blur(15px);

padding:25px;

border-radius:25px;

border:
1px solid rgba(255,255,255,.15);

box-shadow:
0 20px 50px rgba(0,0,0,.4);

}

.logo{

text-align:center;

font-size:45px;

}

.title{

text-align:center;

font-size:27px;

font-weight:800;

background:
linear-gradient(
90deg,
#60a5fa,
#c084fc
);

-webkit-background-clip:text;

background-clip:text;

color:transparent;

}

.subtitle{

text-align:center;

color:#cbd5e1;

margin-bottom:20px;

}

.loading,
.error{

text-align:center;

padding:20px;

}

.error{

background:
rgba(239,68,68,.12);

border:
1px solid rgba(239,68,68,.3);

border-radius:15px;

color:#fca5a5;

}

.order-box{

background:
rgba(15,23,42,.75);

border-radius:18px;

padding:18px;

margin-top:15px;

}

.order-id{

text-align:center;

font-size:35px;

font-weight:800;

letter-spacing:4px;

color:#60a5fa;

margin-bottom:20px;

}

.info{

padding:12px 0;

border-bottom:
1px solid rgba(255,255,255,.08);

}

.info:last-child{

border-bottom:none;

}

.label{

font-size:12px;

color:#94a3b8;

margin-bottom:5px;

}

.value{

font-size:16px;

font-weight:600;

word-break:break-word;

}

.email{

color:#c084fc;

}

.price{

color:#60a5fa;

font-size:20px;

}

.status{

display:inline-block;

padding:7px 12px;

border-radius:20px;

font-size:14px;

font-weight:bold;

}

.pending{

background:
rgba(250,204,21,.15);

color:#facc15;

}

.approved{

background:
rgba(34,197,94,.15);

color:#22c55e;

}

.rejected{

background:
rgba(239,68,68,.15);

color:#ef4444;

}

.home-button{

display:block;

text-align:center;

text-decoration:none;

padding:14px;

margin-top:20px;

border-radius:14px;

background:
linear-gradient(
90deg,
#2563eb,
#7c3aed
);

color:white;

font-weight:bold;

}

.back-button{

display:block;

text-align:center;

text-decoration:none;

padding:13px;

margin-top:12px;

border-radius:14px;

background:#334155;

color:white;

font-weight:bold;

}

.login-button{

display:block;

text-align:center;

text-decoration:none;

padding:14px;

margin-top:15px;

border-radius:14px;

background:#7c3aed;

color:white;

font-weight:bold;

}

</style>

</head>


<body>


<div class="container">

<div class="card">

<div class="logo">
💎
</div>

<h2 class="title">
Track Your Order
</h2>

<p class="subtitle">
Zyper Diamond Store
</p>


<div id="content">

<div class="loading">

⏳ Loading order...

</div>

</div>


<a
href="home.html"
class="home-button">

🏠 Home

</a>


<a
href="history.html"
class="back-button">

📜 My Order History

</a>

</div>

</div>



<script type="module">


/* =====================================================
FIREBASE
===================================================== */

import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
ELEMENTS
===================================================== */

const content =
document.getElementById("content");


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(value ?? "")

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
GET ORDER ID
===================================================== */

const params =
new URLSearchParams(
window.location.search
);

const orderId =
params.get("id");


/* =====================================================
NO ORDER ID
===================================================== */

if(!orderId){

content.innerHTML = `

<div class="error">

❌ Order ID not found.

<br><br>

Please select an order from
your order history.

</div>

`;

}


/* =====================================================
AUTH
===================================================== */

onAuthStateChanged(

auth,

async function(user){

if(!orderId){

return;

}


/* =====================================================
NOT LOGGED IN
===================================================== */

if(!user){

content.innerHTML = `

<div class="error">

🔐 Please login to view
your order.

</div>

<a
href="index.html"
class="login-button">

🔐 Login Now

</a>

`;

return;

}


/* =====================================================
LOAD ORDER
===================================================== */

try{

const orderRef =
doc(
db,
"orders",
orderId
);


const orderSnapshot =
await getDoc(
orderRef
);


if(!orderSnapshot.exists()){

content.innerHTML = `

<div class="error">

❌ Order not found.

<br><br>

Order ID:
<b>${escapeHTML(orderId)}</b>

</div>

`;

return;

}


const data =
orderSnapshot.data();


/* =====================================================
SECURITY
===================================================== */

if(
data.userId &&
data.userId !== user.uid
){

content.innerHTML = `

<div class="error">

❌ You are not authorized
to view this order.

</div>

`;

return;

}


/* =====================================================
ORDER DATA
===================================================== */

const displayOrderId =
data.orderId ||
orderId;


const email =
data.customerEmail ||
data.email ||
user.email ||
"Email not available";


const gameUID =
data.gameUID ||
data.uid ||
"-";


const customerName =
data.customerName ||
data.playerName ||
"-";


const phone =
data.phone ||
"-";


const packageName =
data.package ||
data.productName ||
data.product ||
"-";


const price =
data.price ??
data.productPrice ??
data.total ??
0;


const paymentMethod =
data.paymentMethod ||
"Payment Receipt";


const status =
String(
data.status ||
"Pending"
).trim();


/* =====================================================
STATUS
===================================================== */

let statusClass =
"pending";

let statusText =
"⏳ Pending";


if(
status.toLowerCase() ===
"approved" ||

status.toLowerCase() ===
"success"
){

statusClass =
"approved";

statusText =
"✅ Approved";

}


if(
status.toLowerCase() ===
"rejected"
){

statusClass =
"rejected";

statusText =
"❌ Rejected";

}


/* =====================================================
DATE
===================================================== */

let orderDate =
"-";


if(data.createdAt){

try{

if(
typeof data.createdAt.toDate ===
"function"
){

orderDate =
data.createdAt
.toDate()
.toLocaleString();

}

else if(
data.createdAt.seconds
){

orderDate =
new Date(
data.createdAt.seconds * 1000
)
.toLocaleString();

}

else{

orderDate =
new Date(
data.createdAt
)
.toLocaleString();

}

}catch{

orderDate =
"-";

}

}


/* =====================================================
DISPLAY
===================================================== */

content.innerHTML = `

<div class="order-box">


<div class="order-id">

#${escapeHTML(displayOrderId)}

</div>


<div class="info">

<div class="label">
📧 CUSTOMER EMAIL
</div>

<div class="value email">

${escapeHTML(email)}

</div>

</div>


<div class="info">

<div class="label">
🎮 FREE FIRE UID
</div>

<div class="value">

${escapeHTML(gameUID)}

</div>

</div>


<div class="info">

<div class="label">
👤 CUSTOMER NAME
</div>

<div class="value">

${escapeHTML(customerName)}

</div>

</div>


<div class="info">

<div class="label">
📱 PHONE
</div>

<div class="value">

${escapeHTML(phone)}

</div>

</div>


<div class="info">

<div class="label">
📦 PACKAGE
</div>

<div class="value">

${escapeHTML(packageName)}

</div>

</div>


<div class="info">

<div class="label">
💰 PRICE
</div>

<div class="value price">

LKR ${Number(price).toLocaleString("en-US")}

</div>

</div>


<div class="info">

<div class="label">
💳 PAYMENT METHOD
</div>

<div class="value">

${escapeHTML(paymentMethod)}

</div>

</div>


<div class="info">

<div class="label">
📊 STATUS
</div>

<div class="value">

<span class="status ${statusClass}">

${statusText}

</span>

</div>

</div>


<div class="info">

<div class="label">
📅 ORDER DATE
</div>

<div class="value">

${escapeHTML(orderDate)}

</div>

</div>


</div>

`;

}catch(error){

console.error(
"Track order error:",
error
);


content.innerHTML = `

<div class="error">

❌ Unable to load order.

<br><br>

${escapeHTML(
error.message
)}

</div>

`;

}

});

</script>

</body>

</html>
