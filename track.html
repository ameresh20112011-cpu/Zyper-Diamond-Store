<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Track Order - Zyper Diamond Store</title>

<link rel="stylesheet" href="zyper-nav.css">

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:
'Segoe UI',
Arial,
sans-serif;

background:
linear-gradient(
135deg,
#020617,
#0f172a,
#312e81
);

color:white;

min-height:100vh;

padding:20px;

padding-bottom:100px;

}

.container{

width:100%;

max-width:450px;

margin:auto;

}

.card{

background:
rgba(255,255,255,.08);

backdrop-filter:
blur(15px);

-webkit-backdrop-filter:
blur(15px);

border:
1px solid rgba(255,255,255,.15);

border-radius:25px;

padding:25px;

box-shadow:
0 20px 50px rgba(0,0,0,.4);

}

.logo{

text-align:center;

font-size:48px;

}

.title{

text-align:center;

font-size:26px;

font-weight:800;

background:
linear-gradient(
90deg,
#60a5fa,
#c084fc
);

-webkit-background-clip:text;

background-clip:text;

color:transparent;

margin-top:8px;

}

.subtitle{

text-align:center;

color:#cbd5e1;

font-size:14px;

margin-bottom:25px;

}

.loading{

text-align:center;

color:#93c5fd;

padding:30px 5px;

}

.error{

display:none;

background:
rgba(239,68,68,.12);

border:
1px solid rgba(239,68,68,.35);

color:#fca5a5;

padding:15px;

border-radius:12px;

text-align:center;

margin-bottom:15px;

}

.order-id-box{

text-align:center;

background:
linear-gradient(
135deg,
rgba(37,99,235,.20),
rgba(124,58,237,.20)
);

border:
1px solid rgba(255,255,255,.12);

border-radius:18px;

padding:18px;

margin-bottom:20px;

}

.order-label{

font-size:12px;

color:#94a3b8;

}

.order-id{

font-size:34px;

font-weight:800;

letter-spacing:4px;

color:#60a5fa;

margin-top:7px;

}

.info{

background:
rgba(15,23,42,.7);

border:
1px solid rgba(255,255,255,.08);

border-radius:15px;

padding:15px;

margin-top:12px;

}

.info-label{

font-size:12px;

color:#94a3b8;

margin-bottom:5px;

}

.info-value{

font-size:16px;

font-weight:600;

word-break:break-word;

}

.status-box{

text-align:center;

padding:20px;

margin-top:20px;

border-radius:18px;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.1);

}

.status{

font-size:22px;

font-weight:800;

}

.pending{

color:#facc15;

}

.success{

color:#22c55e;

}

.rejected{

color:#ef4444;

}

.status-description{

color:#cbd5e1;

font-size:13px;

margin-top:8px;

line-height:1.6;

}

.button{

display:block;

width:100%;

padding:14px;

margin-top:20px;

border:none;

border-radius:14px;

text-align:center;

text-decoration:none;

font-size:16px;

font-weight:bold;

color:white;

cursor:pointer;

background:
linear-gradient(
90deg,
#2563eb,
#7c3aed
);

transition:.2s;

}

.button:hover{

transform:translateY(-2px);

}

.home-button{

background:#334155;

}

</style>

</head>


<body>


<div class="container">


<div class="card">


<div class="logo">
💎
</div>


<div class="title">
Track Order
</div>


<div class="subtitle">
Zyper Diamond Store
</div>


<div
id="error"
class="error">
</div>


<div
id="loading"
class="loading">

⏳ Loading order...

</div>


<div
id="orderContent"
style="display:none;">


<!-- ORDER ID -->

<div class="order-id-box">

<div class="order-label">
ORDER ID
</div>

<div
id="orderId"
class="order-id">
0000
</div>

</div>


<!-- CUSTOMER EMAIL -->

<div class="info">

<div class="info-label">
📧 Customer Email
</div>

<div
id="customerEmail"
class="info-value">
-
</div>

</div>


<!-- CUSTOMER NAME -->

<div class="info">

<div class="info-label">
👤 Customer Name
</div>

<div
id="customerName"
class="info-value">
-
</div>

</div>


<!-- PHONE -->

<div class="info">

<div class="info-label">
📱 Phone
</div>

<div
id="phone"
class="info-value">
-
</div>

</div>


<!-- UID -->

<div class="info">

<div class="info-label">
🎮 Free Fire UID
</div>

<div
id="gameUID"
class="info-value">
-
</div>

</div>


<!-- PACKAGE -->

<div class="info">

<div class="info-label">
📦 Package
</div>

<div
id="package"
class="info-value">
-
</div>

</div>


<!-- PRICE -->

<div class="info">

<div class="info-label">
💰 Price
</div>

<div
id="price"
class="info-value">
LKR 0
</div>

</div>


<!-- PAYMENT -->

<div class="info">

<div class="info-label">
💳 Payment Method
</div>

<div
id="paymentMethod"
class="info-value">
-
</div>

</div>


<!-- DATE -->

<div class="info">

<div class="info-label">
📅 Order Date
</div>

<div
id="createdAt"
class="info-value">
-
</div>

</div>


<!-- STATUS -->

<div class="status-box">

<div
id="status"
class="status pending">

⏳ Pending

</div>


<div
id="statusDescription"
class="status-description">

Your payment is being checked.
Please wait.

</div>

</div>


<!-- HOME -->

<a
href="home.html"
class="button home-button">

🏠 Back to Home

</a>


<!-- HISTORY -->

<a
href="history.html"
class="button">

📜 My Order History

</a>


</div>

</div>

</div>


<!-- =====================================================
     ZYPER NAVIGATION
===================================================== -->

<div id="zyper-navigation"></div>


<script type="module">


/* =========================================
FIREBASE
========================================= */

import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
ELEMENTS
========================================= */

const loading =
document.getElementById(
"loading"
);

const errorBox =
document.getElementById(
"error"
);

const orderContent =
document.getElementById(
"orderContent"
);


/* =========================================
GET ORDER ID
========================================= */

const params =
new URLSearchParams(
window.location.search
);

const orderId =
params.get("id");


/* =========================================
ERROR
========================================= */

function showError(message){

loading.style.display =
"none";

orderContent.style.display =
"none";

errorBox.textContent =
message;

errorBox.style.display =
"block";

}


/* =========================================
NO ORDER ID
========================================= */

if(!orderId){

showError(
"❌ Order ID is missing."
);

}


/* =========================================
AUTH
========================================= */

if(orderId){

onAuthStateChanged(

auth,

async function(user){


/* =====================================
NOT LOGGED IN
===================================== */

if(!user){

showError(
"❌ Please login first."
);

return;

}


/* =====================================
LOAD ORDER
===================================== */

try{

const orderRef =
doc(
db,
"orders",
orderId
);


const orderSnapshot =
await getDoc(
orderRef
);


/* =====================================
ORDER NOT FOUND
===================================== */

if(!orderSnapshot.exists()){

showError(
"❌ Order not found."
);

return;

}


const data =
orderSnapshot.data();


/* =====================================
SECURITY
===================================== */

if(
data.userId &&
data.userId !== user.uid
){

showError(
"❌ You cannot view this order."
);

return;

}


/* =====================================
ORDER ID
===================================== */

document
.getElementById(
"orderId"
)
.textContent =
data.orderId ||
orderId;


/* =====================================
EMAIL
===================================== */

const email =
data.customerEmail ||
data.email ||
user.email ||
"Email not available";


document
.getElementById(
"customerEmail"
)
.textContent =
email;


/* =====================================
CUSTOMER NAME
===================================== */

document
.getElementById(
"customerName"
)
.textContent =
data.customerName ||
data.playerName ||
"-";


/* =====================================
PHONE
===================================== */

document
.getElementById(
"phone"
)
.textContent =
data.phone ||
"-";


/* =====================================
UID
===================================== */

document
.getElementById(
"gameUID"
)
.textContent =
data.gameUID ||
data.uid ||
"-";


/* =====================================
PACKAGE
===================================== */

const packageName =
data.package ||
data.productName ||
data.product ||
"-";


document
.getElementById(
"package"
)
.textContent =
packageName;


/* =====================================
PRICE
===================================== */

const price =
Number(
data.price ||
data.productPrice ||
data.total ||
0
);


document
.getElementById(
"price"
)
.textContent =
"LKR " +
price.toLocaleString(
"en-US"
);


/* =====================================
PAYMENT METHOD
===================================== */

document
.getElementById(
"paymentMethod"
)
.textContent =
data.paymentMethod ||
"Payment Receipt";


/* =====================================
DATE
===================================== */

let dateText =
"-";


if(data.createdAt){

try{

if(
typeof data.createdAt.toDate ===
"function"
){

dateText =
data.createdAt
.toDate()
.toLocaleString();

}else{

dateText =
new Date(
data.createdAt
).toLocaleString();

}

}catch{

dateText =
"-";

}

}


document
.getElementById(
"createdAt"
)
.textContent =
dateText;


/* =====================================
STATUS
===================================== */

const statusValue =
String(
data.status ||
"Pending"
).trim();


const statusElement =
document.getElementById(
"status"
);


const descriptionElement =
document.getElementById(
"statusDescription"
);


/* =====================================
SUCCESS
===================================== */

if(
statusValue.toLowerCase() ===
"success"
){

statusElement.className =
"status success";

statusElement.textContent =
"✅ Success";

descriptionElement.textContent =
"Your order has been successfully completed. Thank you for shopping with Zyper Diamond Store.";

}


/* =====================================
PENDING
===================================== */

else if(
statusValue.toLowerCase() ===
"pending"
){

statusElement.className =
"status pending";

statusElement.textContent =
"⏳ Pending";

descriptionElement.textContent =
"Your payment is being checked. Please wait.";

}


/* =====================================
REJECTED
===================================== */

else if(
statusValue.toLowerCase() ===
"rejected"
){

statusElement.className =
"status rejected";

statusElement.textContent =
"❌ Rejected";

descriptionElement.textContent =
"Your order was rejected. Please contact Zyper Diamond Store if you need help.";

}


/* =====================================
UNKNOWN STATUS
===================================== */

else{

statusElement.className =
"status pending";

statusElement.textContent =
"⏳ Pending";

descriptionElement.textContent =
"Your order is being processed.";

}


/* =====================================
SHOW
===================================== */

loading.style.display =
"none";

orderContent.style.display =
"block";


}catch(error){

console.error(
"Track order error:",
error
);

showError(
"❌ Unable to load order: " +
error.message
);

}

});

}

</script>


<!-- =====================================================
     ZYPER NAVIGATION SCRIPT
===================================================== -->

<script src="zyper-nav.js"></script>


</body>

</html>
