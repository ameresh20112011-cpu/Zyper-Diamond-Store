<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zyper Diamond Store - Payment</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:'Segoe UI',Arial,sans-serif;
background:
linear-gradient(135deg,#020617,#0f172a,#1e1b4b);

color:white;
min-height:100vh;

}


.container{

padding:20px;
display:flex;
justify-content:center;

}


.card{

width:100%;
max-width:420px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,0.15);

padding:25px;

border-radius:25px;

box-shadow:
0 20px 50px rgba(0,0,0,0.4);

animation:show .5s ease;

}



@keyframes show{

from{

transform:translateY(30px);
opacity:0;

}

to{

transform:translateY(0);
opacity:1;

}

}



.logo{

text-align:center;
font-size:40px;

}



.title{

text-align:center;
font-size:26px;
font-weight:800;

background:linear-gradient(90deg,#60a5fa,#c084fc);

-webkit-background-clip:text;
background-clip:text;

color:transparent;

}



.subtitle{

text-align:center;
color:#cbd5e1;
margin-bottom:25px;

}




.method{

background:
linear-gradient(
135deg,
rgba(37,99,235,.3),
rgba(139,92,246,.3)
);

padding:20px;

border-radius:18px;

border:1px solid rgba(255,255,255,.15);

}


.method h3{

margin-top:0;

}



.info{

display:flex;
justify-content:space-between;

background:rgba(0,0,0,.25);

padding:12px;

border-radius:10px;

margin:10px 0;

}



.label{

color:#cbd5e1;

}



.value{

font-weight:bold;

color:#fff;

}



.instruction{

margin-top:25px;

background:rgba(255,255,255,.05);

padding:15px;

border-radius:15px;

line-height:28px;

color:#e2e8f0;

}



button{

width:100%;

padding:15px;

margin-top:20px;

border:none;

border-radius:15px;

font-size:17px;

font-weight:bold;

cursor:pointer;

color:white;


background:
linear-gradient(
90deg,
#2563eb,
#7c3aed
);


box-shadow:
0 10px 25px rgba(37,99,235,.4);


transition:.3s;

}



button:hover{

transform:translateY(-3px);

}



.back{

background:#334155;

box-shadow:none;

}



.footer{

text-align:center;

margin-top:20px;

color:#94a3b8;

font-size:13px;

}


</style>


</head>



<body>



<div class="container">


<div class="card">


<div class="logo">
💎
</div>


<div class="title">

Zyper Diamond Store

</div>


<div class="subtitle">

Secure Payment Gateway

</div>




<div class="method">


<h3>
🏦 Bank Transfer
</h3>



<div class="info">

<span class="label">
Bank
</span>

<span class="value">
BOC
</span>

</div>



<div class="info">

<span class="label">
Account
</span>

<span class="value">
94946893
</span>

</div>



<div class="info">

<span class="label">
Name
</span>

<span class="value">
Ameresh R
</span>

</div>



</div>




<div class="instruction">


<h3>
📌 How To Pay
</h3>


<p>
1️⃣ Choose your diamond package
</p>


<p>
2️⃣ Complete payment using above details
</p>


<p>
3️⃣ Take payment screenshot
</p>


<p>
4️⃣ Upload receipt in order page
</p>


</div>




<button onclick="location.href='order.html'">

💎 Continue Order

</button>




<button class="back" onclick="history.back()">

⬅ Go Back

</button>



<div class="footer">

🔒 Your payment information is protected

</div>



</div>


</div>



</body>

</html>
